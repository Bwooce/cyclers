  notes: |
    First computed quasi_cycler row admitted to the catalogue, validating the
    v4.7 scope expansion built earlier this session. Structurally a near-5:1
    Umbriel-Oberon synodic-resonance trajectory (T_leg = 14.94 d/leg, the
    Umbriel-Oberon synodic period is ~5.99 d, ratio 4.991 -> close to 5:1).
    Closes-up-to-rotation for 10 cycles with bounded drift oscillation between
    86,000 km and 530,000 km (peak ~530,000 km at cycle 1 then returns to
    86,000 km by cycle 5 — bounded oscillation, NOT monotonic divergence).

    Family relation (established #558 -> #568, after this row was first
    written): this Umbriel-Oberon-Umbriel (1,1) closure is the
    FIRST-DOCUMENTED member of a 30-member Uranian symmetric-closure
    quasi-cycler family — 30 exact 0-deg/180-deg symmetric periodic closures
    spread across the six non-Miranda Uranian moon-pair directions, directly
    enumerated by #563. Five sibling representatives (one per other pair:
    Titania-Oberon / Ariel-Oberon / Umbriel-Titania / Ariel-Titania /
    Ariel-Umbriel) were added to the catalogue alongside this update (#569),
    each cleared through the same V2->V4-strict gauntlet. IMPORTANT: this
    family is an INTERNALLY-ENUMERATED fact about this project's OWN search
    space, not prior art — genericity within our own search density does NOT
    change this row's literature-novelty verdict (see the literature-novelty
    paragraph below, which stands unchanged). This row is the first-found
    representative of a structured family, not a walk-back of its novelty.

    Windowed-validity correction (the #567/#568 characterization supersedes
    the sub-year DOY-sensitivity note below): the validity_window's calendar
    span {2000-06-21 -> 2083-06-21} does NOT mean continuous 83-year validity.
    It is a feasible synodic DUTY CYCLE of 79.1% (the fraction of synodic
    phase for which the transfer is V4-strict-feasible), with the
    planet_crossing_infeasible geometry boundary recurring every ~6.0 d (the
    full Umbriel-Oberon synodic period; MEASURED per #568 Sec 4). The duty
    cycle is computed over daily-2000 + daily-2030 epoch scans (#567, N=731)
    excluding drift-floor fails from the denominator. DISTINCT from this
    boundary, this row alone (none of the 5 siblings) shows a small
    ~1.3% secondary population where all legs converge but the V4-vs-V3 drift
    exceeds the 50,000 km floor (range 50,084-103,413 km; a different
    continuous-metric threshold, genuine high-perturbation-epoch physics per
    the #567 diagnosis, NOT a solver artifact). The 2000-01-15 epoch #338
    originally flagged as a ~91,000 km FAIL is now correctly classified as
    this drift-floor mechanism. See docs/notes/2026-07-11-568-writeback-
    readiness-verdict.md.

