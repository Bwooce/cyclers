  notes: |
    Representative Umbriel-Titania-Umbriel member of the Uranian symmetric-closure
    quasi-cycler family. This is an INTERNALLY-ENUMERATED family within this
    project's own search space: the #563 direct symmetric-closure enumeration
    found 30 exact 0-deg/180-deg symmetric periodic closures spread across the
    six non-Miranda Uranian moon-pair directions (Ariel/Umbriel/Titania/Oberon
    pairs). Task #312's Umbriel-Oberon-Umbriel (1,1) row was the
    FIRST-DOCUMENTED member of this family; this row is the census-minimum single
    representative for the Umbriel-Titania pair direction (#565 Sec 2/4: one rep per pair,
    the other same-pair-redundant closures are not separately catalogued).
    Genericity WITHIN this project's own search density is not prior art -- the
    family being internally enumerable does not change any literature-novelty
    verdict.

    Validation (V4, windowed -- #312-equivalent): the #566 gauntlet ran this
    candidate through the same frozen V2->V3->V4-scipy->V4-strict chain #312
    itself cleared (#330->#335), at the reference launch epoch 2000-06-21 and
    n_cycles in {3, 5, 10}. Verdict PASS_AS_QUASI_CYCLER: strict V2 is
    FAIL_QUASI_BOUNDED by design (the bounded-drift quasi_cycler signature
    exceeds the 50,000 km strict-periodic floor -- the same admission path #312
    used), with V3, V4-scipy and V4-strict all passing at all three n_cycles.

    Windowed validity (the #567/#568 characterization, NOT continuous validity):
    the feasible synodic DUTY CYCLE is 68.5% -- the fraction of synodic
    phase for which the transfer is V4-strict-feasible (its osculating periapsis
    stays outside Uranus's r_eq = 25,559 km). Measured over the combined
    daily-2000 + daily-2030 epoch scans (#567; N=731). Every failure in the scan
    is the genuine planet_crossing_infeasible geometry boundary recurring every
    7.9 d (full synodic period; MEASURED per #568 Sec 4, not a derived
    halving rule) -- zero lambert_no_solution, zero integrator_failure, zero
    drift-floor failures (cleaner on the drift axis than #312, which has its own
    ~1.3% secondary drift-floor population; this representative has none). The
    calendar span {2000-06-21 -> 2083-06-21} is the shared URA111-kernel-coverage-
    bounded interior span (same bounds convention as #312's own row, whose 2084+
    failures are kernel-edge extrapolation artifacts); it is NOT an independently
    swept per-representative annual pass run. A low duty cycle is a launch-epoch-
    must-be-timed-to-synodic-phase constraint (like an interplanetary launch
    window), a legitimate validity_window characteristic, not a validation defect
    (#568 Sec 5).

    Literature clearance: the offline literature_check.py KNOWN_CORPUS
    adjudication returns NOT-FOUND under the repeated-moon topology fingerprint;
    the only body-set-overlapping anchors are the Uranus mga-tour / mission-concept
    entries (Heaton-Longuski 2003, Sims 2014, Jarmak 2020, UOP Flagship), all a
    different topology (non-repeating flyby tours), correctly discriminated. No
    moon-pair symmetric-closure quasi-cycler anchor exists for this pair.

    Discovery + adjudication chain: #558 (family census via the #312 discovery
    genome) -> #561/#562/#563 (Fable-corrected continuous-tof commensurability
    refinement -> direct symmetric-closure enumeration; the 30-member family) ->
    #564/#565 (Opus+Fable survivor-list adjudication, 5-representative selection)
    -> #566 (V1-V4-strict gauntlet) -> #567 (epoch-robustness duty-cycle scan) ->
    #568 (writeback-readiness verdict) -> #569 (this writeback).

    Novelty status and attribution (#865, 2026-10-03; spec §16.4 policy case ii, owner
    decision #875). This row is tagged candidate-novel as a re-application of a PUBLISHED
    architecture at a system its authors did not treat, so the architecture is attributed
    in corroborating_sources (Russell & Strange 2009). How it was re-applied: SYSTEM --
    Uranus, where Russell & Strange enumerate only Jovian pairs and Titan-Enceladus.
    MODEL AND METHOD -- the same ideal circular-coplanar patched-conic free-return
    construction (the #577 adjudication found closures from this same search method at
    Jupiter to be members of their class: same model, same method). FLYBY BODY AND TARGET
    -- Russell & Strange use one massive flyby body and a passive target; here Umbriel and Titania
    BOTH supply gravity-assist bends in an A-B-A (1,1) symmetric closure. WHAT CHANGED
    PHYSICALLY -- the low V-infinity regime recorded in vinf_kms_at_encounters, at which
    mid-sized Uranian moons give useful bends (bend grows as V-infinity falls), and the
    closure is a QUASI-cycler: near-commensurate and valid over the epoch windows in
    validity_window, not an exactly periodic ideal-model cycler. Claim wording is "first
    computed", never "first predicted". The literature_check block above records the
    fresh not-found run; not-found is necessary-not-sufficient.

    Uranus Orbiter and Probe tour literature (#869, read in full 2026-10-03). Landau et
    al. 2025 (IEEE Aerospace Conference, DOI 10.1109/AERO63441.2025.11068400), Ellison
    et al. 2025 (AAS 25-668) and Simon et al. 2026 (Planetary Science Journal, DOI
    10.3847/PSJ/ae680c) publish one-off patched-conic satellite tours. None describes a
    repeating, periodic, free-return or cycler trajectory, and every tour flyby in the
    two tour papers is at V-infinity 2.6-4.5 km/s against 0.89-2.16 km/s for the six
    catalogued rows. The claim the corpus supports is therefore "no published repeating
    or periodic two-moon trajectory at Uranus, and none in this V-infinity regime". It
    is NOT "no published two-moon geometry": two of the six moon pairs appear as a
    short alternating stretch inside a published one-off tour (Umbriel-Oberon in Landau
    et al. Table 3, Ariel-Oberon in AAS 25-668 Table 8).
