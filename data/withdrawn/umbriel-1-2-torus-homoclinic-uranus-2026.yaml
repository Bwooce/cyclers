    UNDER REVIEW -- DO NOT CITE (#882, 2026-10-03). An adversarial review of this row found,
    and a direct reading of the search code and the stored result confirmed, that the
    connection below is NOT a trajectory of the CCR4BP as catalogued. The model is
    time-dependent (Titania's phase advances with time), but the search matched only the
    spacecraft state (x, y, vx, vy) between the outgoing and incoming arcs and started both
    arcs at the same forcing phase, so at the junction the two arcs disagree about where
    Titania is: t_u + t_s = 38.0957 TU = 3.1770 forcing periods, a 63.7 degree jump. The
    "machine precision" closure quoted below is a state match between arcs at different
    perturber phases. In addition the parent 1:2 orbit crosses Titania's orbit (extent
    1.477-1.698 against 1.640 Umbriel units), a case in which Kumar and Anderson (AAS
    24-288) state that no quasi-periodic equivalent can exist, and the real-ephemeris
    checks flew only the outgoing arc. The numbers below are kept unchanged as the record
    of what was computed; the phrases "new dynamical species", "closing to machine
    precision" and "real, recurring, correctable near-connection" are withdrawn. No
    novelty label is assigned. Full account: docs/notes/2026-10-03-882-umbriel-torus-
    row-adversarial-review.md. Rebuild task: #882.

    NEW dynamical species for this catalogue: a homoclinic connection to a quasi-periodic
    invariant TORUS in the CCR4BP (Concentric Circular Restricted 4-Body Problem), not a
    discrete multi-encounter Lambert-arc tour and not a single strictly-periodic orbit.
    A spacecraft riding the 2-D invariant torus around the spacecraft:Umbriel 1:2-exterior
    resonant periodic orbit (Titania-forced) can depart along the torus's unstable
    manifold, flow for t_u ~19.0 TU (~12.53 d), and return along the stable manifold of
    the SAME torus after t_s ~19.09 TU (~12.59 d) -- closing the idealized
    position/velocity gap to machine precision (corrected_pos_gap_km = 5.66e-10 km,
    corrected_vel_gap_km_s = 5.11e-14 km/s). Ghost-guard verified: independent Radau vs.
    DOP853 integrator agreement to ~1.05e-7 km; off-torus sanity distance ~1928 km (rules
    out a trivial near-departure pseudo-match).

    Real-ephemeris consistency (#704): the idealized connection does NOT survive verbatim
    under real DE440/URA111 ephemeris (headline 2030-01-01 gap: 174,709 km / 1.458 km/s)
    -- but a narrow synodic-phase window exists near each synodic cycle where the mismatch
    collapses to a comparable near-miss (best 2030 point: 84.5 km / 5.9 m/s, a ~2069x/247x
    reduction from the headline naive-epoch gap). Epoch-robustness scan (#705): this
    narrow-window structure RECURS at all 10 independently-tested anchor epochs spanning
    2000-2083 (~9-year spacing; per-epoch local-minimum gaps 5.4-142.8 km / 1.0-13.1 m/s),
    all 10/10 passing the pre-declared "comparable to the 2030 reference" gate
    (844.6 km / 0.059 km/s, 10x the reference). Closest approach to either moon across
    all 10 epochs stays far outside its physical radius (Umbriel ~181,200-181,800 km vs.
    ~584 km; Titania ~534,600-828,600 km vs. ~788 km) -- no collision-course degeneracy.
    This is evidence of a real, recurring, correctable near-connection, not a one-off
    numerical coincidence, though the evidence is 10 sparse discrete epochs with their own
    dense within-cycle scans, NOT a continuous multi-year daily scan (see data_gaps).

    Literature clearance: #699's deep novelty check (10 live queries + full corpus scan +
    full-text check of the closest adjacent paper, Kumar arXiv:2509.03655, whose Uranus
