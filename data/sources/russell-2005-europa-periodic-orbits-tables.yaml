conventions:
  frame: "Jupiter-Europa CR3BP centred at Europa (Eq. 1, p.2): x-axis 'fixed opposing the direction to Jupiter' (Jupiter at x = -1 DU), z along Europa's orbital angular momentum, y completes the right-handed set; rotating frame"
  equations: "x'' = 2v + (x+1-mu) + kappa (x+1) + mu/rE^3; y'' = -2u + y + kappa y; z'' = kappa z; kappa = -(1-mu)/rJ^3 - mu/rE^3; rJ = sqrt((x+1)^2+y^2+z^2), rE = sqrt(x^2+y^2+z^2) (Eq. 1, p.2)"
  model: "circular restricted three-body problem only; point-mass Jupiter (no J2), circular Europa orbit, no ephemeris (Eq. 1, Table 1)"
  mu: "2.528002607976249e-5 = GmE/(GmJ+GmE) (Table 1 footnote a, p.3)"
  constants: "Jupiter-Europa distance 6.709e5 km; Europa radius 1560.70 km; GmE 3202.72 km^3/s^2; GmJ 1.2668654e8 km^3/s^2 (Table 1, p.3, from Bagenal et al. 2004); DU 670900 km; TU 48822.04433066813 s (p.3)"
  units_printed: "dimensional: x0 km (from Europa's centre), v0 and w0 km/s (rotating-frame velocity), T days, J km^2/s^2, inc deg, hmin km. Nondimensional J = printed J / (DU/TU)^2 (ours: (DU/TU)^2 = 188.835509 km^2/s^2)"
  jacobi: "J = (x+1-mu)^2 + y^2 + 2(1-mu)/rJ + 2 mu/rE - u^2 - v^2 - w^2 (Eq. 2, p.2), times (DU/TU)^2 for the printed km^2/s^2; larger J = lower energy"
  state_printed: "initial state (x0, 0, 0, 0, v0, w0) on and perpendicular to the x-axis (pp.6-8, Eqs. 15, 21); v0 > 0 and w0 > 0 only (p.9); x0 > 0 starts direct, x0 < 0 retrograde (p.9)"
  N: "number of xz-plane crossings from t = 0 to the terminal symmetric crossing: T/2 for axi-symmetric, T/4 for doubly-symmetric (p.8); Nmax = 16 (Table 2)"
  period_field: "T is the full period in days: T = 2 tf (axi-symmetric) or T = 4 tf (doubly-symmetric), tf = time of the Nth crossing (p.8)"
  symmetry_field: "D = doubly-symmetric (perpendicular x-axis crossing at t=0 and perpendicular xz-plane crossing at T/4: y = u = w = 0, Eq. 21); S (printed; footnote says A) = axi-symmetric (perpendicular x-axis crossings at 0 and T/2: y = z = u = 0, Eq. 15). Confirmed by integration on all 76 rows (ours)"
  inc_field: "pseudo inclination = atan(w0/v0), 0-90 deg (footnote b); not an osculating inclination"
  hmin_field: "close approach altitude above the 1560.70 km mean radius (footnote c)"
  stability_field: "k_i = lambda_i + 1/lambda_i (p.5), the roots of the monodromy characteristic polynomial (Eqs. 9-10, 12), stable if real and |k_i| <= 2; rho = max(|lambda1|, |1/lambda1|, |lambda2|, |1/lambda2|) (Eq. 11), printed as 1 for stable orbits. Same definition as Restrepo-Russell 2018 b_i = lambda_i + 1/lambda_i (their Eq. 6, p.5). The paper does not say which k is horizontal or vertical"
  row_counts: {table_3: 76, D: 47, S: 29, stable_rho_1: 44, unstable: 32}
  not_in_this_file: "Table 1 (constants, in this block) and Table 2 (search grid; in the digest). No planar orbit is tabulated: every Table 3 row has w0 > 0"
