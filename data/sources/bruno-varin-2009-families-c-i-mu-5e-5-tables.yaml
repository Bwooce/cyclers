# Bruno & Varin 2009, Tables 1-3: families c and i of the planar circular restricted problem for mu = 5e-5.
# Source: A. D. Bruno and V. P. Varin, "Families c and i of Periodic Solutions of the Restricted Problem for
#   mu = 5 x 10^-5", Solar System Research 43(1):26-40 (2009), doi 10.1134/S0038094609010031 (Pleiades).
#   English translation of Astronomicheskii Vestnik 43(1):28-43 (2009). Received 30 April 2008.
#   The paper names KIAM Preprint 22/2008 as the preliminary publication.
# Local file: bruno2009_1.pdf, 15 pp., md5 c0de4fb82dc2ac5ce02cf8d4ad6a60a2 (digital; has a text layer).
# Table 1 (family c, 8 critical orbits): p.27, both halves on the same page.
# Table 2 (family i, 65 critical orbits): first half (k, x1(0) ... C) rows 1-45 on p.37 and rows 46-65 on p.38;
#   second half (Tr~ ... Sigma, k) rows 1-24 on p.38 and rows 25-65 on p.39. Merged here by k.
# Table 3 (crossings of the characteristics of families i and c with the line e~ = 1.4): p.40.
# Transcribed from the page images: every cell was read on 250 dpi page renders. The digital text layer was used
#   only as a typing aid, and it matched the images in every cell. No value here was computed by us; values we
#   computed appear only inside `note:` fields, marked as ours. Numbers are kept as printed (strings, trailing zeros kept); the en-dash minus is written "-".
#
# FRAME: P1 (mass 1 - mu) at the origin, P2 (mass mu) at (1, 0). y2 = dx2/dt + x1 (canonical momentum).
#   C = x1^2 - 2 mu x1 + mu + 2(1-mu)/r1 + 2 mu/r2 - v^2 (barycentric Jacobi constant + mu(1-mu)); C(L1) = 3.005756.
#
# COLUMNS
#   k; x1_0, y2_0 (start point on Pi); x1_T2, y2_T2 (half-period point on Pi)
#   T_over_2pi   printed header "T/2pi" (T~)
#   C            Jacobi constant
#   Tr_mod, Trv_mod  modified planar / vertical traces (Tr~ = Tr if |Tr| <= 2, else (1 + log2|Tr|) sgn Tr)
#   a_0, e_0, a_T2, e_T2   a~, e~ at t = 0 and T/2: e~ = x1 y2 |y2| / (1 - mu), a~ = x1 / |2 - |e~||
#   w1_T2        w1(T/2) = mu / (1 - x1(T/2)); printed positive throughout
#   Sigma        the uniformizing parameter: the total variation of C along the family from a reference orbit
#                (eq. 1); for family c, Sigma = 2.9767666 - C (reference: row 5, the orbit of maximum period)
#   "+-inf" = printed "plus-minus infinity" (collision with P1 at that point); "+-2" = printed "plus-minus 2".
#   null = blank in the print. Table 2 row 3 (P1 collision at both ends) prints only Sigma.
#   Printed 0.00000 in a_0 / e_0 / a_T2 / e_T2 / Tr_mod / Trv_mod of rows 25, 37, 38 are placeholders at a P1
#   collision. Tr_mod / Trv_mod = +-20.00000 exactly in rows 25 and 50 may also be placeholders: row 25 starts at
#   P1 and row 50 passes 2e-5 from P2 at T/2. The paper does not say.
#
# NOTES ON PRINTED CELLS (values kept as printed)
#   - Table 1 row 1 is the libration point L1 itself (x1 = y2 = x1(T/2) = y2(T/2)); its T/2pi, Tr~ and Trv~ are
#     the limits of the infinitesimal Lyapunov orbit. Our L1 linearisation reproduces 0.47395, 12.046 and 1.956.
#   - Table 2 row 61, y2_T2: printed +1.44785. Rows 59, 60 and 62 print negative values, and the row's own
#     e~(T/2) = -2.09633 needs y2(T/2) < 0. Probable sign slip.
#   - Table 2 row 43: the printed x1(0), y2(0), T~ and C are not mutually consistent at the 1e-3 level
#     (C from the t = 0 state -0.55497, from the T/2 state -0.55542; printed -0.554105). The text names orbit 43
#     among the singular parts where the authors could not compute every crossing. Unresolved.
#   - Table 2 Sigma: rows 1-24 to 3 decimals, rows 25-65 to 2 decimals. From row 7 on, Sigma runs about 0.001
#     below the total variation implied by the printed C column (see the digest); not corrected.
#   - Table 3, row 9 (family c) and rows 1, 2, 3, 4, 6 (family i): we reproduce a~ to 1e-12 by integration.
