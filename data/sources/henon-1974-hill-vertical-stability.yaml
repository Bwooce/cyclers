      - {n: "10", Q4: "-0.080774"}
  - table: "5"
    caption: "Families a and c: check on asymptotic formula for Gamma -> -inf"
    journal_page: "321"
    columns: [Gamma, a_v_formula_20, a_v_exact]
    rows:
      - {Gamma: "-4", a_v_formula_20: "-4.326", a_v_exact: "-8.215"}
      - {Gamma: "-9", a_v_formula_20: "-14.60", a_v_exact: "-18.42"}
      - {Gamma: "-16", a_v_formula_20: "-34.61", a_v_exact: "-38.37"}
