  - table: "6"
    caption: "Family g': check on asymptotic formula for Gamma -> -inf"
    journal_page: "321"
    columns: [Gamma, a_v_formula_20, a_v_exact]
    rows:
      - {Gamma: "-4", a_v_formula_20: "-2.676", a_v_exact: "-8.510"}
      - {Gamma: "-9", a_v_formula_20: "-9.030", a_v_exact: "-14.86"}
      - {Gamma: "-16", a_v_formula_20: "-21.41", a_v_exact: "-27.14"}
      - {Gamma: "-36", a_v_formula_20: "-72.24", a_v_exact: "-77.90"}
      - {Gamma: "-100", a_v_formula_20: "-334.5", a_v_exact: "-340.0"}
conventions:
  frame: "Hill's problem, eqs. (3)-(4) p.317: xi'' = 2 eta' + 3 xi - xi/rho^3, eta'' = -2 xi' - eta/rho^3, zeta'' = -zeta - zeta/rho^3; M2 at the origin, M1 on the -xi side at infinity; unit rotation rate; length unit a mu^(1/3)"
  jacobi: "Gamma = 2 Omega' - v^2 (eq. 5); plane: Gamma = 3 xi^2 + 2/rho - xi'^2 - eta'^2; larger Gamma = lower energy; same Gamma as H5 and Henon 2003"
  vertical_equation: "Delta zeta'' = -[1 + (xi^2 + eta^2)^(-3/2)] Delta zeta (eq. 6)"
  stability_index: "a_v = A_v D_v + B_v C_v = half the trace of the full-period 2x2 vertical monodromy (Paper I eqs. 9, 16); |a_v| < 1 vertically stable (p.317; Paper I eq. 17); a_v = +-1 vertical critical orbit; Type A_v/D_v -> a_v = -1, B_v/C_v -> a_v = +1 (Paper I eq. 22)"
  state_printed: "Table 1: xi0, xi1 = abscissas of the two perpendicular xi-axis crossings half a period apart; Gamma; signs of eta' at the two crossings; Type. Tables 2, 3, 5, 6: Gamma and a_v only (no xi0); the family member is fixed by Gamma and the family (H5 Tables 2-5 give xi at the same Gamma)"
  period_field: none   # no period printed; H5 Tables 2-5 give T/2 for the same families
  a_v_values_printed: "eq. (7) (L2, 0.976516); Tables 2, 3, 5, 6 'Exact value' columns (20 values); Table 1 rows named ...v carry a_v = +-1 by definition (sign from the Type)"
  symmetric_families: [a, c, f, g, "g'"]   # all symmetric about the xi axis; c = image of a under the symmetry about M2 (no rows of its own); f, g also symmetric about the eta axis
  asymmetric_families: []
  families_with_table1_rows: [a, g, "g'"]   # family f has no critical orbit: all f orbits are vertically and three-dimensionally stable (p.318)
  page_references: {eq_1_to_6: "317", eq_7: "317", table_1: "319", tables_2_3_4: "320", tables_5_6: "321", fig_1_2_3_4: "318", fig_5_6: "319", asymptotics_eq_8_to_21: "319-321"}
  row_counts: {eq7: 1, table_1: 21, table_1_family_a: 5, table_1_family_g: 5, "table_1_family_g'": 11, table_2: 6, table_3: 4, table_4: 10, table_5: 5, table_6: 5, total: 52}
  notes:
    - "Table 1 sign convention for g' differs from H5 Table 5: here xi0 = H5's second xi column and xi1 = minus H5's first xi column for the simple-periodic part (g'2: 0.073664 / -0.587694 vs H5 0.07366 / 0.58769). For the g'_2 rows, eta'_0 is printed '-' and xi0 > 0: these are the images, under the symmetry about M2, of H5's (xi < 0, eta' > 0) start (g'_2 3: here 1.743460 / -0.004302; H5 Table 5 at Gamma -4.69219: 0.004302 / -1.74346)."
    - "Witnesses (witness-comparison.tsv, 138 numeric cells; infinity signs, names, signs and types not counted): A (tesseract, whitelist) agrees on 113, loses only the minus on 19, drops a decimal point on 5 and misreads 1 (-77.90 as 7190); A2 (tesseract, no whitelist) agrees on 132 and differs on the same 6; B (Vision) agrees on 119, gives no token on 17 single-character cells (Gamma and n columns) and merges a neighbouring mark on 2. No cell has A and B agreeing with each other against the image. Every disagreement was settled on the 400 dpi crop."
    - "Recomputation (recompute_av.py / .out, ours; DOP853 rtol 1e-13 atol 1e-14, eq. 6 vertical equation, a_v = A_v D_v + B_v C_v and checked against half the full-period trace): eq. (7) L2 value 0.976516 reproduced analytically (cos 2T); all 20 'Exact value' a_v of Tables 2, 3, 5, 6 reproduced to the printed digits; for the 9 transversal vertical critical orbits of Table 1, the Gamma where a_v = +-1 and its xi0, xi1 reproduce all 6 printed decimals (27/27 cells), and the vanishing coefficient matches the printed Type in 10/10 rows; g1v is a tangency to a_v = -1 at Gamma 3.057455 (A_v = D_v = 1.3e-8 there)."
    - "Printed formula columns (crosscheck.py / .out, ours): Table 2 Gamma = 1 and 4 formula values 0.1798 and 0.8627 do not follow from the exact root of eq. (10) (0.1801, 0.8629); they are copied from H5 Table 11, where rho0 was solved about 1e-4 off (H5 transcription oddity 2). Table 4 n = 3: eq. (21) gives Q4 = -0.24070548, which rounds to -0.240705; printed -0.240706 (one unit in the last place). All other formula cells (8 of Tables 2-3, 9 of Table 4, 10 of Tables 5-6) reproduce. Kept as printed."
    - "Ejection orbit of g' (Table 1, Gamma 3.684489, xi1 -0.509084): our extrapolation of the g' family to xi0 = 0 gives Gamma 3.684488 +- 2e-6, far crossing -0.509084 (ejection_check.out), so the 1974 value stands; H5 Table 5 prints 3.68448 (looks like 3.684489 truncated, not rounded)."
    - "Henon 2003 Table VI (family Ha) maximum-Gamma row (Gamma 4.271428, xi0 0.073664, xi1 0.073664, 'critical orbit of g' described twice') is the g'2 row of Table 1 (Gamma 4.271428, xi0 0.073664): same orbit, H5 a = -1. Its a_v is NOT printed; ours (gprime2_av.out): a_v(g'2) = -0.944739 once round, so the Ha maximum (g'2 described twice) has a_v = 2 a_v^2 - 1 = 0.785065 (vertically stable). No other 1974 row shares a Gamma with the 68 Henon 2003 rows."
