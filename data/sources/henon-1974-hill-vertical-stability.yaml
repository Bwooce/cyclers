    journal_page: "320"
    columns: [Gamma, a_v_formula_14, a_v_exact]
    rows:
      - {Gamma: "5", a_v_formula_14: "0.6235", a_v_exact: "0.5388"}
      - {Gamma: "6", a_v_formula_14: "0.8285", a_v_exact: "0.8021"}
      - {Gamma: "7", a_v_formula_14: "0.9066", a_v_exact: "0.8962"}
      - {Gamma: "8", a_v_formula_14: "0.9432", a_v_exact: "0.9383"}
  - table: "4"
    caption: "Coefficient Q4 given by (21)"
    journal_page: "320"
    columns: [n, Q4]
    rows:
      - {n: "1", Q4: "-0.540757"}
      - {n: "2", Q4: "-0.334456"}
      - {n: "3", Q4: "-0.240706"}
      - {n: "4", Q4: "-0.187780"}
      - {n: "5", Q4: "-0.153869"}
      - {n: "6", Q4: "-0.130309"}
      - {n: "7", Q4: "-0.112995"}
