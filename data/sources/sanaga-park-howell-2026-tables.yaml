# Sanaga, Park and Howell 2026, Tables 2 and 3 plus the other printed numbers of the paper.
# Source: R. R. Sanaga, B. Park, K. C. Howell, "Systematic Numerical Transitions of Cislunar Trajectories Across Dynamical
#   Models", J. Astronaut. Sci. 73:10 (2026), doi 10.1007/s40295-026-00571-5. Published online 10 February 2026.
# Local file: Springer PDF, 39 pp., text layer present, md5 f604075271d2bf0ddf8507f1cd97333e. PDF page n = journal page n.
# Witnesses: A = pdftotext -layout read once; B = the same text read a second time at the digit level against the rows below;
#   C = a 130 dpi render of pp.10 and 21 (decides). All 6 + 2 x 3 table cells agree in all three. Table 1 holds no numbers
#   (it is the time-variable relation) and is not transcribed.
# No value here was computed by us; ours only in `check:` fields.
tables:
  - table: "2"
    caption: "Angular representation for JD0 = 2.2875165e+06 (Nov-28 1550)"
    journal_page: "10"
    columns: [number, frequency_nd, initial_phase_rad, meaning_of_theta_zero]
    rows:
      - {number: 1, frequency_nd: "0.991548233570925", initial_phase_rad: "3.207895704735595", meaning_of_theta_zero: "approx Moon at perigee",
         check: "27.321662 / 27.554550 (sidereal / anomalistic month, d) = 0.9915481; agrees to 1.2e-7, the rounding of the day counts"}
      - {number: 2, frequency_nd: "0.925198775804741", initial_phase_rad: "1.877120527070590", meaning_of_theta_zero: "approx Earth-Moon-Sun in a straight line",
         check: "27.321662 / 29.530589 (sidereal / synodic month, d) = 0.9251987; agrees to 6e-8"}
      - {number: 3, frequency_nd: "1.004021856216999", initial_phase_rad: "1.619525974729288", meaning_of_theta_zero: "approx local maximum in zeta (lunar out-of-plane position in the Sun-Earth rotating frame)",
         check: "27.321662 / 27.212221 (sidereal / draconic month, d) = 1.0040218; agrees to 2e-8"}
    note: "Eq. (10): theta_i = nu_i k (JD - JD0) + theta_i0, k converts ephemeris time to ndim time. Frequencies are in units of the sidereal rate (nu1 is the anomalistic/sidereal ratio, nu2 the synodic/sidereal ratio, nu3 the draconic/sidereal ratio), from DE440. The ratios are our identification, not printed; the check values are standard month lengths and are ours."
  - table: "3"
    caption: "Impact of t'* on the numerical transition process for the uniform ndim time, in terms of equivalent period for the halo orbits"
    journal_page: "21"
    unit: "days (average time between consecutive perilunes of the 15-year HFEM analog)"
    columns: [test, cr3bp_period_d, hfem_tprime_star_1_over_4.330d, hfem_tprime_star_1_over_4.348d, hfem_tprime_star_1_over_4.366d]
    rows:
      - {test: 1, cr3bp_period_d: "14.1974", hfem_tprime_star_1_over_4.330d: "14.1405", hfem_tprime_star_1_over_4.348d: "14.2006", hfem_tprime_star_1_over_4.366d: "14.2571"}
      - {test: 2, cr3bp_period_d: "14.50", hfem_tprime_star_1_over_4.330d: "14.4421", hfem_tprime_star_1_over_4.348d: "14.5028", hfem_tprime_star_1_over_4.366d: "14.5588"}
    note: "Text p.18 gives 14.1678 d (non-uniform rate) and 14.1983 d (uniform rate, t'* = 1/4.348 d) for the halo of CR3BP period 14.1974 d; the 14.1983 value is not in Table 3 (Table 3 prints 14.2006 for the same case at 4.348 d). The two differ by 0.0023 d and the paper does not reconcile them; they are different runs (initial epoch 1 Jan 2025 on p.18, 1 Jan 2026 on p.20-21)."
