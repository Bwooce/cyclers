# Russell & Brinckerhoff 2008, Tables 1-3 and the Appendix gravity field: circulating eccentric orbits at planetary moons.
# Source: R. P. Russell and A. T. Brinckerhoff, "Eccentric Orbits around Planetary Moons", paper AAS 08-181,
#   AAS/AIAA Space Flight Mechanics Meeting, Galveston TX, Jan. 2008 (preprint; page 1 asks readers to cite the journal form).
#   Journal form: J. Guid. Control Dyn. 32(2):424-436 (2009), "Circulating Eccentric Orbits Around Planetary Moons",
#   doi 10.2514/1.38593 (Crossref; the preprint banner says pp. 423-435, Crossref says 424-436) - NOT HELD; not compared.
# Local file: preprint PDF, 19 pp., md5 27bfd2bddc7cdcbd5d3519217e2272a0 (Word -> Acrobat Distiller 8.1.0, digital text layer).
# Locations (pdf page = page index in the 19-page file): Table 1 p.3; Table 2 p.9; Table 3 p.11; Appendix p.18.
# Transcribed from 300-dpi page images; no value computed by us. Witnesses: A = my reading of the page image; B = the
#   publisher text layer (pdftotext -layout). A = B on every Table 1, 2, 3 cell and on the Appendix (checked by eye against
#   the layer; no mismatch). Numbers are kept as printed, as strings.
# Checks (ours, check_russell_brinckerhoff2008.py / .out):
#   - Table 1: N_s = sqrt((mu_s+mu_p)/a_s^3) and TU = 1/N_s reproduce the printed values to the printed digits.
#     LU: the printed 45749.9268762215 km equals (mu_s/N_s^2)^(1/3), the Hill unit.
#   - Table 2 (Eqs. 15-18 with Ts/T = 10): for the 16 rows with a printed i_max, a_max, e_max, C1 and i_max reproduce to the
#     last printed digit for the Earth, Jupiter and Saturn rows and within 0.1 percent for the Uranus and Neptune rows (we used
#     rounded true mu_p). Charon is 4 percent off in a_max (see below). T_c reproduces within 1 percent for 14 of 16 rows
#     (Charon 1.6 percent off; Tethys not, because C1 = 0.600 sits on the bifurcation and T_c is very sensitive) when the
#     quadrature (Eq. 11) starts from an initial e0 = 0.001 at omega = 0, that is C2 = 0.4 e0^2. The paper does not print
#     this e0 for Table 2. T_c grows without bound as C2 -> 0 (e0 = 1e-6 gives about 1.9 times the printed value).
#   - PRINT SLIP in Table 2: the Uranus, Neptune and Pluto sub-headers print mu_p = 398479.14 km3/s2 (the Earth value, a
#     copy of the first sub-header). The rows reproduce only with the true mu_p of each planet (Uranus 5.79e6, Neptune 6.84e6,
#     Pluto system ~0.9e3 km3/s2). With the printed 398479.14 the rows do not reproduce (Ariel a_max 2507 km vs printed 1028).
#     The printed mu_p cells are kept as printed in the "mu_p_as_printed" fields.
#   - Charon: with mu_p = 981.6 (Pluto system) ours is a_max 1810 / e_max 0.617; with Pluto alone (869.6) ours is 1885 / 0.632;
#     printed 1880 / 0.631. The printed row is close to the Pluto-alone value; the paper does not say which.
#   - Table 3: (a, e, i, omega, Omega, nu) recomputed from the printed Cartesian state with the Table 1 mu_s agree with the
#     printed elements to the printed digits for both orbits (read as inertial-frame state per the table footnote).
conventions:
  frame_table3: "non-rotating frame aligned with the IAU Ganymede body-fixed frame at epoch (Table 3 footnote)"
  hill_units: "normalised with the moon mean motion N_s = 1 (Eq. 2 text); LU = (mu_s/N_s^2)^(1/3), TU = 1/N_s"
  Ts_over_T: "10 (Table 2 footnote b); T = spacecraft period"
  altmin_km: 100  # Table 2 footnote a: rp = r + alt_min, alt_min = 100 km, r is the moon mean radius
  negative_emax: "no figure-eight orbit exists at this period ratio (text, p.9); i_max and T_c printed N/A"
  Tc_note: "Tc is the full cycle period of the e-omega contour (Eq. 11), here for a figure-eight orbit with small non-zero e0"
  units: {mu: km3/s2, lengths: km, Ts: days, angles: deg, Tc: days}

