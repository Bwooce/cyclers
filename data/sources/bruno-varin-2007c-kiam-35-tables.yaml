    - "Fig. 11 a: i_1 at mu = 5e-3, mu_M = 1.2155e-2, 2.3e-2, 3.5e-2 (JAMM p.951, page image, lists only mu_M and 2.3e-2); unclosed curves at 5e-3."
    - "Fig. 11 b: mu = 5e-4. Fig. 11 d: i_2 at 7e-4, mu_J, 2.5e-3, 5e-3."
    - "Sec. 6.4: mu_M ≈ 1.2155092e-2 (Earth-Moon): closed family i_1 exists, not indicated by Broucke 1968 [15]."
    - "Sec. 6.5: mu = 5.178e-5 (Sun-Neptune), families with pieces Id_p, p = -2 ... -7, computed in [9] (Voyatzis & Kotoulas 2005 PSS)."
conventions:
  frame: "Planar circular restricted problem, synodic frame, origin at P1 (mass 1 - mu), P2 at (1, 0); units |P1P2| = 1, angular rate 1 (Bruno-Varin eq. (1.2), as in JAMM 71:933 and SSR 2008). P3 is the massless body."
  mu: "Both tables are at mu = 0 (generating family). Table 3 lists mu values, not orbits."
  period_field: T_over_2pi
  period_printed_as: "header \"T/(2pi)\"; T the full period. The (1 - mu) factor that Bruno & Varin 2009 SSR tables carry at mu > 0 vanishes here because mu = 0."
  jacobi: "C = -2H (Bruno-Varin Hamiltonian). At mu = 0 the +mu shift seen in the SSR 2009 family-h tables vanishes, so C is the usual mu = 0 Jacobi constant: C = 1/a + 2 sqrt(a) on the circular rows (e~ = 1)."
  a_e_coordinates: "a~, e~ are the 'celestial' coordinates of the point on the symmetry plane (SSR 2008 eq. (6)): x1 = a~ (2 - |e~|), y2|y2| = e~/x1 at mu = 0; a = |a~|, e = |1 - |e~||. |e~| = 2 is a collision with P1."
  trace: "Tr printed plainly (no log compression in the cells shown): +-2, +-inf, or [before, after] pairs."
  rounding: "The preprint mostly TRUNCATES to 4 decimals where JAMM ROUNDS (see the digest sec. 2 and compare_ssr2008.out). Neither print is wrong; use SSR 2008 for 5-digit values."
