  caption: "Таблица 3. (Table 3.) mu'_k, mu''_k and their normalised values"
  page: "p.18 (PDF p.19)"
  columns: [k, mu_p, mu_pp, mu_p_over_mu_p1, mu_pp_over_mu_pp1, k_pow_minus_8_3]
  notes:
    - "Row 4 mu'_k is printed 9.543·10^-5 (page image, 300 dpi). JAMM Table 3 (p.952, image) prints 9.543·10^-4 for the same cell, which breaks mu'_4 < mu''_4. The preprint value is right; the JAMM value is a journal misprint."
    - "Mantissas are printed with a centred dot: \"4.131 · 10^-3\"."
  rows:
