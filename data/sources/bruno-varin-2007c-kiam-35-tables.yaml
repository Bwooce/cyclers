# Bruno & Varin 2007, KIAM Preprint 35/2007, Tables 2 and 3: critical orbits of the generating family i
#   (mu = 0) and the birth / death values mu'_k, mu''_k of the closed families i_k.
# Source: A. D. Bruno, V. P. Varin, "Slozhnye semeistva periodicheskikh reshenii ogranichennoi zadachi"
#   ("Complicated families of periodic solutions of the restricted problem"), Preprint of the Keldysh Institute
#   of Applied Mathematics RAS No. 35, Moscow, 2007, 18 pp. CC BY 4.0 (cover page and library page).
#   https://library.keldysh.ru/preprint.asp?id=2007-35 ; PDF https://keldysh.ru/papers/2007/source/prep2007_35.pdf
#   Table 2 p.17 (PDF p.18) and p.18 (PDF p.19, "Table 2 (end)"); Table 3 p.18 (PDF p.19).
#   Sec. 6.2-6.3 text values p.5-6 (PDF pp.6-7).
# Local file: prep2007_35.pdf, 19 PDF pages (library cover + 18 preprint pages), md5 ef50600a0c6b4015417f2640d9f2ce65.
#
# WITNESSES
#   A (decides): the page image, 300 dpi crops of PDF pp.18-19, every cell read.
#   B: the ocrmypdf --force-ocr -l rus+eng sidecar (prep2007_35-ocr-rus.txt). The PDF text layer is a legacy
#     Type 3 font and is unusable. Check run (compare_ssr2008.py): every numeric cell of A with 3 or more characters (172 cells)
#     occurs as a string in B's Table 2 text. This is a bag-of-strings test, not cell by cell: a repeated value such
#     as 0.7631 would pass even if one cell were misread. B drops or garbles
#     symbols only: the minus-plus sign on row 18_1 e~(0) ("2"), the Tr cell of rows 22 and 28 (blank), the
#     infinity signs ("oo", "co"), and the subscripts on k ("51" for 5_1). Those cells are as read on A.
#   C (per-cell witness): JAMM 71:933 Table 2 p.946 and Table 3 p.952, read cell by cell on 250 dpi page images.
#     Every preprint cell equals JAMM or differs by one unit in the last digit (33 cells in Table 2, listed in
#     `jamm:`); each difference is explained against SSR 2008 (compare_ssr2008.out). Table 3 differs in one cell.
#   No value here was computed by us. Values are strings, exactly as printed. "inf" = the printed infinity sign;
#     "+-2" = plus-minus sign, "-+2" = minus-plus sign.
#
# RELATION TO OTHER PRINTS OF THE SAME TABLES (see the digest, sec. 2)
#   - JAMM 71:933 (2007) Table 2 p.946 and Table 3 p.952 are the journal form of these tables. Every JAMM cell
#     was read on its 250 dpi page image. Cells where JAMM differs are given in `jamm:` on the row.
#   - Bruno & Varin 2008, Sol. Syst. Res. 42(2):154, Table 2 (data/sources/bruno-varin-2008-ssr-tables.yaml,
#     table2_family_i_mu0) prints the same 39 orbits to 5-6 digits.
#   - Varin 2008 (KIAM 16/2008) and Varin & Bruno 2009 SSR 43(3):253 Table 2 print mu'_k, mu''_k to 9 digits
#     (data/sources/varin-bruno-2009-closed-families-tables.yaml).
#
# conventions block: see `conventions:` at the end.
