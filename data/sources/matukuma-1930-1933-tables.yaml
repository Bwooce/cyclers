# Matukuma 1930, 1932, 1933: Hill's-case periodic orbits. All printed numbers of the three notes.
# Sources (J-STAGE, free):
#   T. Matukuma (1930), "On the Periodic Orbits in Hill's Case", Proc. Imp. Acad. (Tokyo) 6(1):6-8, doi 10.2183/pjab1912.6.6.
#     Rec. and Comm. by K. Hirayama, Jan. 12, 1930. J-STAGE PDF md5 baa6eb2b2c131423dca8d97b4aa4109c (3 pp).
#   T. Matukuma (1932), "Periodic Orbits in Hill's Case. Second Paper (Retrograde Variational Orbits)",
#     Proc. Imp. Acad. 8(5):147-150, doi 10.2183/pjab1912.8.147. Rec. May 12, 1932. md5 8a40fae6b8b980c47858c2a54832e2c2 (4 pp).
#   T. Matukuma (1933), "Periodic Orbits in Hill's Case. Third Paper (Periodic Ejectional Orbit)",
#     Proc. Imp. Acad. 9(8):364-366, doi 10.2183/pjab1912.9.364. Comm. Oct. 12, 1933. md5 c457bdeadc7d9239aff5e0dc0a603167 (3 pp).
# PDF page n: 1930 = journal page 5 + n; 1932 = 146 + n; 1933 = 363 + n.
# Transcribed from the page images (witness C, decides): 110 dpi overview and 400 dpi crops of every table.
#   Witness A: tesseract 5, psm 6, digit whitelist, on separate 400 dpi crops (work/tess_t32.txt, tess_c32.txt, tess_t33a.txt,
#   tess_t33b.txt). NOT the J-STAGE text layer. Disagreements and how the image settled them: conventions.notes.
# No value here was computed by us. Values we computed are only in `ours:` fields and in work/*.out.
# Numbers are strings, as printed (trailing zeros kept). The printed minus sign is "-".
conventions:
  problem: "Hill's problem (restricted three-body problem in Hill's limit), planar, rotating frame, origin at the attracting body."
  equations_1930: "Darwin's intrinsic variables: dx/ds = -sin(phi), dy/ds = +cos(phi), dphi/ds = 1/R = (1/V^2){cos(theta - phi)/r^2 - 2V - 3x cos(phi)}"
  equations_1932: "d2x/dt2 - 2n' dy/dt - 3n'^2 x = -mu x/r^3;  d2y/dt2 + 2n' dx/dt = -mu y/r^3   (1)"
  units: "mu = n' = 1 in all comparisons. Then the equations are Henon's (1969) Hill equations x'' - 2y' - 3x = -x/r^3, y'' + 2x' = -y/r^3."
  jacobi: "V^2 = 3x^2 + 2/r - 2C (1930 p.6; 1933 footnote 5). Matukuma's 2C equals Henon's (1969) Gamma. The libration points are at (+-3^(-1/3), 0), where 2C = 3^(4/3) = 4.3267."
  sign_convention: "Matukuma prints positive x (distances). Henon 1969 lists family f with negative xi (start on the negative x axis). Compare |xi|."
  families: "Matukuma family B (1930, 1933; looped direct variational orbits from Hill's cusped orbit 2C = 2.55788) = Henon family g. Matukuma family F (1930; oscillating satellites about the libration points) = Henon families a, c. The 1932 retrograde variational orbits = Henon family f. Henon 1969 p.224 maps Matukuma's later (1957) family names onto Stromgren's letters; we did not use that list."
  parameters_1932: "lambda = n/n' (n = mean motion of the satellite in fixed axes); m = n'/(n - n') = 1/(lambda - 1); tau = (n - n')(t - t0). x(tau = 0) is the x-axis crossing, y(tau = 90 deg) the y-axis crossing. Half-period in t: T/2 = pi/(1 - lambda) (our reading, from tau = (n - n')(t - t0) with n' = 1)."
  table2_1933: "Ejection orbits (not periodic) leaving the origin along the x axis with infinite speed. phi = angle of the normal with the x axis. Columns: -x and y at phi = 90, 60, 30, 0, -30, -60, -90 deg. x(-90 deg) = 0 would be the periodic ejectional orbit."
  notes:
    - "Witness comparison 1932 table: tesseract misreads (all settled on the image): '0.93219' for 0.33219; '1986' for 1.986; '-1266' for -126.6; '275' for -27.5; '61' for -6.1; '014' for 2.014. No image cell is in doubt."
    - "Witness comparison 1932 c_j: all 13 cells agree."
    - "Witness comparison 1933 Table 1: all 11 rows agree (tesseract '0.271807' = 0.27180 with footnote mark 7)."
    - "Witness comparison 1933 Table 2: 7 tesseract misreads, image decides: 0.8235 (A: 0.8285), 1.1391 (1.1891), 0.733 (0.783), 5.7402 (6.7402), 20.374 (20.874), 351.28 (35.28), 0.000618 (0.000818). Our integration supports every image reading (work/g_and_ejection.out, extra_checks.out)."
    - "Eq. (8) of 1932 prints '2 - 1.3892 lambda'. Eqs. (7) give 2 + 1.3892 lambda (= 2(1 + 0.0346 lambda)/(1 - 0.66 lambda) to first order), and the table follows the + sign (lambda = -1/10 gives 1.86). The printed minus is a sign slip (ours)."
