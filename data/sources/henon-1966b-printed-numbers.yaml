# Henon 1966b (paper IV), the printed numbers of the paper. THE PAPER HAS NO NUMERIC TABLES: it prints 15 equations,
#   12 figures and the numbers below, in the running text and in figure labels and captions.
# Source: M. Henon, "Exploration numerique du probleme restreint. IV. Masses egales, orbites non periodiques (Fin)",
#   Bulletin Astronomique (3e serie) 1, fasc. 2, pp. 49-66 (1966), doi 10.3406/bastr.1966.14447. Manuscript received
#   15 February 1966. In French, with English, German and Russian abstracts.
# Local file: Persee scan, 20 pp. (2 Persee cover pages + journal pp. 49-66), md5 5f085fc52203785d6232e786d7969946.
#   PDF page n = journal page n + 46. OCR copy: ocrmypdf --force-ocr -l fra+eng.
#   Filed as cyclers_pdf/papers/henon-1966b-...-14447.pdf, with -french.pdf, -en-translation.pdf/.tex,
#   -check_henon1966b.py/.out and -witness.py/.out beside it.
# LABEL CLASH: in this paper's own bibliography "Henon 1966b" is C.R. Acad. Sci. 262:312 (force-free magnetic fields).
#   The project's label "Henon 1966b" means THIS paper (IV).
# Witnesses: A = tesseract 5 -l fra --psm 6 on 300 dpi grey renders; B = macOS Vision (.accurate, no language correction)
#   on the same renders; O = the text layer of the ocrmypdf copy; C = our reading of 300 dpi crops (decides). Every
#   value below was read by C on a 300 dpi crop, except the Fig. 1 panel label "C = 4.5" (read at 150 dpi; its caption
#   value was read at 300 dpi). Occurrence counts of A, B and O are in witness.out; they differ where a witness dropped,
#   merged or double-counted a line (for example p.55-57 figure labels: A finds one occurrence where B and O find two;
#   p.63 3,4568: B = 0; p.64-65 exponents 333 and 48: only B reads them). The counts locate the values; C decides.
#   Decimal commas are written as points; "..." is printed.
# No value here was computed by us. Values we computed are only in `check:` fields, marked "ours", from
#   check_henon1966b.out (same model and convention as the paper III check).
#
# CONVENTIONS: as in paper III (data/sources/henon-1966a-printed-numbers.yaml): mu = 1/2, M1 at x = -1/2, M2 at +1/2,
#   C = x^2 + y^2 + 2(1-mu)/r1 + 2mu/r2 - v^2 (C_Henon = C_std - 0.25); section y = 0, ydot > 0.
# CLASSES: l = direct (in fixed axes) orbits of large radius round both bodies, C > 0; m = retrograde (in fixed axes)
#   orbits round both bodies, C < 0. Both are symmetric about the origin for mu = 1/2. New names in this paper:
#   epsilon_2, epsilon'_2 (double-periodic, meet l at l1), zeta_2, zeta'_2 (asymmetric double-periodic, near l),
#   eta_3 (3-periodic, its own origin mirror, meets l at a = -1/2), K = Kristiansson's (1933) asymmetric simple-periodic
#   class (meets l at l2).
# EQUATIONS (pp.51-52, 64-65): far-field two-body model in rotating axes (1); E and A in fixed axes (2); (3) rotation;
#   (4) E, A in rotating axes; (5) C = 2A - 2E; (6) escape iff A - C/2 >= 0; (7) escape condition on the section;
#   (8) x^2 >= C - 2/|x|; (9) x^2 >= C/2; (10) escape limit xdot^2 >= 2/|x| - C^2/(4x^2) for x < 0 (dashed curves of
#   Figs. 1, 2, 8; invariant under C -> -C). (11) KAM Diophantine condition |alpha/2pi - m/n| >= eps n^(-5/2);
#   (12)-(13) Arnold's 1963a bounds; (14) M < 10^-333; (15) Moser 1962, M < 10^-48. (5), (7), (10) and (14) checked by us.
# MISPRINTS: p.64 "Arnold (1936b)" for 1963b; p.64 "Zlatousov" (bibliography: Zlatoustov; no year printed there);
#   p.65 "ramarquable"; p.52 "l'etoile" (the star) for the third body. The p.66 ERRATUM confirms the paper III Fig. 12/13
#   caption interchange.

