# Miele and Wang 1999, Acta Astronautica 45(11):655-668, "Optimal trajectories and mirror properties for round-trip Mars missions",
# PII S0094-5765(99)00117-4, DOI 10.1016/S0094-5765(99)00117-4 (Crossref: title, authors, volume 45, issue 11, pages 655-668, December 1999).
# Local file: 14 pp., publisher PDF with a text layer (the text layer garbles minus signs and some symbols), md5 b8838006eb5aca17fe6622d9d74ef4a0.
#   PDF page n = journal page 654 + n.
# Witnesses (three) for Tables 1-4: A = the text layer; B = 250 dpi crops of each table read by eye; C = tesseract (psm 6) on the same crops.
#   A, B and C agree on every cell below; the minus signs (garbled in A) are confirmed in B and in the prose repeats of the same numbers
#   (pp.662-663). No value here is computed by us; ours only in `check:` fields.
# Paper content: restricted four-body model (Sun fixed, Earth, Mars on circular coplanar orbits, spacecraft attracted by Sun, Earth, Mars),
# two-impulse trajectories LEO -> LMO, a stay in LMO, LMO -> LEO, minimum total characteristic velocity (sum of the four impulses),
# sequential gradient-restoration algorithm (SGRA) with a variable-stepsize integrator. 9 parameters, 6 constraints, 3 degrees of freedom.

planetary_and_mission_data:   # printed pp.661-662, Eqs. 35-39
  items:
    - {name: "mu_Sun", value: "1.327E11 km^3/s^2", eq: "35a"}
    - {name: "mu_Earth", value: "3.986E05 km^3/s^2", eq: "35a"}
    - {name: "mu_Mars", value: "4.283E04 km^3/s^2", eq: "35b"}
    - {name: "r_E (Earth orbit radius, circular)", value: "1.496E08 km", eq: "36a"}
    - {name: "r_M (Mars orbit radius, circular)", value: "2.279E08 km", eq: "36a"}
    - {name: "V_E, V_M", value: "29.78 and 24.13 km/s", eq: "36b"}
    - {name: "omega_E, omega_M", value: "0.986 and 0.524 deg/day", eq: "36c"}
    - {name: "omega_E - omega_M", value: "0.462 deg/day", eq: "37"}
    - {name: "r_LEO, r_LMO", value: "6841 and 3597 km", eq: "38a"}
    - {name: "h_LEO, h_LMO", value: "463 and 200 km", eq: "38b"}
    - {name: "R_E, R_M (surface radii)", value: "6378 and 3397 km", eq: "38c"}
    - {name: "circular speeds at LEO, LMO", value: "7.633 and 3.451 km/s", eq: "39a"}
    - {name: "escape speeds at LEO, LMO", value: "10.795 and 4.880 km/s", eq: "39b"}
    - {name: "specific impulse, structural factor for the mass ratios", value: "Isp = 450 s, epsilon = 0.10", note: "Table 4 footnote"}
  check: "Our values from the printed mu and radii: V_E 29.783, V_M 24.130 km/s, omega_E - omega_M 0.4614 deg/day, escape speeds 10.795 and 4.880 km/s. All agree with the printed digits (omega_E 0.9855, omega_M 0.5241 round to 0.986 and 0.524)."

table_1_outgoing_trip:   # p.662
  columns: [quantity, leo_t0, lmo_t1, units]
  rows:
    - [orbital_radius, 6841, 3597, km]
    - [orbital_altitude, 463, 200, km]
    - [mars_earth_inertial_phase_angle_difference, +43.9, -75.1, deg]
    - [spacecraft_planet_relative_phase_angle, -61.9, -141.0, deg]
    - [characteristic_velocity, 3.55, 2.10, km/s]
    - [time_from_start_t_minus_t0, 0.0, 257.9, days]
  footnote: "dV = 5.65 km/s, phi_P(t1) - phi_P(t0) = 179.0 deg, t1 - t0 = 257.9 days"

table_2_stay_in_low_mars_orbit:   # p.663
  columns: [quantity, lmo_t1, lmo_t2, units]
  rows:
    - [orbital_radius, 3597, 3597, km]
    - [orbit_altitude, 200, 200, km]
    - [mars_earth_inertial_phase_angle_difference, -75.1, +75.0, deg]
    - [spacecraft_planet_relative_phase_angle, -141.0, +140.8, deg]
    - [characteristic_velocity, 0.00, 0.00, km/s]
    - [time_from_start_t_minus_t1, 0.0, 454.3, days]
  footnote: "dV = 0.00 km/s, phi_P(t2) - phi_P(t1) = 238.1 deg, t2 - t1 = 454.3 days"

table_3_return_trip:   # p.664
  columns: [quantity, lmo_t2, leo_t3, units]
  rows:
    - [orbital_radius, 3597, 6841, km]
    - [orbital_altitude, 200, 463, km]
    - [mars_earth_inertial_phase_angle_difference, +75.0, -43.9, deg]
    - [spacecraft_planet_relative_phase_angle, +140.8, +61.6, deg]
    - [characteristic_velocity, 2.10, 3.55, km/s]
    - [time_from_start_t_minus_t2, 0.0, 257.8, days]
  footnote: "dV = 5.65 km/s, phi_P(t3) - phi_P(t2) = 179.1 deg, t3 - t2 = 257.8 days"

table_4_round_trip_summary:   # p.665
  columns: [leg, duration_days, duration_years, dv_km_per_s, mass_ratio]
  rows:
    - [leo_to_lmo_outgoing_trip, 257.9, 0.71, 5.65, 4.5]
    - [stay_in_lmo, 454.3, 1.24, 0.00, 1.0]
    - [lmo_to_leo_return_trip, 257.8, 0.71, 5.65, 4.5]
    - [total, 970.0, 2.66, 11.30, 20.2]
  footnote: "Stay in LMO for 454.3 days is necessary to allow transition of delta-phi = phi_M - phi_E from optimal arrival value -75.1 deg to optimal return value +75.0 deg. Mass ratio for Isp = 450 s and structural factor epsilon = 0.10."
  check: "Sums: 257.9 + 454.3 + 257.8 = 970.0 days; 5.65 + 5.65 = 11.30 km/s; 4.5 x 4.5 = 20.25 (printed 20.2); 970.0 / 365.25 = 2.656 years. Mars angular travel in the stay 0.524 x 454.3 = 238.1 deg, as printed. 210 / 0.462 = 454.5 days (text rounds to 454). Phase drift: 43.9 - 0.4614 x 257.9 = -75.1 deg at arrival, and 75.0 - 0.4614 x 257.8 = -44.0 deg (printed -43.9). All ours."

text_numbers:
  - {item: "outgoing and return impulses, LEO / LMO", value: "3.55 km/s at LEO (departure t0 and arrival t3), 2.10 km/s at LMO (arrival t1 and departure t2)", page: 662}
  - {item: "phase angles relative to the planet", value: "phi_PE(t0) = -61.9, phi_PE(t3) = +61.6, phi_PM(t1) = -141.0, phi_PM(t2) = +140.8 deg", page: 662}
  - {item: "Mars/Earth phase difference, outgoing and return", value: "+43.9 / -75.1 deg; +75.0 / -43.9 deg", page: 662}
  - {item: "alignment assumed for stating the mirror properties", value: "Earth (t0) and Mars (t1) aligned with the Sun, true within one degree", page: 664}
  - {item: "rotation of the trajectory system in the mirror construction", value: "238 deg around the Sun (Mars angular travel during the stay)", page: 665}
  - {item: "phase change needed during the stay", value: "360 - 150 = 210 deg, at 0.462 deg/day = 454 days", page: 668}
  - {item: "abstract", value: "total characteristic velocity 11.30 km/s, total mission time 970 days; legs 5.65 km/s and 258 days each; Delta-phi at arrival -75 deg, at departure +75 deg", page: 655}

figures_described_not_digitised:
  - {figs: [1, 2], text: "Interplanetary space (inertial), outgoing trajectory Earth to Mars and return trajectory Mars to Earth; Sun-centred, with Earth and Mars orbits and positions."}
  - {figs: [3, 4], text: "Near-planet space (relative coordinates): Fig. 3 departure branch near Earth and arrival branch near Mars; Fig. 4 departure near Mars and arrival near Earth; the atmospheric edge is drawn."}
  - {fig: 5, text: "Mirror property in interplanetary space, four panels: Step 1 outgoing trip; Step 2 rotation of the system by 238 deg; Step 3 reflection about the Earth-Sun-Mars axis (dotted pseudo-trajectories); Step 4 inversion of the sense of motion, giving the return trip. Read at 70 dpi; no values printed."}
  - {figs: [6, 7], text: "The same four steps in relative-to-Earth and relative-to-Mars coordinates (reflection about the Earth-Sun axis and the Mars-Sun axis)."}
  - {note: "The paper says the return trajectory predicted by the mirror procedure and the computed optimal return trajectory show 'a nearly-perfect superposition in the scale of Figs. 5-7' (p.668). This is a graphical check; no number measures it."}
