    seven_synodic_period_repeat: "TV4 events in 2010-2014 against the Table 1 row 2022 events: Earth flyby 14 June 2010 to 05 June 2025 is 5470 d; DSM 06 Sept. 2010 to 04 Sept. 2025 is 5477 d; Earth flyby 25 May 2011 to 14 May 2026 is 5468 d; Mars launch 2 (26 Dec. 2013) to Mars launch 09 Dec. 2028 is 5462 d; Earth arrival 2 (24 June 2014) to 07 June 2029 is 5462 d. Seven synodic periods of 779.94 d (ours) are 5459.6 d, so the offsets are 10, 17, 8, 2 and 2 d. V_inf pairs (Table 3, Table 1): 10.85 and 10.10; DSM 1.16 and 1.10; 8.86 and 8.39; 4.92 and 5.16; 5.12 and 5.39. The paper says the trajectories approximately repeat every seven synodic periods."
    reading_of_table_3_against_assumption_5: "Two readings, not adjudicated. (1) Table 3 is a steady-state four-vehicle schedule: TV3 and TV4 already fly in 2009-2013 on earlier-cycle trajectories. (2) Assumption 5 (p.205) says the first three missions use an extra transfer vehicle sent to Mars orbit to return the crew, because the vehicle of the first launch does not reach Mars again until the end of the fourth mission, and the initial EMSC columns are built on that. The Table 3 return legs of missions 1-3 (TV3 Mars launch 1, TV4 Mars launch 2, TV1 Mars launch 3) are then the steady-state ones, not the ones the initial EMSC columns pay for."
