# Landau and Longuski 2007, "Human Exploration of Mars via Earth-Mars Semicyclers": every printed table.
# Source: D. F. Landau and J. M. Longuski, Purdue University. J. Spacecraft and Rockets 44(1):203-210, January-February 2007.
#   DOI 10.2514/1.23189. Received 19 February 2006, accepted 19 July 2006.
# Local file: 8 pp., text layer, md5 ab80be46286976bda97b4962f317159f. PDF page 1 = printed p.203, ... PDF p.8 = p.210.
#   Tables 1-2 on p.205 (PDF p.3), Table 3 on p.206 (PDF p.4), Tables 4-7 on p.207 (PDF p.5), Tables 8-11 on p.208 (PDF p.6),
#   Table 12 on p.209 (PDF p.7). Figs. 2-5 on pp.204-205 (PDF pp.2-3).
# Units as printed: V_inf in km/s, DSM dV in km/s, masses in metric tons (t), dates as printed (day month year).
# Witnesses (three, per digit): A = pdftotext raw-order extraction; B = pdftotext -layout extraction (page or column crop);
#   C = page render read by eye (130 dpi for every table, 300 dpi crops for Tables 1-2 and Figs. 2-5).
#   Tables 3-11 were parsed by script from A and from B and the two parses are identical (script output, ours). Tables 1-2
#   were typed from C and each date and value was found in the A text and the B text (one exception, see table_1 note).
#   The figure labels (Figs. 2-5) are drawn graphics, not text: they have witness C only (300 dpi, read twice).
# Math symbols: the text layer garbles them ("0.5:0.5" reads "0:5:0:5", "<=" and the infinity sign drop out). The render wins.
# Every value under `check:` or `ours:` is computed by us and is not a printed number.

