  ours:
    consistency_with_tables_1_and_2: "Every TV1-TV4 entry from Earth launch 2 onward, and TV1 Earth launch 1 to Earth arrival 3, equals the corresponding cell of the Table 1 row for the same Earth launch (TV1: 2009 and 2018 rows; TV2: 2011 and 2020 rows; TV3: 2014 and 2022 rows; TV4: 2016 row), by script. Events with no Table 1 row are the tails of earlier cycles: TV3 Mars launch 1 and Earth arrival 1; TV4 Earth flyby 14 June 2010, DSM 06 Sept. 2010, Earth flyby 25 May 2011, Mars launch 2 and Earth arrival 2."
