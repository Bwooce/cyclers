# Miceli & Campagnola 2021, Tables 1-3: LEGA/ELGA vs EGA results for a Jupiter mission, V-infinity leveraging
#   (exterior), Short ("-") and Long ("+") transfer, families 2:1, 3:1, 3:2.
# Source: G. E. Miceli & S. Campagnola, "Effect of V-infinity Leveraging with Lunar-Earth Gravity Assist on Interplanetary
#   Trajectories", 31st AAS/AIAA Space Flight Mechanics Meeting, 1-4 Feb 2021, paper AAS 21-392 (preprint prints "AAS XX-XXX";
#   JPL CL#21-0437; number from NTRS 20220003813). No DOI found.
# Local file (proposed name): miceli-campagnola-2021-v-infinity-leveraging-lunar-earth-gravity-assist-interplanetary-trajectories-AAS-21-392.pdf,
#   20 pp., md5 f195b852bbb3b525d3c82b106d3444c5 (digital, good text layer). Table 1 p.18, Tables 2 and 3 p.19.
# Columns: rp_post (AU), dv_tot (km/s), dv_lev (km/s), c3 (km2/s2). The paper prints comma decimals; written here with points.
# Transcribed from page images; no value computed by us. Two witnesses (image reading and publisher text layer): 68 of 68
#   cells agree (witness-comparison.tsv). Our consistency check (checks.py, ours): dv_launch = sqrt(c3 + 2 vc^2) - vc with
#   vc at 185 km altitude gives dv_launch + dv_lev = dv_tot to 1e-4 km/s on all 17 rows.
# Numbers are kept as printed (strings; trailing zeros kept as printed; "/" in the paper is an empty cell).
