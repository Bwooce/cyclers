conventions:
  model: "patched conics, ecliptic plane, Earth and Moon circular and coplanar, Moon phase free (pp.2, 6)"
  naming: "(EI)n:m sigma_k (eq. 1, p.4): E exterior; Short = H- (family sign -), Long = H+ (family sign +); LEGA = Moon met before Earth perigee, ELGA = after, EGA = Earth flyby only at 200 km altitude (Sims et al. 1997 baseline)"
  dv_launch: "from a 185 km circular Earth parking orbit, sqrt(v_inf^2 + 2 vc^2) - vc (eq. 8, p.5); c3 = v_inf^2 at launch"
  dv_tot: "dv_launch + dv_VILM (eq. 7); dv_lev column is the leveraging maneuver dv_VILM (eq. 9)"
  rp_post: "perihelion radius in AU, before the GA for Long transfer, after the GA for Short transfer (p.17)"
  not_printed: [r_le1, r_va2, earth_flyby_altitude, perilune_altitude, moon_phase, launch_date]
  headline_checks: {dv_tot_saving_3_2_plus_LEGA_vs_EGA_percent: "6.35 (ours; paper prints 6.4 and 6.5)", dv_lev_saving_3_2_plus_LEGA_percent: "21.06 (ours = paper)", dv_lev_saving_2_1_minus_percent: "5.32 (ours; paper 5.3)"}
  errata_in_text: "eq. 11 prints delta_m = 2 sin(mu_m/(mu_m + rp v^2)); the inverse sine is missing"
