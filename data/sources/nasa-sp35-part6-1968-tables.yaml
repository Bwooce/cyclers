tape_and_supplements:
  - "Supplement A (zero-day stopover), B (30-day) and C (60-day): tabular trajectory data, 16 opportunities each, printed separately and 'available upon request' from the Ames Technical Information Division; NOT in this PDF. NTRS carries three records called the first, second and third of three supplements to this handbook: 20070014478, 20070014485, 20070014479 (the A, B, C order is inferred from first, second, third)."
  - "Magnetic tape: one-way trajectory data (53-word swingby records, 26-word direct records), 800 bpi, IBM 7094 Fortran IV; block order outbound swingbys 1978, 1980, 1984, 1986, 1990, 1993, 1997, 1999; inbound swingbys 1975, 1978, 1982, 1984, 1988, 1990, 1995, 1997; then outbound direct (1975, 1978, 1982, 1984, 1988, 1990, 1995, 1997) and inbound direct (1978, 1980, 1984, 1986, 1990, 1993, 1997, 1999). Word map Table A-1 (printed p.97)."

