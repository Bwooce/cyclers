# NASA SP-35, Space Flight Handbooks, Volume III (Planetary Flight Handbook), Part 6, "Mars Stopover Missions Using Venus Swingbys: General
# Discussion, Contour Charts and Related Graphical Information", Douglas Aircraft Company for NASA (contract NAS 2-4175), 1968, NTRS 19680020626.
# Study manager J. L. Horsewood; foreword by Jerry Deerwester (NASA/OART Mission Analysis Division), August 1967. 98 printed pages in 108 PDF pages.
# Local file: 108 pp. scan; the filed copy is an ocrmypdf --redo-ocr -l eng copy (md5 dca8c25680e28c9baf5dd2c9fc4bea37, 5,009,169 bytes) of the
# received scan (md5 e4f5c68d47910f815fe9380695362a17, 4,324,445 bytes). PDF page n = printed page n + 9 for the main text (printed p.1 = PDF p.10);
# the front matter is roman-numbered (PDF pp.1-9).
# THREE-WITNESS CHECK (Tables 1-1, 1-2, 2-1, 2-2, 2-3, 2-4): A = the text layer of the filed PDF; B = page images read by eye at 110 to 250 dpi;
#   C = a fresh tesseract run (psm 6) on 250 dpi renders of the scan. B is the reference. A and C are poor: they confuse 4 with h, L or k, 7 with T, and
#   drop or insert commas and spaces. Every cell where A or C differs from B in a digit (not only in a glyph) was settled by a zoomed 250 dpi look: see `settled:`.
#   Script and output: `...-check_tables.py` and `...-check_tables.out` beside the PDF in the private papers directory (B values are its data block).
# NOT TRANSCRIBED: Table 2-5 (Earth, Venus and Mars positions every 10 days for 1975-1999, about 910 rows of 15 columns, PDF pp.27-33).
#   It is an ephemeris computed from the Table 2-1 fixed-ellipse elements and the text layer is unusable for it. Left out and flagged, not silently skipped.
# CHART-READ values (figure data) are ONE witness (the plot) and are marked `chart_read: true`.
# All values in `check:` fields are ours.

