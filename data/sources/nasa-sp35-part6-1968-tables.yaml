syzygistic_period_statements:   # text, printed pp.1-2
  statements:
    - "relative configurations among Earth, Mars and Venus repeat almost exactly every 2338 days (about 6.4 years); in this time Venus passes inferior conjunction four times, Mars passes opposition three times and Venus and Mars pass their mutual alignment seven times (confirmed on the image, 200 dpi)"
    - "four swingby opportunities per syzygistic period (Category 3 and Category 5, inbound and outbound); 16 opportunities in 1975-1999"
  check: "Ours: 4 x 583.92 = 2335.7; 3 x 779.94 = 2339.8; 7 x 333.91 = 2337.4 days; all within 0.2 percent of 2338."

model_and_run_parameters:   # text, printed pp.1-8
  - "patched-conic program; planetary orbits are fixed eccentric, mutually inclined ellipses (Table 2-1); Kepler's equation iterated to 0.01 percent of the time of flight"
  - "swingby leg: post-encounter transfer time iterated until the departure speed matches the arrival speed within 3 m/s"
  - "Venus swingby date incremented 2 days (Category 5) or 5 days (Category 3) at fixed launch or arrival date; launch (arrival) date incremented 10 days"
  - "tape data limited to Venus passage distance greater than 0.95 Venus radii; the mission velocity charts use passage distance 1.1 Venus radii or greater"
  - "stopover times 0, 30 and 60 days; parking orbit altitudes 485 km (Earth) and 500 km (Mars); atmospheric entry altitudes 120 km (Earth) and 300 km (Mars)"
  - "fixed-ellipse error: heliocentric longitude differs by 0.1 to 0.2 deg from time-varying mean elements (checked for 1999); hyperbolic excess speeds change in the fourth significant digit"
  - "bend angle at Venus: K = 2 arcsin(1 / (1 + r_p V_inf^2 / mu_Venus)), passage distance r_p from the centre of Venus (Fig. 2-2, 1 to 5 Venus radii)"

opportunity_family_notes:   # from the discussion page before each chart set; Type 1/2 = Type of the first leg / Type of the second leg in flight order
  columns: [opportunity, category, type_first_leg_second_leg, note]
  rows:
    - [1975 inbound, 3, "1/2", "only family in the date ranges; minimum-velocity cases mostly unaffected by the 1.1-radius constraint except long durations"]
    - [1978 outbound, 5, "1/1", "extremely small departure window; one grid point satisfies the 1.1-radius constraint; two other families (1/2 and 2/1) with larger windows but longer durations"]
    - [1978 inbound, 5, "1/2", "one of two 1/2 families in the tabular data, also 1/1, 2/1, 2/2 present; high mission velocities; three-dimensional fold effect"]
    - [1980 outbound, 3, "2/1", "only family; aero-braking minima for 520, 560, 600, 640, 680 or 720 day durations lie below the 1.1-radius limit for some stopovers"]
    - [1982 inbound, 3, "1/2", "only family; contours fold over on the right"]
    - [1984 outbound, 5, "1/2", "two 1/2 families plus 1/1, 2/1, 2/2 in the tabular data; most minima on the 1.1-radius limit; at 680 days a direct return at the boundary of the range"]
    - [1984 inbound, 5, "2/1", "a second 2/1 family around JD 2446100; 1/1, 1/2, 2/2 also present"]
    - [1986 outbound, 3, "2/1", "one of the few Category 3 opportunities with a second family (slightly earlier swingby dates); cusps barely noticeable (Type 1 to 2 transition near the Mars-Earth node)"]
    - [1988 inbound, 3, "1/2", "multiple solutions where passage-distance contours cross; a cut-out in the lower right of the swingby contours (the minimum Venus departure speed exceeds the arrival speed)"]
    - [1990 outbound, 5, "2/1", "1/2 family above and a 1/1 family to the right; some aero minima on the 1.1-radius limit"]
    - [1990 inbound, 5, "2/1", "two 2/1 families; 1/1 to the left, 1/2 and 2/2 to the right; several minima use outbound direct flights at the range boundary"]
    - [1993 outbound, 3, "2/1", "only family; multiple solutions where passage-distance contours cross; one aero 30-day, 720-day case on the 1.1-radius limit"]
    - [1995 inbound, 3, "1/2", "only family; all minima stationary and unaffected by the passage-distance constraint"]
    - [1997 outbound, 5, "2/1", "another 2/1 family (launch before JD 2450100), two 1/2 families and a 1/1 family; nearly all minima affected by the constraint; entry speeds shown for all three stopover times"]
    - [1997 inbound, 5, "1/2", "other families 1/2 (Earth arrival near JD 2450970), 2/1 and 1/1 (arrival near 2450800)"]
    - [1999 outbound, 3, "2/1", "only family; cut-out in the upper left of the swingby contours (as 1988 inbound)"]
  note: "Read from the discussion pages (PDF pp.37, 41, ..., 97), checked on the images for 1975 inbound, 1978 outbound and 1978 inbound; the rest are from the text layer, which is clean on these pages. Text, not tables, so one witness (A) for most."

