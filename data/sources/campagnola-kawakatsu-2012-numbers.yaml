equations:   # printed Eqs. 1-10, read from the render; symbols: M = moon, v_inf = hyperbolic excess speed vector, T = Tisserand parameter
  eq_1: "delta = 2 arcsin( mu_M / (mu_M + (R_M + H) |v_inf|^2) ); |v_inf| conserved through the whole hopping sequence at the same moon (footnote: only ballistic trajectories are considered)"
  eq_2: "|v_inf| = |v_M| sqrt(3 - T)"
  eq_3: "T = 2 a_M / (r_a + r_p) + 2 cos i sqrt( 2 r_p r_a / (a_M (r_p + r_a)) )   (J = T)"
  eq_4: "alpha = arccos( (1 - rho^(-2/3) - (|v_inf|/|v_M|)^2) / (2 |v_inf|/|v_M|) ), alpha in [0, pi], k in [-pi, pi]"
  eq_5: "rho = (1 - 2 (|v_inf|/|v_M|) cos alpha - (|v_inf|/|v_M|)^2)^(-3/2); rho = n:m, n moon revolutions, m spacecraft revolutions"
  eq_6: "i_max = arcsin(|v_inf|/|v_M|), reached at alpha = pi/2 + i_max and k = +-pi/2"
  eq_7: "alpha_in in (delta, pi - delta)"
  eq_8_9: "alpha_out in [alpha_in - delta, alpha_in + delta]; cos delta = cos alpha_in cos alpha_out + sin alpha_in sin alpha_out cos(k_out - k_in); k_out = k_in +- arccos((cos delta - cos alpha_in cos alpha_out)/(sin alpha_in sin alpha_out)); special cases for sin alpha_in = 0 and for alpha_in - delta < 0 or alpha_in + delta > pi"
  eq_10: "i(r_a, r_p; T) = arccos( (T - 2 a_M/(r_a + r_p)) / (2 sqrt(2 r_p r_a / (a_M (r_a + r_p)))) )"
