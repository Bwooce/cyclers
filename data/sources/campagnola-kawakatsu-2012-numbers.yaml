# Campagnola and Kawakatsu 2012, "Three-Dimensional Resonant Hopping Strategies and the Jupiter Magnetospheric Orbiter":
# every printed number. The paper is an Engineering Note and has NO tables; this file holds the numbers printed in the text,
# the equations and the figure labels.
# Source: S. Campagnola (JAXA ISAS, then JPL) and Y. Kawakatsu (JAXA ISAS). J. Guidance, Control, and Dynamics 35(1):340-344,
#   January-February 2012. DOI 10.2514/1.53334. Received 6 December 2010, revised 13 June 2011, accepted 13 June 2011.
# Local file: 5 pp., text layer, md5 64795d64336d4f308ce0c40d8828ccf7. PDF page 1 = printed p.340 ... PDF p.5 = p.344 (references).
# Witnesses (three, per number): A = pdftotext raw extraction; B = pdftotext -layout extraction; C = page render read by eye
#   (150 dpi, whole pages; 220 dpi crops of Eqs. 4-7). Text numbers: A, B and C agree on every digit. The text layer
#   garbles every equation (minus signs, exponents, fractions drop out), so the equations were read from C only and then
#   checked by derivation (see `ours`). Figure labels are drawn graphics: witness C only.
# Units as printed: km/s, degrees, days, years, Jupiter radii (R_J). Everything under `ours:` is computed by us.
