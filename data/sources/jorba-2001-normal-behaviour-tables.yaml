# Jorba 2001, Tables 1-5 and the printed single-value results: normal behaviour of invariant curves.
# Source: A. Jorba, "Numerical computation of the normal behaviour of invariant curves of n-dimensional maps",
#   Nonlinearity 14:943-976 (2001), doi 10.1088/0951-7715/14/5/303. Received 25 Oct 2000, final form 3 May 2001,
#   published 2 July 2001.
# Local file: 35 pp. (IOPscience cover page + 34 journal pages 943-976), md5 974de013e766688c7c2dc0db55bd3797.
#   PDF page n = journal page 942 + n.
# Tables: 1 p.956, 2 p.958, 3 p.962, 4 p.963, 5 p.972 (PDF pages 15, 17, 21, 22, 31).
# Transcribed from page images at 120 dpi (witness A, decides). Witness B: the PDF text layer, which is clean (publisher
#   typesetting). Cell check: every cell string below was searched in the text layer by script (see
#   jorba-2001-yaml-verify.out). No value here was computed by us. Our values are only in `note:` fields marked "ours"
#   and in jorba_checks.py / jorba_checks.out.
# Numbers are kept as printed, with the thin-space digit grouping removed; strings keep trailing zeros.
# "arg" columns are in radians. "modulus"/"arg" describe eigenvalues of the discretised operator T_{-omega} o A(theta).
conventions:
  eigenproblem: "A(theta) psi(theta) = lambda psi(theta + omega)   (eq. 7, p.946)"
  invariance_of_spectrum: "if lambda is an eigenvalue then lambda*exp(i k omega) is one, for all integers k (Prop. 2.2, p.946)"
  norm_column: "||psi||^(1) = sum_j |psi_j| |j|, eigenvector scaled to sup norm 1 (sec. 3.2 p.951, sec. 3.7 p.954)"
  error_column: "norm of the last two Fourier coefficients of the eigenfunction (p.956)"
  rows_shown: "eigenvalues with positive argument only (complex-conjugate pairs); sorted by the norm column"
  table_1_2_system: "quasi-periodic Hill equation x'=y, y'=-(a^2+b(cos th1+cos th2))x, th1'=omega1, th2'=omega2 (eq. 15, p.954), section th1=0"
  table_1_2_parameters: "a^2=0.7, b=0.2, omega1=1, omega2=gamma=(1+sqrt5)/2, cocycle frequency omega=4*pi/(1+sqrt5)=3.883222077450 9332 (p.956)"
  table_1_N: "N=10 for the printed table (N=8 gave error estimate 5.6e-12; N=10 gave 1.3e-14); Figure 1 uses N=10 and N=64"
  table_2_N: "N=16 (eq. 17, the 2-torus version, A(2 eta) psi(eta) = lambda psi(eta + omega/2))"
  table_3_4_system: "bicircular problem (BCP) time-of-the-Sun section, a symplectic map of R^6; parameters (mu, m_S, a_S, omega_S) are NOT printed in this paper (cited to Castella-Jorba 2000 and Simo et al. 1995)"
