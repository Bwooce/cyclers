# Bruno & Varin 2009, Tables 1-3: critical orbits of family h for mu = 0.3, 0.4 and 0.5.
# Source: A. D. Bruno and V. P. Varin, "Family h of Periodic Solutions of the Restricted Problem for Big mu",
#   Solar System Research 43(2):158-177 (2009), doi 10.1134/S0038094609020099 (Pleiades). English translation of
#   Astronomicheskii Vestnik 43(2):167-186 (2009). Received 30 April 2008. This is the journal form of KIAM
#   Preprint 64/2005, whose TeX source has no tables (its Tables 6-8 = these Tables 1-3).
# Local file: bruno2009_3.pdf, 20 pp., md5 6f703c020ee599a96729614be7c25a7c (digital, FrameMaker; has a text layer).
# Table 1 (mu = 0.3): pp.160-161. Table 2 (mu = 0.4): pp.162-163. Table 3 (mu = 0.5): pp.174-175.
#   Each table is printed in two halves on facing pages; both halves are merged here by k.
# Transcribed from the page images: every cell was read on 250 dpi page renders. The digital text layer was used
#   only as a typing aid, and it matched the images in every cell. No value here was computed by us; values we
#   computed appear only inside `note:` fields, marked as ours. Numbers are kept as printed (strings, trailing zeros kept);
#   the printed en-dash minus is written "-".
#
# FRAME (stated in the paper and in KIAM 64/2005; confirmed by our checks, see checks_bigmu_ci.out sec. 0):
#   P1 (mass 1 - mu) at the origin, P2 (mass mu) at (1, 0); rotating frame, unit angular rate.
#   x1, y2 on the symmetry plane Pi (x2 = 0, y1 = 0). y2 is the canonical momentum: y2 = dx2/dt + x1.
#   C = -2H = x1^2 - 2 mu x1 + mu + 2(1-mu)/r1 + 2 mu/r2 - v^2 (= the usual barycentric Jacobi constant + mu(1-mu)).
#   Henon (1965b, 1973) at mu = 0.5: x_H = x1 - 0.5 and C_H = C - 0.25 (stated on p.167).
#
# COLUMNS
#   k        critical-orbit number
#   x1_0, y2_0       x1(0), y2(0): start point on Pi
#   x1_T2, y2_T2     x1(T/2), y2(T/2): the half-period point on Pi. "1" / "inf" = collision with P2 at T/2;
#                    "0" / "inf" = collision with P1 at T/2 ("inf" is the printed infinity sign).
#   T_norm   T~ = T/(2 pi) (our integrations confirm T/(2 pi), not (1 - mu) T/(2 pi), for these tables)
#   C        Jacobi constant (convention above)
#   Tr_mod, Trv_mod  modified planar and vertical traces: Tr~ = Tr if |Tr| <= 2, else (1 + log2|Tr|) sgn Tr
#   a_0, e_0         a~(0), e~(0): "astronomical" coordinates for P1 (KIAM 64/2005 eq. 4'.1):
#                    e~ = x1 y2 |y2| / (1 - mu), a~ = x1 / |2 - |e~||
#   a_T2, e_T2       a~(T/2), e~(T/2), same formula at the half-period point
#   w1_T2    w1(T/2) = mu / (1 - x1(T/2)) (local coordinate near P2, KIAM 51/2007 eq. 1.1)
#   null     the cell is blank in the print. Blank a_0/e_0 (mu = 0.4 rows 26-27; mu = 0.5 rows 16-18, 23-25,
#            30-31): in every such row the printed state gives |e~(0)| > 2. Blank e_T2/w1: rows whose T/2
#            point is at or extremely close to P2.
#
# NOTES ON PRINTED CELLS (values kept as printed)
#   - mu = 0.4, row 16, e_0: printed "--1.493" (a doubled minus, visible on the page image). The row's own
#     x1(0), y2(0) give -1.4927.
#   - mu = 0.3, rows 6 and 7, e_T2: printed +157.6128 and +204.0113. The printed y2(T/2) is negative in both rows,
#     and e~ takes the sign of x1 y2; our integration also gives y2(T/2) < 0. Probable sign slips (the magnitudes
#     agree with the printed x1, y2).
#   - mu = 0.3 rows 6-8 and mu = 0.4 rows 17-19: the printed y2(T/2) (orbit passing within 0.005 of P2 at T/2)
#     does not give the printed C. It differs from our integrated y2(T/2) by 0.03 to 4 percent (rows 6, 7, 8 of
#     mu = 0.3: 2.4, 2.8, 4.2 percent), much more than the 5-decimal start state explains. x1(T/2), T~ and C
#     reproduce. Treat these y2(T/2) cells as accurate to 2-3 significant figures only.
#   - Collision rows (x1_T2 = 0 or 1): x1(0) is printed with two trailing zeros (for example -1.82800) and is
#     good to about 1e-3, not 1e-5. Henon 1973 gives x0 = -2.32707 (x1 = -1.82707) for mu = 0.5 row 8.
#   - mu = 0.5, row 31: the only row with x1(0) > 0. It starts from the other crossing: its x1(0), y2(0) and
#     x1(T/2), y2(T/2) are row 30's two crossings in the opposite order. Our integration from the printed
#     row-31 state closes. a_T2, e_T2, w1_T2 follow its printed T/2 point.
#   - Text p.158: the columns are said to include "v1(T/2), v2(T/2) (entrance velocity at P2)", but the table
#     headers are x1(T/2), y2(T/2); the P2-entry rows print 1 and infinity.
