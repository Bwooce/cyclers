# Colombo, Franklin & Munford 1968, Tables I-V: periodic orbits of the planar circular restricted
#   three-body problem (Sun-Jupiter), commensurate with Jupiter's period.
# Source: G. Colombo, F. A. Franklin and C. M. Munford, "On a Family of Periodic Orbits of the Restricted
#   Three-Body Problem and the Question of the Gaps in the Asteroid Belt and in Saturn's Rings",
#   The Astronomical Journal 73(2):111-123 (March 1968), DOI 10.1086/110607, ADS 1968AJ.....73..111C.
#   Tables I-II on p.114, Table III on p.115, Table IV and Table V on p.117.
# Local scan: ADS scan with OCR text layer, md5 fc46ec15f27fd5c89d30aece52cce3c1 (13 pp).
# Transcribed from the page images (170 dpi renders of pp.114, 115, 117); no value computed by us.
#   The text layer was parsed by script and every table was then compared with the image. Independent
#   arithmetic checks are in the digest (osculating a(0), e(0) recomputed from the printed state to 2e-5;
#   a(T_s/2), e(T_s/2) reproduced by integration to 1.6e-5 (Tables I, II, IV) or 1.4e-4 (Table III)).
# Units and frame (paper, p.112): G = 1 and Sun mass = 1; Jupiter mass m = 0.000954786 (Jupiter-Sun mass
#   ratio); both on circular orbits about their barycentre at unit separation; the frame rotates with the
#   primaries at angular rate sqrt(1+m), so Jupiter's period is T_J = 2 pi / sqrt(1+m) = 6.28019...
#   Origin at the barycentre; Jupiter at xi = -0.99904612 at t = 0, the Sun at xi = +m/(1+m).
# Initial conditions at t = 0 (inferior conjunction, asteroid between Sun and Jupiter):
#   xi = xi0 (negative), eta = 0, d(xi)/dt = 0, d(eta)/dt = etadot0 (rotating-frame velocity, direct in the
#   inertial frame). The orbit is symmetric about the Sun-Jupiter line and is at perihelion or aphelion at
#   t = 0 and again at t = T_s/2 (superior conjunction).
# Columns:
#   xi0      initial asteroid coordinate xi (units of the Sun-Jupiter distance), as printed
#   etadot0  initial rotating-frame velocity d(eta)/dt, as printed (units: unit distance per unit time)
#   Ts       synodic period of the orbit in the same time units, as printed; where the paper prints a
#            closed form it is kept as ts_printed (e.g. "2pi/(1+m)^(1/2)") with ts_formula (ASCII, my
#            reading of the grouping; the grouping 3pi/2(1+m)^(1/2) is ambiguous on the page and the
#            reading 3pi/(2 sqrt(1+m)) is the one consistent with the neighbouring rows and Fig. 1)
#   e0, a0   osculating heliocentric eccentricity and semimajor axis at t = 0 (a in units of Jupiter's a)
#   e_half, a_half   the same at t = T_s/2
# Sign convention (Fig. 3 caption): e > 0 means perihelion at that instant and e < 0 aphelion; the tables
#   list e as a magnitude only.
# Misprints: none found. Values kept as printed; digits as printed, trailing zeros kept (strings).


