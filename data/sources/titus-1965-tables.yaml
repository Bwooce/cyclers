  # spacecraft trajectory crosses the orbit of Venus or Mercury (paper text p.11-12); the planet symbol with the same date
  # shows that planet's position on that date.
  items:
    - {fig: 16, year: 1971, earth_departure_jd: 2441090, mars_flyby_jd: 2441240, earth_arrival_jd: 2441520,
       crossings: {venus_orbit_jd: [2441426, 2441464]}, venus_jd_labelled: [2441426, 2441464]}
    - {fig: 17, year: 1973, earth_departure_jd: 2441890, mars_flyby_jd: 2442070, earth_arrival_jd: 2442340,
       crossings: {venus_orbit_jd: [2442247, 2442310], mercury_orbit_jd: [2442277]}, venus_jd_labelled: [2442247, 2442310], mercury_jd_labelled: [2442277]}
    - {fig: 18, year: 1975, earth_departure_jd: 2442670, mars_flyby_jd: 2442870, earth_arrival_jd: 2443120,
       crossings: {venus_orbit_jd: [2443037, 2443100], mercury_orbit_jd: [2443060]}, venus_jd_labelled: [2443037, 2443100], mercury_jd_labelled: [2443060]}
    - {fig: 19, year: 1978, earth_departure_jd: 2443430, mars_flyby_jd: 2443640, earth_arrival_jd: 2443890,
       crossings: {venus_orbit_jd: [2443805, 2443863], mercury_orbit_jd: [2443824]}, venus_jd_labelled: [2443805, 2443863], mercury_jd_labelled: [2443824]}
    - {fig: 20, year: 1980, earth_departure_jd: 2444190, mars_flyby_jd: 2444400, earth_arrival_jd: 2444660,
       crossings: {venus_orbit_jd: [2444562, 2444630], mercury_orbit_jd: [2444590]}, venus_jd_labelled: [2444562, 2444630], mercury_jd_labelled: [2444590]}
  note: "Fig. 17: the Earth arrival label reads '244 12340' with a trajectory line through the fourth digit, and a Venus-crossing label reads '244 2247' with the same occlusion; both read as 2442340 and 2442247 from the unobstructed partner labels (2442247 beside the Venus symbol) and the trip-duration pattern. Departure dates are printed only for Earth with the Earth symbol; Mars flyby is the date at the heavy-circle encounter point. Assignment of the Earth departure and arrival labels to the two Earth symbols is by trip order (earlier date = departure)."
  derived_by_us:
    trip_days_departure_to_mars: {1971: 150, 1973: 180, 1975: 200, 1978: 210, 1980: 210}
    trip_days_mars_to_earth: {1971: 280, 1973: 270, 1975: 250, 1978: 250, 1980: 260}
    total_trip_days: {1971: 430, 1973: 450, 1975: 450, 1978: 460, 1980: 470}
  check: "Total days match the powered-flyby points of Fig. 12 read at 100 dpi (about 430, 450, 450, 460, 470 days). Independent witness on the dates."

