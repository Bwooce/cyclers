fig_11_mass_in_earth_orbit_bars_1e6_lb:   # approximate bar reading, one witness, +-0.05e6
  note: "The only numbers printed in the text for mass in Earth orbit: 1978 initial optimum powered flyby 750,000 lb; 1978 ballistic flyby 1.8 million lb; 1978 powered flyby with Venus swingby (the nonoptimum Venus case) 2,935,000 lb; 1980 Earth-retro mode 2,511,000 lb; 1980 perihelion-retro mode 1,561,000 lb; combination of 6250 ft/s perihelion retro and 8000 ft/s Earth retro 1,470,000 lb (all text, pp.13 and 15). Bars are read only in the plot."

