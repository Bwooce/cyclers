  ballistic: {1971: 45, 1973: 48, 1975: 55, 1978: 59, 1980: 61}
  powered: {1971: 52, 1973: 65, 1975: 72, 1978: 73, 1980: 73}
  note: "Axis ticks every 10 (x 10^3 fps); a dashed line at 65 marks the hypothetical direct-entry limit. Bar tops read to about +-1. Text says the optimum powered flybys of 1975 and 1978 and 1980 exceed 70,000 ft/sec (p.11, 1975 'exceeds 70,000')."

