table_earth_escape_vs_hyperbolic_transfer_dv_fps:   # printed p.9-10, the table after "The following table shows these relationships"
  columns: [opposition_year, earth_escape_dv_fps, hyperbolic_transfer_dv_fps]
  rows:
    - [1971, 12000, 5470]
    - [1973, 12800, 8900]
    - [1975, 13200, 12300]
    - [1978, 13100, 12200]
    - [1980, 12800, 11200]
  note: "The OCR layer reads the 1975 year as '1919' and puts a stray space in '12, 200'; B and C read 1975 and 12,200. Conclusion 5 (p.16) says 'unfavorable years of 1975 through 1980' while the text before the table says 1975, 1978 and 1980."
  check: "Hyperbolic transfer dV in EMOS from Figs. 5-9 times 97,700 ft/s: 0.056 -> 5,471; 0.091 -> 8,891; 0.126 -> 12,310; 0.125 -> 12,213; 0.115 -> 11,236. All five agree with the table to 0.1 percent. This is an independent witness on the table digits."

table_nonoptimum_powered_flybys:    # printed p.14 (PDF p.8, right page)
  columns: [opposition_year, total_trip_duration_days, earth_departure_speed_ft_per_s, dv_at_mars_ft_per_s, earth_entry_speed_ft_per_s]
  rows:
    - [1975, 510, 19100, 6550, 64500]
    - [1978, 530, 21000, 6850, 64900]
    - [1980, 520, 17150, 6650, 64800]
  note: "The column headed 'Earth Departure' has units ft/sec, a speed (hyperbolic excess or departure speed; the paper does not say which). 'Earth Departure' of 19,100 ft/sec is far above the 12,000 to 13,200 ft/s Earth-escape dV of the optimum cases, as the text says ('high earth departure speeds')."

