fig_14_15_22_23_plots_reading_only:
  items:
    - {fig: 14, text: "Earth entry speed (x 10^3 fps, 36 to 76) against perihelion retro velocity (x 10^3 fps, 0 to 12), straight-line curves labelled 1971, 1973, 1975, 1978, 1980; a 'minimum entry speeds' line. No values printed."}
    - {fig: 15, text: "1980 optimum powered flyby with perihelion retro: mass in Earth orbit (1.0 to 2.2 x 10^6 lb) and total trip duration (460 to 560 days) against perihelion retro velocity (0 to 12 x 10^3 fps); lines mark 65,000 fps Earth entry and the ballistic flyby. Trip duration rises from about 470 days at zero retro to about 525 days at 12,000 fps (plot reading, +-5 days)."}
    - {fig: 22, text: "1975 nonoptimum powered flyby, Earth return date 2443090: sum of Earth-leave dV and dV at Mars (24 to 32 x 10^3 fps) against Earth departure date (JD 2442550 + 60 to 90) for Mars dates labelled 2800, 2810, 2820, 2830, 2840, 2850 (244xxxx). The lowest curve has its minimum near 25,500 fps (plot reading, +-300)."}
    - {fig: 23, text: "1980 combination retro, Earth entry speed 50,000 fps: mass in Earth orbit (1.0 to 2.8 x 10^6 lb) against perihelion retro velocity (0 to 10 x 10^3 fps); marked points Earth retro dV = 24,000, 20,000, 16,000, 12,000, 8000, 4000, 0 fps; the curve has its minimum near the printed 1,470,000 lb (plot reading)."}
    - {fig: 21, text: "Heliocentric longitude (axis 120 to 160 deg, wrapping at 360) of Venus against Julian date (2440000 + 1400 to 4800), as sawtooth traces, with the spacecraft intercept with the Venus orbit for 1971, 1973, 1975, 1978, 1980 marked."}
    - {fig: 10, text: "Mars transfer dV (EMOS, 0 to 0.18) against true anomaly of the separation point (-160 to 160 deg) for 1971, 1973, 1975, 1978, 1980; the 1971 curve has its minimum near 0.056 (plot reading). Open circles mark the chosen points."}
  note: "Plot readings carry no printed values and are shape only, one witness (B and C)."

