# Titus 1965, AIAA Paper 65-515, "Powered Flybys of Mars": every printed number.
# Source: Richard R. Titus, Research Laboratories, United Aircraft Corporation, East Hartford, Connecticut.
#   AIAA Second Annual Meeting, San Francisco, 26-29 July 1965. DOI 10.2514/6.1965-515.
# Local file: 16 pp. (two-up spreads, 783 x 610 pt), image scan; the filed copy is an ocrmypdf --redo-ocr -l eng copy,
#   md5 39880f88938228c7ec5261169bf65e94 (source scan md5 7aab3cf16abeb70160c67e210ddede3e).
#   PDF page 1 = cover, PDF p.2 = printed pp.1-2, ... PDF p.10 = printed pp.17-18, PDF pp.11-16 = Figs. 1-23.
# Units are as printed: fps or ft/sec (feet per second), lb (pounds mass), days, Julian date, EMOS = Earth's mean orbital speed
#   (the paper never states its value; ours, 29.78 km/s = 97,700 ft/s, is used only in `check:` fields).
# Witnesses (three, per number): A = the OCR text layer (pdftotext); B = page images at 100 dpi, read by eye;
#   C = crops at 250 dpi of each table and each figure annotation, read by eye. A, B and C agree on every digit below,
#   except where a `note:` says otherwise. Internal arithmetic checks are in `check:` fields. No value is computed by us.
# All numbers in `check:` fields are ours.

