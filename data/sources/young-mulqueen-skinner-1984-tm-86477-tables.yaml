# Young, Mulqueen and Skinner 1984, NASA TM-86477, "Mars Exploration, Venus Swingby and Conjunction Class Mission Modes, Time Period 2000 to 2045".
# Source: Archie C. Young, John A. Mulqueen, James E. Skinner (Program Development, NASA Marshall Space Flight Center), 31 August 1984, 82 pp.,
#   NTRS 19850003653 (N85-11961). Local file: 82-page scan (Pdf.Capture 5.2, garbled text layer), source md5 b45edfdcc893e36666f1b78818ff7729;
#   the filed copy is an ocrmypdf --force-ocr -l eng copy, md5 dc299ad48e5d125788ac277cb7929930 (the table pages are printed sideways and their OCR is unusable).
#   PDF page n carries printed page n - 8 for pages 9 to 74.
# DAY NUMBERS. The printed day numbers (for example 51996) are labelled "J.D. 2450000" and the appendix says "reckoned from JD 240-0000", but they
#   behave as MODIFIED Julian dates (MJD = JD - 2400000.5): the dates printed on the report's own Figs. 14 and 24 are reproduced exactly by
#   date = 1858-11-17 + day number (outbound 2025: launch 60196 = 9/9/23, Venus 60358 = 2/18/24, Mars 60494 = 7/3/24, Mars departure 60554 = 9/1/24,
#   Earth 60810 = 5/15/25; conjunction 2031: 62860 = 12/25/30, 63142 = 10/3/31, 63642 = 2/14/33, 63858 = 9/18/33). Values below are the full day numbers
#   (the table headings print a 2450000 or 2460000 offset; rows from 2022 on use 2460000, which the digits themselves show: 60154 and 0810 are 60154 and 60810).
# EMOS = Earth mean orbital speed; V_inf columns are in EMOS in Tables 1 and 22.
# Witnesses. Tables 1, 22 and the figure tables: A = page render read by eye (220 to 300 dpi), B = the independent printouts (Tables 2 to 18 and 23 to 29 give the same
#   dates and, through C3, the same V_inf), C = arithmetic relations (launch + trip times; the months of Figs. 7 and 19; V_inf from C3). Stage-sizing tables 19-21 and 30-31:
#   A = render, B = Tesseract text of the render (agreement on every digit that is not a slashed zero), C = relations (WSTG = WF + WBO, WO = sum of the stages and payloads,
#   DV1 from the rocket equation at Isp 480 s). Printout records: ONE witness (render band read by eye, with Tesseract as a second read on the digits that are not slashed
#   zeros); only the record of the optimum launch date of each table is transcribed, not the other launch-window records (see the digest).
# No value is ours except in check blocks; check script and output: cyclers_pdf/papers/<filed name>-check.py and -check.out.
conventions:
  day_numbers: MJD-like, see header
  emos_km_s: 29.78 (implied by C3 and the V_inf columns, see check)
  isp_s: 480
  mass_fraction_each_stage: 0.9
  gravity_loss_G: 0.1111
  propellant: LOX/LH2
  venus_min_closest_approach: 0.1 planet radius altitude (330 n.mi), i.e. RCP >= 1.1 planet radii
  capture_orbit: 24-hr ellipse, periapsis altitude 270 n.mi (Mars and Earth)
  assembly_orbit: 270 n.mi circular Space Station orbit
  stages: 'three stages: Earth escape, Mars capture and escape, Earth braking'
  stopover_time_venus_missions_d: 60
  mars_surface_stay_d: 30
  crew: 6
  excursion_crew: 3
  weights_lb:
    venus_mission_module: 83000
    probes: 42000
    mars_excursion_module: 95000
    conjunction_mission_module: 117000
    conjunction_pioneer_mars_base: 57000
