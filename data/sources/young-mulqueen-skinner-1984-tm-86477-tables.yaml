  fig7:
    caption: Mars stopover mission with Venus swingby (stopover time equal 60 days, time period 2000 to 2031)
    rows:
    - mission: 2001 inbound
      earth_launch: March 2001
    - mission: 2003 outbound
      earth_launch: August 2002
    - mission: 2005 outbound
      earth_launch: June 2004
    - mission: 2007 inbound
      earth_launch: September 2007
    - mission: 2010 double
      earth_launch: January 2009
    - mission: 2012 outbound
      earth_launch: November 2010
    - mission: 2014 inbound
      earth_launch: November 2013
    - mission: 2016 inbound
      earth_launch: November 2015
    - mission: 2018 outbound
      earth_launch: April 2017
    - mission: 2020 inbound
      earth_launch: June 2020
    - mission: 2022 outbound
      earth_launch: October 2021
    - mission: 2025 outbound
      earth_launch: September 2023
    - mission: 2027 inbound
      earth_launch: November 2026
    - mission: 2029 double
      earth_launch: March 2028
    - mission: 2031 outbound
      earth_launch: January 2030
  fig15:
    text: two mission opportunities out of every three should be favourable; initial mass in LEO 1.47 to 4.1 million lb; third stage 24,000 to 102,000 lb, second stage 353,000 to 1,094,000 lb, first stage
      870,000 to 2,720,000 lb; mission time 558 to 737 d; Earth departure C3 9.2 to 37.0 km2/s2
    check: 'stage ranges: first stage 869,021 (2001) to 2,719,261 (2007) and second stage 352,989 to 1,093,887 agree with Tables 19 to 21; third stage MINIMUM stated 24,000 but Table 21 gives 17,513 lb
      for 2025 (WF3 15,762, DV4 0.80 km/s): not consistent; maximum 101,967 (2031) / 100,164 (2022) vs stated 102,000 ok.'
  fig25:
    text: mission opportunity about every 26 months; initial mass in LEO 1.01 to 1.17 million lb; third stage 25,000 to 36,500 lb; second stage 112,000 to 169,000 lb; first stage 600,000 to 725,000 lb;
      stopover 340 to 550 d; total mission time 950 to 1004 d; Earth departure C3 8.9 to 16.2 km2/s2
    check: 'Tables 30, 31: WO 1,012,079 to 1,170,455 lb; WSTG3 24,950 to 36,502 lb (24,950 not 25,000: rounded); WSTG2 112,263 to 168,974; WSTG1 600,994 to 724,991: all inside the stated ranges'
  fig14:
    inbound_2014:
      launch: 11/22/13
      mars_arrival: 8/19/14
      mars_departure: 10/16/14
      venus_passage: 3/2/15
      earth_arrival: 8/19/15
    outbound_2025:
