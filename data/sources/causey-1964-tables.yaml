# Causey 1964, Fig. 51 "Orbits with injection altitudes ~100 nautical miles" (a table printed as a figure).
# Source: W. E. Causey, "Characteristic Features of Some Periodic Orbits in the Restricted Three Body Problem",
#   NASA TM X-53108, George C. Marshall Space Flight Center (Aero-Astrodynamics Laboratory), Huntsville AL,
#   17 August 1964. NTRS 19640019815 (accession N64-29729). No DOI (Crossref search 2026-10-08: no match).
# Local file: causey-1964-characteristic-features-periodic-orbits-restricted-three-body-problem-nasa-tm-x-53108-ntrs-19640019815.pdf
#   (force-OCR copy of the NTRS scan; scan md5 8e5b0c2ad86328eee23c740c29ed70d4, 65 pp.).
# Page: report p.58 = PDF p.63. The table is printed sideways.
# This is the ONLY numeric table in the report. Figs. 5-50 are graphs (velocity, period, closest approaches vs start
#   radius); they are not transcribed.
# Transcribed from page images; no value computed by us. Every cell was read on a 400 dpi render (A). Second witness:
#   tesseract 5 psm 6 on the full table (B) and on each column crop with a digit whitelist (C). See
#   witness-comparison.tsv and checks/witness_counts.py (+ _output.txt). Of the 49 value cells: 30 identical in A, B
#   and C; 7 differ only by punctuation (decimal comma, trailing period, blank vs dash); 12 have a digit error in one
#   OCR witness (5->9, 7->1, a dropped or doubled digit, garbling, run-on into the next cell). In all 12 the other
#   OCR witness agrees with A, and where they apply the family ranges printed on pp.5-6 exclude the OCR reading
#   (e.g. 96,713 km lies outside the class-B range 3,075-57,000 km). The 7 ratio/order/class entries were read on
#   the image only (the OCR of those columns is garbled).
# Numbers are kept as printed (strings, with the thousands comma). "-" = printed dash. Blank class = printed blank.
#
# COLUMNS (headers as printed)
#   ratio            "Ratio" m/k: m = Moon revolutions while the probe makes k revolutions (p.3)
#   order            "Order" n: an orbit of ratio nm/nk is "ratio m/k order n" (p.4)
#   class            "Class": A = second perpendicular crossing of the Earth-Moon line on the back side of the Moon;
#                    B = on the front side (p.4). Blank for order 1.
#   first_approach_to_moon_km   "First Approach to Moon (km)": the starting radius, i.e. the perpendicular crossing
#                    behind the Moon, measured from the Moon's centre (Fig. 44-50 axes: "Behind Center of Moon (km)")
#   second_approach_to_moon_km  "Second Approach to Moon (km)"
#   close_approach_to_earth_km  "Close Approach to Earth (km)" (from Earth's centre; injection altitude about
#                    100 n.mi. per the caption)
#   time_earth_to_moon_hr       "Time From Earth to Moon (hr)"
#   time_on_inner_leg_pct       "Time On Inner Leg (%)": inner leg = perigee -> periselene -> perigee (p.5)
#   velocity_space_fixed_m_s    "Velocity (Space-Fixed) (m/sec)" -- printed as 1083.6-1089.3. See note 1.
#   period_day                  "Period (day)"
#
# NOTES (ours, from causey_fig51_check.py; not transcription)
#   1. The printed velocity is one tenth of the geocentric inertial perigee (injection) speed of the orbit our
#      integration finds: row 1 gives 10,888.7 m/s against printed 1088.9; row 5 gives 10,881.7 against 1088.2. The
#      printed decimal point (or unit) is off by a factor of 10. Kept as printed.
#   2. The time column equals the time from the perigee to the start point (the perpendicular crossing behind the
#      Moon), by symmetry; rows 1 and 5 give 155 h and 208 h in our integration.
#   3. The period converts with 1 TU = 105.13 hr (figure legends), i.e. P(day) = P(TU) x 105.13 / 24.
#   4. Row 7, order: the digit "3" looks hand-written over the typed entry. Order 3 is consistent with the text
#      (1/2 order 3 collides with Earth for starts below 2,310 km, p.6) and with the period axis of Fig. 14
#      (18.1-18.6 TU; 80.4 d = 18.35 TU).
#   5. Our integration reproduces every printed period, first-pass time and second lunar approach. Perigees agree to
#      0-22 km; rows 2, 3 and 7 (near-Moon starts, Earth-grazing) are 22, 14 and 10 km off, and their printed speeds
#      differ from ours by the amount those offsets imply. See digest-causey-1964.md section 3.
