conventions:
  model: "planar circular restricted three-body problem, Earth-Moon-probe (p.2)"
  mass_ratio: "Earth/Moon mass ratio 80.45 (p.3); so mu = 1/81.45 = 0.0122774 (our arithmetic)"
  length_unit: "Earth-Moon distance = 1; 385,000 km for conversion to physical units (p.3)"
  time_unit: "period of the primaries = 2 pi (p.2); figure legends: 1 T.U. of time = 105.13 hr (e.g. Fig. 10, p.17)"
  velocity_unit: "1 T.U. of velocity = 1017.42 m/sec (Fig. 44 legend, p.51)"
  unit_note: "385,000 km / 105.13 hr = 1017.26 m/s, not 1017.42; 1017.42 m/s corresponds to 105.11 hr. The two printed units differ by 0.02 per cent (our arithmetic)."
  frame: "rotating, origin at the barycentre, Earth and Moon on the x axis, Moon at x = 1 - mu = 0.98772 (the Fig. 44-50 axes give 1.08 TU = 35,527 km and 1.22 TU = 89,427 km behind the Moon centre, p.56)"
  state_variables: "start at a perpendicular crossing of the Earth-Moon line on the far side of the Moon: y = 0, xdot = 0, x = 1 - mu + (first approach)/385,000 km; only the start radius is tabulated; the starting speed (rotating frame, TU) is given only as graphs (Figs. 44-50)"
  symmetry: "all orbits are symmetric about the x axis (two perpendicular crossings suffice for periodicity, p.2)"
  period_convention: "full period in the rotating frame, in days (column 'Period (day)')"
  excluded: "orbits retrograde as they approach the Earth are neglected (p.3)"
  velocity_column: "printed 'Velocity (Space-Fixed) (m/sec)'; our integration identifies it as the geocentric inertial perigee speed divided by 10 (header note 1)"
  row_count: 7
