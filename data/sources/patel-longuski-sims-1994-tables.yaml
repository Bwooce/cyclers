# NOTE: the JSR 1998 version (doi 10.2514/2.3333) prints the SAME two tables with the SAME numbers.
# They are transcribed here because the project digest of the JSR version did not transcribe the down-escalator
# columns of Table 2. Two witnesses (page image at 400 dpi + tesseract psm 6 / digit whitelist) agree on every cell;
# see witness-comparison.tsv.
# Table 2 (p.479): 'Up/Down Escalator Orbits (From Byrnes et al.[4])'. Columns: encounter; date (calendar date,
#   as printed, month abbreviations as printed); v (km/s): approach V_inf for Earth/Mars rows, Delta-V for Maneuver rows.
#   null = printed dash; one cell (down escalator, Maneuver after Mars-8, V) is blank in 1994 and a dash in 1998.
# Table 3 (p.480): 'Summary of Henon's Results'. Columns: tau/pi (yrs), eta/pi, semi-major axis (AU), eccentricity,
#   period (yrs). Numbers as printed, quoted as strings to keep trailing zeros.
