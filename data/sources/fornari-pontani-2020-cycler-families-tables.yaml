# Fornari & Pontani 2020, Tables 1 and 2: "remarkable" Earth-Mars cyclers of Family I and Family II.
# Source: E. Fornari and M. Pontani, "A global exploration method to identify families of cycling Earth-Mars
#   trajectories", Aerotecnica Missili & Spazio 99:187-194 (2020), doi 10.1007/s42496-020-00050-6.
#   Table 1 p.189 (journal p. 3 of 8); Table 2 p.190.
# Local file: cyclers_pdf/papers/fornari-pontani-2020-global-exploration-families-cycling-earth-mars-trajectories-aerotec-missili-spazio-99-187-doi-10.1007-s42496-020-00050-6.pdf
# Transcribed from the page images (checked against the publisher text layer, which agrees cell for cell).
#   No value here was computed by us. Numbers are strings exactly as printed.
# Model: circular coplanar Earth and Mars orbits, Keplerian arcs, Tsyn = 779.87 d (paper value).
#   ONE-WORKING-BODY: only Earth flybys bend the path. The Mars flyby is treated as negligible; the printed
#   Mars flyby altitude is the altitude that gives a 2-deg hyperbolic deflection, "the minimum flyby altitude
#   that allows neglecting the effect of Mars flyby" (p.189-190). Earth flyby altitudes are the values the
#   required turn implies (a negative value, -967 km for Aldrin, means below the surface; the paper raises it
#   to 400 km with two symmetric SOI maneuvers, 179 m/s total, Appendix).
# Family I (Table 1): one ellipse per repetition period k*Tsyn, Earth flyby only.
#   k = synodic periods per repetition; m = complete cycler revolutions; l = complete Earth revolutions.
#   a = semi-major axis (km); e = eccentricity; t1 = Earth-to-Mars flight time (d).
#   Our check (re-solving eqs. (1)-(4) with Tsyn = 779.87 d for rows k1, k8 m12, k15 m16, k15 m22, k30):
#   a, e and t1 reproduce; v_inf agree to 0.006 km/s or better (see the digest).
#   Text p.188 says the Aldrin case has "k and l both set to 1", but the printed row is k = 1, m = 1, l = 2;
#   l = 2 is what reproduces (a 779.87-d repetition spans two complete Earth revolutions). Printed row kept.
#   Table 1 prints an ellipsis row between k = 15 and k = 30; only printed rows are recorded. The paper reports
#   3339 Family I solutions for k = 1-150 in total.
# Family II (Table 2): two ellipses joined by an Earth slingshot.
#   l1, l2 = Earth revolutions on arcs 1 and 2; m, s = cycler revolutions on arcs 1 and 2.
#   The k = 2 row is the S1L1 cycler: a1 = 1.9506e+08 km, e1 = 0.2554, a2 = 1.5682e+08 km, e2 = 0.1609 (p.191 text).
#   The paper reports 23 Family II solutions for k = 1-10 in total.
