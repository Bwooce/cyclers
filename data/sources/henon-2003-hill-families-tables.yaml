# Henon 2003, Tables VI-XIII: numerical data for the new symmetric families Ha, Hb, Hc, Hd, Hg, He, Hf and family g3
#   of Hill's problem.
# Source: M. Henon, "New Families of Periodic Orbits in Hill's Problem of Three Bodies", Celestial Mechanics and
#   Dynamical Astronomy 85(3):223-246 (2003), doi 10.1023/A:1022518422926. Received 29 April 2002, revised 8 July 2002,
#   accepted 22 August 2002.
# Local file: henon-2003-new-families-periodic-orbits-hill-problem-three-bodies-cmda-85-223-doi-10.1023-A-1022518422926.pdf,
#   24 pp., md5 5b9283c22fea14f924e29f52dbe42217 (digital, has a text layer; the text layer drops Gamma, Sigma and primes).
# Journal page = pdf page + 222. Tables: VI p.234, VII p.236, VIII p.238, IX p.239, X p.240, XI p.241, XII p.242, XIII p.243.
# Transcribed from the page images: every cell was read on 300 dpi page renders. Second witness: tesseract 5.5.3 at 400 dpi,
#   psm 6, on each table crop (one pass with a digit whitelist, one pass without it; the whitelist pass dropped most minus
#   signs, so only the second pass witnesses the signs). Comparison: witness-comparison.tsv. Of 272 cells: 252 agree with the
#   raw OCR; 19 agree only after removing OCR glyph noise ('3.' for N = 3, '~O' for 0, a stray '=' or a split minus; each
#   re-read on the image, image reading kept); 1 disagreement (IX row 5 xi1: OCR noise suggested a minus; a 400 dpi zoom
#   shows 0.731366, no minus). The digital text layer also matched every cell. No value here was computed by us; values we
#   computed appear only inside `note:` fields or in check_henon2003.out, marked as ours. Numbers are kept as printed
#   (strings, trailing zeros kept); the printed minus sign (U+2212) is written "-".
#
# EQUATIONS AND UNITS (p.223, eq. 1; p.224, eq. 2; read on the page image)
#   "xi'' = 2 eta' + 3 xi - xi/(xi^2 + eta^2)^(3/2),  eta'' = -2 xi' - eta/(xi^2 + eta^2)^(3/2)"   (1)
#   "Here xi and eta are the relative coordinates of M3 with respect to M2. Body M1 is at -infinity on the xi-axis." (p.223)
#   Units: the paper does not define them. The form of (1) fixes them (INFERRED, ours): time unit = 1/n (n = angular rate
#   of M2 about M1; the frame rotates at unit rate) and length unit = (G m2 / n^2)^(1/3) = a (m2/(m1 + m2))^(1/3), so that
#   the M2 term has unit coefficient. p.244 gives one stated value: "one Hill's unit equals 1.443 million kilometers" for
#   Sun-Earth-probe (page image). Note (ours): a (m_Earth/m_Sun)^(1/3) = 1.496e8 km x 0.01442 = 2.16 million km, and
#   0.01443 AU = 2.16 million km; the printed 1.443 million km matches neither this unit nor the Hill radius
#   a (mu/3)^(1/3) = 1.50 million km. Kept as printed; it does not affect the tables.
#
# JACOBI CONSTANT (p.224, eq. 2, page image)
#   "Gamma = 3 xi^2 + 2/(xi^2 + eta^2)^(1/2) - xi'^2 - eta'^2"   (2)
#   Sign convention: Gamma = 2 x (effective potential) - v^2, so larger Gamma = lower energy. The Gamma column is this Gamma.
#
# INITIAL CONDITIONS (sec. 1.3, p.224)
#   "To compute a periodic symmetric orbit numerically, we start at one of its two perpendicular crossings of the xi-axis.
#    We specify the two quantities Gamma and xi0. The initial position and velocity are then known: there is eta0 = 0,
#    xi'0 = 0, and eta'0 is computed from (2). We assume that the initial motion is upwards, and therefore we choose the
#    positive determination of eta'0."
#   So the printed state is (Gamma, xi0): position (xi0, 0), velocity (0, +sqrt(3 xi0^2 + 2/|xi0| - Gamma)).
#   No velocity is printed.
#   N: "we call an orbit N-periodic if it intersects the xi-axis 2N times" (p.223); "Successive crossings are numbered,
#    starting from 0 for the initial crossing. For the orbit to be periodic, the crossing with number N should be also
#    perpendicular to the xi-axis" (pp.224-225).
#   xi1: NOT defined in words in the paper. It is the xi of crossing N, the second perpendicular crossing (INFERRED; our
#    integrations from every printed row reach crossing N at xi1 with xi' ~ 0, see check_henon2003.out).
#
# PERIOD: NOT PRINTED. Tables VI-XIII have only the columns N, Gamma, xi0, xi1. Any period or half-period in our outputs
#   is ours (half period = time of crossing N, full period = time of crossing 2N).
#
# SYMMETRY (sec. 1.2, p.224, page image)
#   Sigma:  (xi, eta, xi', eta', t) -> (xi, -eta, -xi', eta', -t)   "a symmetry with respect to the xi-axis" (3)
#   Sigma': (xi, eta, xi', eta', t) -> (-xi, eta, xi', -eta', -t)   "a symmetry with respect to the eta-axis" (4)
#   Sigma Sigma': (xi, eta, xi', eta', t) -> (-xi, -eta, -xi', -eta', t)   "a symmetry with respect to the origin" (5)
#   "In the present paper, as in H5, we restrict our attention to periodic orbits which are symmetric under Sigma." (p.224)
#   Every tabulated family is Sigma-symmetric (symmetric about the xi-axis). g3 is also Sigma'-symmetric (p.242).
#   ASYMMETRIC FAMILIES: NONE are tabulated. Table IV (p.232) lists asymmetric SECOND-SPECIES orbits only, and p.233 says
#   "The continuation into Hill families is not known at present for any of these asymmetric second species orbits."
#   p.245, remark 6: "To my knowledge, no such orbit has been described in the literature so far."
#   Mirror families: Ha', Hb', Hc', Hd', Hg', He', Hf' are the images of Ha ... Hf under Sigma Sigma' (symmetry about the
#   origin; pp.235, 235, 236, 237, 240, 242, 242, read on the page images). They are not tabulated.
#
# STABILITY: NOT PRINTED. No stability column is in Tables VI-XIII, and the paper does not define the index a; it is
#   defined in H5 (Henon 1969, A&A 1:223), not held. What the paper says (pages):
#   - p.225: "family g' began at a critical point of family g, where the stability index is a = 1."
#   - p.225: "When a = cos 2 pi m/n, with m and n integers, the family of simple-periodic orbits intersects a family of
#     n-periodic orbits (Henon, 1965). In particular, when a = -1, we have an intersection with a family of
#     double-periodic orbits. ... When a = -1/2, we have an intersection with a family of triple-periodic orbits."
#   - p.236: Hc meets "the family g' described three times, corresponding to a stability index a = -1/2" at Gamma = 4.279538.
#   - p.245, remark 7: "the orbits exhibited here are strongly unstable in most cases, with large positive or negative values
#     of the stability index a. ... There are, however, small intervals of stability in the vicinity of the extremums of
#     Gamma. Family Hg exhibits also a comparatively large interval of stability on its first branch, between
#     Gamma = 1.914252 and the minimum Gamma = 0.823630."
#   (The meaning of |a| < 1 as the stable range is H5's convention, not restated here; do not cite it to this paper.)
#
# NOTES ON PRINTED TEXT (kept as printed)
#   - Abstract, p.223: "begun in Henon (1996) for simple-periodic orbits". The introduction names this work H5 = Henon
#     (1969), and the reference list has no 1996 item. Probable misprint for 1969.
#   - Hg: p.237 calls 3.836201 "a maximum of Gamma"; p.245 calls 0.823630 "the minimum Gamma" (the reflection orbit, f
#     described four times, p.239). Both are rows of Table X.
#   - g3 maximum 3.806201 (p.242) and Hg maximum 3.836201 (p.237) differ in one digit; each agrees with its own table and
#     both rows integrate as printed (check_henon2003.out), so neither is a misprint.
#   - No misprints were found in the table cells.
