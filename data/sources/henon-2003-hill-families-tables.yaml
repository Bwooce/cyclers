conventions:
  frame: "Hill's problem, eq. (1) p.223: xi'' = 2 eta' + 3 xi - xi/r^3, eta'' = -2 xi' - eta/r^3; M2 at the origin, M1 at -infinity on the xi-axis; unit rotation rate"
  jacobi: "Gamma = 3 xi^2 + 2/r - xi'^2 - eta'^2 (eq. 2, p.224); larger Gamma = lower energy"
  state_printed: "Gamma, xi0 at crossing 0 (eta = 0, xi' = 0, eta' > 0 from eq. 2, sec. 1.3 p.224); xi1 = xi at crossing N (inferred, integration-confirmed); no velocity printed"
  N: "half the number of xi-axis crossings per period (p.223)"
  period_field: none   # no period is printed in Tables VI-XIII; any period in our outputs is ours
  stability_field: none   # no stability column; index a is H5's, not defined in this paper (see header)
  symmetric_families: [Ha, Hb, Hc, Hd, Hg, He, Hf, g3]   # all Sigma-symmetric; g3 also Sigma'-symmetric
  asymmetric_families: []   # none tabulated; asymmetric orbits appear only as second-species sequences (Table IV, p.232)
  row_counts: {VI: 8, VII: 9, VIII: 12, IX: 9, X: 9, XI: 3, XII: 9, XIII: 9, total: 68}
  notes:
    - "Filer check (check_henon2003.py / .out, ours; DOP853 rtol 1e-13 atol 1e-14). One row per table (VI G=2, VII G=2, VIII G=4, IX G=3, X G=2, XI G=-20 first, XII G=2, XIII G=1): xi0* root-found at the printed Gamma matches the printed xi0 within half a unit of the last printed digit, and xi at crossing N matches the printed xi1 likewise, in all 8 tables. The full period (crossing 2N) returns to the start to 1e-12 .. 2e-7."
    - "All 68 rows: velocity real at xi0 and xi1 (68/68). Root-find at fixed Gamma succeeds on 57 rows; 55/57 reproduce xi0 and 55/57 reproduce xi1 to half a unit. Misses by one unit in the last digit (rounding level, not misprints): VII Gamma=2 N=3 xi0 (ours -0.8847815), VIII Gamma=3 N=5 xi1 (ours -0.2987355); and the He fold row (Gamma=-8.615196: ours 0.00076897 vs 0.00076893, xi1 3.55793 vs 3.557963), where xi0 is ill-conditioned."
    - "The 11 rows without a simple root: Gamma folds (Hb, Hc, Hd, Hg, Hf, g3 maxima), intersection rows (Hc 4.279538; g3 -1.411618, 0.015388), and the two ejection rows (Hg 2.433055, g3 2.238611), whose orbits pass through M2 and stop the unregularised integrator. Intersection rows give xidot_N ~ 1e-12 from the printed state (the k-fold simple orbit). Fold tests: for Hb, Hg, He and g3 (PART 4) a maximum of Gamma lies within 1e-5 of the printed Gamma, and the two roots at Gamma - 1e-5 straddle the printed xi0 (root midpoint 2.7e-6 from the printed xi0 for Hb, 6.5e-8 for He; a location test, not a digit match); for Hc and Hd (PART 5) xidot_N is flat in xi0 with its extremum at the printed xi0 and changes sign between Gamma_p - 1e-5 and Gamma_p + 1e-5; the Hf maximum is not cleanly confirmed (nearby grid points hit collisions; printed state gives xidot_N = -2.2e-5)."
    - "The Jacobi value at t = 0 is not an independent check: eta'0 is computed from the printed Gamma. Non-circular checks used: real velocity at xi0 and xi1, xi at crossing N vs printed xi1, Jacobi drift along the integration (<= 2e-9)."
