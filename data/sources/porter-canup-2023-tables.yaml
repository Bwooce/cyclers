# Porter & Canup 2023, Table 3 (ICRF state vectors of the four small satellites), Table 4 (mean osculating elements
#   integrated over 1000 yr), and the text/Figure 1 mass values for Styx, Nix, Kerberos and Hydra.
# Source: S. B. Porter and R. M. Canup, "Orbits and Masses of the Small Satellites of Pluto",
#   The Planetary Science Journal 4:120 (14 pp), 2023 July, doi 10.3847/psj/acde77.
#   Received 2022 May 13, revised 2023 May 15, accepted 2023 May 22, published 2023 July 11. Open access, CC BY 4.0.
# Local file: publisher PDF, 14 pp., text layer, md5 99f33bd5a57ded820339be48efb36f79. PDF page n = journal page n.
# Tables: 3 p.11; 4 p.12. Figure 1 (corner plot with the mass summary printed in the figure) p.10.
#   Tables 1 and 2 (HST and LORRI astrometry) are excerpts of machine-readable tables; they are not transcribed.
# Witnesses: C = page images (pdftoppm -r 200, pages 10, 11, 12), read cell by cell (decides);
#   A = the text layer (pdftotext -layout). Every number below was seen in both. No cell disagrees.
#   Text-layer glyph losses: the degree sign prints as a stray mark in "0.0249" style values ("0 .0249"), and the
#   minus sign of the exponents is a Unicode minus.
# No value here was computed by us. Our values are only in `note:` fields marked "ours" and in
#   porter-canup-2023-compare.py / .out. Numbers are kept as printed (strings).
#
# MODEL (sec. 3, p.7-10): Runge-Kutta-Nystrom integrator (PyNBody), Pluto, Charon and the four small moons only.
#   NO solar or planetary perturbations. Pluto and Charon masses and states are PLU055, held fixed (not fitted).
#   28 parameters: for each small moon ln(GM) plus a barycentric state at the epoch. emcee, 300 walkers. Absolute
#   astrometry (HST 2005-2019 and New Horizons LORRI 2015 Feb-Jul, both registered to Gaia DR2).
#   Priors: density 0.1-3.0 g/cm^3 with the Porter et al. 2021 volumes (the text prints "g m-3", a typo), and a
#   stability check (sqrt(1-e^2) cos(I) must stay within 1e-3 of its start: 10 yr back, then 1000 yr forward).
conventions:
  frame: "ICRF, origin Pluto system barycentre"
  time: "Table 3 epoch 2015-07-15 23:59:59.816 UTC = 2015-07-16 00:01:08.000 TDB = ET 490276868.000 s (as printed)"
  units: "km, km/s, km^3/s^2, days, deg, g/cm^3"
  pluto_charon: "Table 3 Pluto and Charon rows are PLU055 states, not fitted here; no Pluto or Charon GM is fitted or printed"
  uncertainties: "1-sigma; Table 3 gives per-component sigmas for the four small moons; masses are MCMC mean and standard deviation; Styx and Kerberos limits are 1-sigma upper bounds of the posterior"
  table4_definition: "mean of the osculating elements over a 1000 yr backward run of the whole MCMC cloud, sampled every 0.1 yr (10,000 samples of period); +- is the spread over the cloud, not the dispersion over time"
  table4_columns: "T/T_PC = satellite period over the Pluto-Charon orbital period; a relative to the barycentre; I relative to the Pluto-Charon orbital plane"
  figure1_precision: "Figure 1 prints Nix 1.74550 +- 0.34724 and Hydra 2.01140 +- 0.20175 (x1e-3); the text rounds to 1.74 +- 0.35 and 2.01 +- 0.20, the abstract to 1.8 +- 0.4 and 2.0 +- 0.2"
