# Huang & Wade 1963, Tables I-VI: planar direct and retrograde 2/3-resonant Earth-Moon periodic orbits, their period
#   variation, and two 3D initial-condition sequences.
# Source: Su-Shu Huang and Clarence Wade, Jr., "Preliminary Study of Periodic Orbits of Interest for Moon Probes. II",
#   The Astronomical Journal 68(6):388-391 (August 1963), doi 10.1086/108988, ADS 1963AJ.....68..388H.
#   Received 11 October 1962.
# Local file: ADS scan (200 dpi colour JPX plus 600 dpi JBIG2 mask per page), 4 pp., md5 439006dcdcb5f73b1f7241958455cbb3;
#   OCR copy (ocrmypdf --force-ocr -l eng) md5 55d2addd34f665383c91aaea9532176a (re-made 2026-10-11 with ocrmypdf --force-ocr -O 3; render-checked against the ADS original). PDF page n = journal page 387 + n.
#   PDF page 1 also carries the end of Westerman's preceding paper (AJ 68:382-388).
# Tables I-II p.389 (left column), III p.389 (right), IV p.390 (left), V-VI p.390 (right). No table on p.388 or p.391.
# Transcribed from the page images (400 dpi crops; the image decides). Second witness: tesseract 5 psm 6 on 400 dpi
#   crops of each table (witness-tesseract/w63_*.txt). Cell-by-cell comparison: witness-comparison-huangwade1963.tsv.
#   Em-dash minus signs and "-+" (a plus sign read as two glyphs) were normalized before comparing.
#   The ocrmypdf text layer was NOT used for any value (it reads Table V 0.585 row p1 as "12.5604"; the image is 12.5694).
# No value here was computed by us. Values we computed are only in `note:` fields, marked "ours".
# Numbers are kept as printed (strings, trailing zeros kept); minus is "-", the printed plus sign is "+".
conventions:
  frame: >-
    As Huang 1962 (cited p.388 "the symbols used here have been defined" there): rotating frame, origin at the
    Earth-Moon barycentre, unit length = Earth-Moon separation, total mass 1, Earth (1 - mu) at x = -mu, Moon (mu)
    at x = 1 - mu, lunar period 2 pi. mu = 0.01215 is printed in Huang 1962 (p.304, p.308), not in this paper.
    Our integration at that mu reproduces every printed p1 (integrate_huang.out), which confirms frame and mu.
  initial_conditions_planar: "x = x0, y = 0, xdot = 0, ydot = ydot0 (eq. 2, p.388)"
  initial_conditions_3d: "x = x0, y = 0, z = 0, xdot = 0, ydot = ydot0, zdot = zdot0 (eq. 3, p.390); sequences (eq. 4): (1) x0 = -0.39215, (2) x0 = -ydot0"
  period_p_n: >-
    "the time interval between two successive crossings over the x axis by the third body at points near to each
    other" (p.388); p1, p2, ... are the periods of successive cycles. For the 3D tables p_n(z=0) and p_n(y=0) are
    the intervals between successive passages through the xy and xz planes at x near x0 (p.390).
  Delta: "Delta_{n+1,n} = p_{n+1} - p_n (eq. 1, p.388). A periodic orbit has Delta = 0."
  bracket: >-
    "For each value of x0 in both tables, two values of ydot0 are given - one with Delta_2,1 being positive and the
    other with Delta_2,1 negative. Therefore, the correct value of ydot0 ... must lie somewhere between" (p.389).
  integration: >-
    Fourth-order Runge-Kutta, double precision, IBM 7090, Delta t = 0.0078125; Jacobi constant constant to at least
    six significant figures over 4 pi; Lagrange four-point inverse interpolation for p_n (pp.388-389). Tables V-VI in
    single precision (p.390).
  selection: "far-side closest lunar distance between 0.08 and 0.20 (p.388)"
  units_time: "lunar period 2 pi; 4 pi = two sidereal months"
  notes: >-
    Witness counts (witness_compare.out; value cells, row labels not counted): Table I 42, II 45, III 20, IV 52 plus
    8 header cells, V 84, VI 24; 275 value cells in all. Tesseract agrees with the image on 274; the one difference
    is a print speck read as a minus sign before 12.726670 (Table IV header). Row labels (n) all agree.
    Two printed sign slips in Table I (see its note). The text says the direct family is unstable and the
    retrograde family stable; Table III shows growth ratios of about 8.5-10, Table IV bounded oscillation.
tables:
  - table: "I"
    caption: "Initial conditions for periodic orbits in direct motion."
    journal_page: "389"
    columns: [x0, ydot0, p1, Delta_2_1]
    blank_x0_means: "same x0 as the row above (printed once per pair)"
    rows:
      - ["-0.39215", "-1.6102480", "11.643597", "-0.000457"]
      - ["", "-1.6102481", "11.643566", "-0.000380"]
      - ["-0.37215", "-1.7014694", "11.780075", "-0.000091"]
      - ["", "-1.7014695", "11.780050", "+0.000453"]
      - ["-0.35215", "-1.7982280", "11.900590", "-0.000175"]
      - ["", "-1.7982281", "11.900571", "+0.000161"]
      - ["-0.33215", "-1.9013902", "12.004325", "-0.000025"]
      - ["", "-1.9013903", "12.004311", "+0.000178"]
      - ["-0.31215", "-2.0120181", "12.092292", "-0.000105"]
      - ["", "-2.0120182", "12.092282", "-0.000014"]
      - ["-0.29215", "-2.1314275", "12.166330", "-0.000034"]
      - ["", "-2.1314276", "12.166323", "+0.000036"]
    note: >-
      Printed sign slips (ours, see integrate_huang.out): x0 -0.39215 second row prints -0.000380, and x0 -0.31215
      second row prints -0.000014. The text says each pair has one positive and one negative Delta_2_1. Table III
      prints +0.000014 for ydot0 -2.0120182 at n = 1. Our RK4 replay with the paper's step gives -0.000456/+0.000380
      and -0.000106/+0.000015. So both are minus signs that should be plus. Kept as printed.
