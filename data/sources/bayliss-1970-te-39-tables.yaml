errata:   # printed-value errors found by the closure checks; the printed values above are NOT altered
  - id: e2_point5_planetocentric_z
    where: "Appendix E.2, Planetocentric Coordinates of SOI Entry and Exit Points, point 5 (Mars exit), z; printed p.178"
    printed: 1060012
    problem: "With x = -1151504 and y = -1053602 the printed z gives a radius of 1886707 km. The enlarged Mars sphere of influence is 1564377.2 km (Table C.2), and every other Mars point sits on it within 0.6 km. The printed elevation of point 5 (sec. 5.1) is 3.885 deg, which needs z near 106000."
    ours: {z_from_soi_radius_km: 106006.5, z_from_printed_elevation_km: 105993.0, likely_intended: "106012 (one zero and the comma dropped from the print)"}
    witnesses: "A (OCR) and B (render, also a 260 dpi crop) both read 1,060,012; the print itself carries the error"
  - id: e3_point2_true_heliocentric_vz_sign
    where: "Appendix E.3, True Heliocentric Velocity at SOI Entry and Exit Points, point 2 (Jupiter entry), v_z; printed p.180"
    printed: 0.060104
    problem: "True planetocentric v_z at point 2 is -0.232962 and the planet v_z is 0.172861, so the heliocentric v_z must be -0.060101. The printed +0.060104 leaves a residual of 0.1202 km/s; with the minus sign the residual is 3e-6 km/s. A 260 dpi crop shows no minus sign in the print."
    ours: {expected: -0.060101, residual_as_printed_km_s: 0.1202, residual_with_minus_km_s: 0.000003}
  - id: e4_point10_planetocentric_x_sign
    where: "Appendix E.4, Planetocentric Coordinates of SOI Entry and Exit Points, point 10 (Earth entry), x; printed p.182"
    printed: 1637219
    problem: "Point 10 is an SOI entry point, so the planetocentric position and velocity must have a negative dot product, as at all 9 other points with a printed velocity (-7.3e6 to -1.5e9 km2/s for entries). With the printed positive x the dot product is +1.4e6. The sec. 7.1 azimuth of point 10 is 183.950 deg, which needs a negative x (the printed x, y give -3.950 deg). Point 10 is also close to antipodal to exit point 9 in all three components, as a full-revolution return is expected to be."
    ours: {expected_x: -1637219, dot_product_as_printed_km2_s: 1.421e6, dot_product_with_minus_km2_s: -9.543e6}
  - id: e4_point12_julian_date
    where: "Sec. 7.1 list of SOI points, point 12 (Venus SOI entry, arrival); printed p.102"
    printed: 2442123.36905
    problem: "The leg 11-12 time of flight is 159.40312 d, but the printed JDs of points 11 and 12 differ by 160.40312 d. The Venus position printed for point 12 in E.4 matches an independent ephemeris at JD 2442122.36905 (108 km, as for the other Venus rows) and is 3031000 km from the ephemeris at the printed JD. The leg sum (1311.07102 d) also matches JD 2442122.36905."
    ours: {likely_correct_jd: 2442122.36905}
  - id: calendar_dates_in_sec_6_1_and_7_1
    where: "Sec. 6.1 (launch 'October 6, 1978', arrival 'July 13, 1989'); sec. 7.1 (launch 'August 11, 1970', arrival 'March 13, 1974')"
    problem: "The printed calendar dates do not follow from the printed JDs by the standard conversion. Chapter 6: JD 2443787.0 is 1978 Oct 5 12:00 and JD 2447720.0 is 1989 Jul 12 12:00 (printed dates one day later). Chapter 7: JD 2440811.29805 is 1970 Aug 12 19:09 and JD 2442122.36905 is 1974 Mar 15 20:51 (printed dates 1.8 and 2.9 days earlier). The JD columns are the authority: they reproduce the printed planet positions through the Appendix C expansions."
  - id: neptune_expansion_vs_e3_neptune_position
    where: "Appendix C Neptune expansion (p.159) against Appendix E.3 point 8 planet position (p.179)"
    problem: "Our evaluation of the printed Neptune expansion at JD 2447720.0 gives z = 72429125 km against the printed 72635448 km (0.28 percent in z, 206000 km). x and y agree to about 5000 km. All other Appendix C expansions used (Venus, Earth, Mars, Jupiter, Saturn, Uranus) reproduce the printed positions to 216 km or better. Cause not found. It affects only the Neptune arrival point of the Grand Tour example."
  - id: ch7_leg_10_11_time_of_flight
    where: "Sec. 7.1 leg table, leg 10-11"
    problem: "Printed 10.98699 d against 10.98696 d from the printed JDs (2.6 s). Rounding level; no action."

checks:   # computed by us (witness C); none of these is a printed number
  soi_radius_closure: "|planetocentric position| equals the enlarged SOI radius of Table C.2 within 0.6 km for all 26 SOI points except E2 point 5 (see errata; the E4 point 10 sign does not change the radius) and the two Saturn points of E3 (3.0 and 3.9 km short of 94129489.7, a constant offset, not a misread digit)"
  velocity_closure: "true heliocentric velocity minus planet velocity equals the true planetocentric velocity within 6e-4 km/s for E2 and E3 (after the sign erratum) and within 0.003 km/s for E4 points 2, 7, 8, 11. E4 points 3-6 and 9-10 differ by 0.01 to 0.05 km/s with the same sign at the entry and exit of each pass; read as a timing difference between the integrated and the conic crossing, not a misread digit"
  azimuth_elevation_closure: "printed azimuth and elevation of all 26 SOI points follow from the Appendix E planetocentric coordinates to 0.001 deg, except E2 point 5 (z erratum) and E4 point 10 (x sign erratum; the printed azimuth 183.950 is the consistent one). Ch7 point 7 prints elevation -121.732 with azimuth 90.723, the same direction as azimuth -89.277 and elevation -58.268"
  c3_closure: "|v_helio - v_planet|^2 - 2 mu_E / r_SOI at the launch point gives 18.343, 101.522 and 18.429 km2/s2 against printed 18.378, 101.520 and 18.427"
  planetocentric_leg_closure: "for all 10 planetocentric legs: periapse radius in planet radii equals a (e - 1) from the printed elements to 1e-4; periapse radius km divided by that equals the radius used (Venus 6050, Earth 6378.2, Mars 3410, Jupiter 71400, Saturn 60400, Uranus 23500 km); central angle minus 180 deg equals the printed turn angle exactly"
  heliocentric_central_angle_closure: "the angle between the heliocentric SOI-point vectors (planet position plus planetocentric coordinates, Appendix E) matches the printed central angle of all 13 heliocentric legs to 0.13 deg or better (0.108 and 0.121 deg for ch7 legs 1-2 and 7-8, 0.07 deg or less elsewhere), after the two E-table errata"
  ch7_error_table_closure: "each printed per-point prediction error (sec. 7.4) lies between |a - b| and a + b, where a is the dv(t2) error of the leg before the point and b the dv(t1) error of the leg after it, for all 12 points"
  ch7_v_inf_from_periapse_velocity: "v_inf = sqrt(v_p^2 - 2 mu / r_p) gives 4.995, 5.002, 4.989 km/s at the three Venus passes and 4.372, 4.367 km/s at the two Earth passes; launch v_inf from C3 is 4.293 km/s"
  planet_velocity_closure: "eq. C.4 with the printed expansions reproduces all 26 printed planet-velocity rows to 4e-5 km/s (Earth, Venus, Mars), 1.5e-4 (Uranus, Neptune), 1.3e-3 (Saturn) and 5.8e-3 (Jupiter); E4 point 12 matches only at JD 2442122.36905 (4e-5 km/s)"
  appendix_e_cells_confirmed_on_crops: "260 dpi crops agree with the typed values for E3 true heliocentric point 8 and E4 true heliocentric points 9, 11, 12, E4 planetocentric point 4, E4 positions 3 and 10, E2 planetocentric point 5 and E3 true heliocentric point 2 (the last two are printed errors, see errata)"
  sums: "corrections ch5 0.2263 and ch6 2.652; ch7 impulses 220.534 and prediction errors 38.950 all equal the printed totals; leg times of flight sum to the SOI-JD span for ch5 and ch6 (ch7 differs by the point 12 erratum)"
  ephemeris_closure: "printed Appendix C expansions evaluated by us reproduce the printed planet positions of E2, E3 and E4 (JD from the chapter lists): Earth to 11 km, Venus 126-136 km (constant z offset), Mars 204-216 km, Jupiter 5-9 km, Saturn 52-58 km, Uranus 146-148 km; Neptune fails (see errata)"
  enlarged_soi_closure: "Table C.2 enlarged radius equals a (mu_p/mu_sun)^(1/3) with the Appendix C semi-major axis and an astronomical unit of 149599000 km for all planets (Mercury 149598979 km)"
