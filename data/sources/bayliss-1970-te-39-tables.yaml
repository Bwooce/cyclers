# Bayliss 1970, "Precision Targeting for Multiple Swingby Interplanetary Trajectories": every numeric table.
# Source: S. S. Bayliss, Ph.D. thesis, Department of Aeronautics and Astronautics, MIT (submitted 11 May 1970), issued as
#   Measurement Systems Laboratory report TE-39, June 1970, NASA grant NGR-22-009-207, NTRS 19700024926 (NASA CR-109936).
#   Supervisor W. M. Hollister (chair); committee Vander Velde, McKay, R. H. Miller.
# Local scan: 182 PDF pages, md5 f7a1bdd0dfa3f867c784f504e5612278. The scan omits the 'preceding page blank not filmed' pages, so
#   PDF page = printed page minus 1 to 7, growing through the report (p.13 = PDF 12, p.74 = PDF 72, p.96 = PDF 94, p.101 = PDF 98,
#   p.107 = PDF 104, p.157 = PDF 151, p.178 = PDF 172, p.189 = PDF 182). Page numbers below are the printed ones.
# Units as printed: positions km, velocities km/s (Appendix E) or m/s (chapters 5-7 corrections and offsets), times days or Julian date.
# Witnesses (three, per value): A = fresh ocrmypdf/tesseract layer (the NTRS text layer is not used); B = page renders read by eye and
#   typed by hand (110 dpi for all pages, 260 dpi crops for the flagged cells); C = closure checks by script (ours, see `checks:`).
#   Where A and B disagreed, C decided. The disagreements and the printed-value errors are in `errata:` and in the digest, sec. 6.
# Every value under `checks:` or `ours:` is computed by us and is not a printed number. Printed values are kept as printed, errors included.

meta:
  report: TE-39
  ntrs: 19700024926
  degree: Ph.D. (Doctor of Philosophy), MIT, May 1970
  sponsor: NASA grant NGR-22-009-207
  planet_numbers: {1: Mercury, 2: Venus, 3: Earth, 4: Mars, 5: Jupiter, 6: Saturn, 7: Uranus, 8: Neptune}

