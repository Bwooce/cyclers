      - {case: "b", V0: "-30.01", A: "30.04", B_min: "2.748553", B_bar: "2.751666", B_max: "2.754779", T: "664.487", note: "ours: 2.748552, 2.754773, T 664.3"}
      - {case: "c", V0: "-30.1", A: "30.4", B_min: "3.563967", B_bar: "3.620006", B_max: "3.676044", T: "452.2", note: "ours: 3.563981, 3.676042, T 452.18"}
      - {case: "d", V0: "-30.2", A: "begin at 30.8", B_min: "6.440", B_bar: "", B_max: "up to 271", T: "", note: "escape orbit; ours: B at t = 0 is 6.441761 (A0 30.8, X0 -0.4, Z0 0), close to the printed 6.440, so 6.440 is probably the starting B (like begin at 30.8), not a window minimum; the last digit differs (6.442 against 6.440). B grows to 283 by t = 400, r reaches 1729"}
