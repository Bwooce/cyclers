# Benest 1976, Tables I-III: the averaged libration function F(Z), the B constants of Fig. 3, and the numerical
#   verification cases of Fig. 4 (Hill's problem, retrograde satellites, family f).
# Source: D. Benest, "Libration Effects for Retrograde Satellites in the Restricted Three-Body Problem. I: Circular
#   Plane Hill's Case", Celestial Mechanics 13:203-215 (1976), doi 10.1007/BF01232724, ADS 1976CeMec..13..203B.
#   Received 29 December 1974.
# Local file: ADS JBIG2 scan, 13 pp., md5 db5e260a97857c480b77fa6c0adcd436; OCR copy (ocrmypdf --force-ocr -O 3 -l eng)
#   md5 2d6beee2a0e70e4f2ab7bfa6a27a8f64. PDF page n = journal page 202 + n.
# Tables: I p.210 (PDF p.8); II p.212 (PDF p.10); III p.213 (PDF p.11).
# Witnesses: C = the 110 dpi page image, read cell by cell (decides); A = the OCR text layer of the -O 3 copy. A scripted
#   search found 98 of the 103 numeric cells verbatim in the text layer. The other 5 are the V0 cells; their digits are in
#   the text layer and the minus prints there as a dash and a space ("— 30.0022"), confirmed by eye. The layer also has a
#   stray full stop after "2.748 553" in Table III b that is not on the page.
# No value here was computed by us. Our values are only in `note:` fields, marked "ours", and in check_benest.out.
#   Numbers are kept as printed (strings); the printed thin space in 6-decimal numbers is dropped.
#
# EQUATIONS, FRAME AND UNITS (sec. 2, pp.203-206, read on the page image)
#   Circular plane Hill's case, rotating axes, origin at B2 (the small primary). Hill units (Henon 1969/1970 scaling).
#   "x' = u, y' = v, u' = 2v + 3x - x/rho^3, v' = -2u - y/rho^3"  (1),  rho^2 = x^2 + y^2.
#   Osculating "reference ellipse" (eqs. 4-6): x = X + (1/2) A cos(t - phi), y = Y - A sin(t - phi),
#     u = -(1/2) A sin(t - phi), v = -(3/2) X - A cos(t - phi).
#   Inversion (ours, from eqs. 5-6): X = 4x + 2v, A cos(t - phi) = -6x - 4v, A sin(t - phi) = -2u, Y = y + A sin(t - phi).
#   Z = Y/A, W = X A^(1/2). Averaged integral (eq. 20): B(Z, W) = (3/4) W^2 + 4 F(Z) = const.
#   F(Z) = 2 K[4(Z^2 - 3/4)]/pi (eq. 18), K(m) = complete elliptic integral of the first kind, parameter m (Milne-Thomson).
#   Small-amplitude libration period (eq. 22): T = 2^(-1/2) pi^(3/2) [K(3/4) - E(3/4)]^(-1/2) A^(3/2) ~ 4.049378 A^(3/2).
#   Table III initial state: x = X0 = 15, y = 0, u = 0, v = V0 (Hill coordinates; the u = 0, y = 0 start is our reading of
#   "constant-abscissa section", confirmed: our A0 = |6 x0 + 4 V0| equals the printed A in all rows).
conventions:
  coordinates: "Hill's problem, rotating frame, origin at the small primary B2; Henon (1969) Hill scaling"
  state_columns: "X0 = start x (y0 = 0, u0 = 0), V0 = start ydot"
  B_bar: "printed B-bar is the mean of B_min and B_max (ours: (2.745789 + 2.748013)/2 = 2.746901)"
  notes: "Table I: F(Z) to 6 decimals. Table III: T is the libration period of the guiding centre, not the 2 pi fast period."
tables:
  - table: "I"
    caption: "The function F(Z)"
    journal_page: "210"
    columns: [Z, F]
    rows:
