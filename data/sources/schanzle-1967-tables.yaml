conventions:
  frame: "planar CR3BP, barycentric rotating frame (eq. p.149); Sun (mass 1 - mu) at (-mu, 0), Jupiter (mass mu) at (1 - mu, 0); r1 = Jupiter distance, r2 = Sun distance; length unit = Jupiter-Sun distance; time unit: G = 1, Jupiter period = 2 pi"
  mu: "not printed; 0.000953875 (Rabe's value, printed by Taylor 1981) fits to 1e-8 in C (ours, fitmu_schanzle.out)"
  jacobi: "formula not printed; C = x^2 + y^2 + 2(1-mu)/r2 + 2 mu/r1 - v^2 reproduces Table I (ours)"
  state_printed: "x0, xdot0 = 0, ydot0 at the x axis; Crossing = first perpendicular x-axis crossing at 1/2 T; Final = state at T"
  period_field: "half_T (1/2 T); T/2 over pi = number of Jupiter periods in the half period, e.g. 91.757038/pi = 29.2073"
  stability_index: "cosh(Omega T) (Table III), > 1 unstable; no horizontal-index Hill-equation number is printed for the other orbits"
  symmetric_families: ["Rabe's horseshoe class, x0 = -1.026903545 ... -2.0 (one class, traced by continuation in x0 at the first crossing)"]
  asymmetric_families: []
  page_references: {equations: "149", method_and_criterion: "149", fig_3: "150-151", fig_9_to_14: "153", fig_15_to_20: "154", fig_21_22_23_24: "155", table_I_II: "156", table_III_stability_conclusions: "157"}
  row_counts: {table_I: 22, table_II: 9, table_III: 4, fig_captions: 14, total: 49}
  notes:
    - "Witnesses (witness-comparison-schanzle.tsv, 246 cells): tesseract at 400 dpi agrees exactly with the page-image reading on 163 cells; on 15 more the digits appear inside a glued token and on 3 more a truncated prefix matches (weaker agreement); 23 exponent cells (11 in Table I, 12 in Table II): a tight 2x crop of the xdot columns gives all 23 mantissas and signs correctly but garbles most exponents, so each exponent has one witness (the image); 34 zeros are not compared; 8 cells differ (1 plus sign garbled to '-+-' in Table II; 7 caption cells where tesseract garbles a 200 dpi caption line: Fig. 9 ydot0, Fig. 13 x0, Fig. 16 ydot0, Fig. 17 x0, Fig. 18 x0, Fig. 19 T/2, Fig. 20 T/2). The 14 captions agree with Table I within caption shortening on all 11 orbits that appear in both (caption_vs_table1.out)."
    - "Closure (integ_schanzle.py / .out, ours; DOP853 rtol 1e-13 atol 1e-13; mu 0.000953875): the printed C is reproduced from (x0, ydot0) to 2e-8 in all 11 rows. At the printed half period the orbit reaches the printed crossing x and ydot to 3e-10 .. 2e-6 for x0 = -1.026903545 .. -1.9 (worst ydot 1.8e-6 at -1.2), with |y| < 6e-5 and |xdot| < 1.3e-4 (except x0 = -1.9: 3.2e-4). The x0 = -2.0 row is a collision orbit (printed crossing x = -0.000957480 = -mu, i.e. at the Sun; ydot = -744) and is not reproduced (ours ends 4.6e-4 from the Sun, ydot -5.7). Table II full period: x0 = -1.026903545 returns within 1.3e-8 in x and 2.5e-8 in ydot (ours final x -1.026903532 equals the printed P.S. value). For x0 = -1.1 and -1.2 our full-period return errors (2.3e-6 and 1.5e-4) are the expected amplification of the 9-digit initial-condition truncation (monodromy eigenvalue about 1.5e3 at -1.1) and are of the size of the P.S. column errors (2.4e-6 and 6.8e-5); we do not reproduce the much smaller R.K. column drift, so it is not evidence of better closure."
