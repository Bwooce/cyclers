# Schanzle 1967, Tables I-III and the Figs. 9-22 caption values: continuation of Rabe's horseshoe orbit (barycentric frame).
# Source: A. F. Schanzle, "Horseshoe-Shaped Orbits in the Jupiter-Sun Restricted Problem", The Astronomical Journal 72:149-157
#   (March 1967), doi 10.1086/110211, ADS 1967AJ.....72..149S. Received 29 August 1966.
# Local file: ADS 200 dpi JPX scan, 9 pp., md5 2135960a6c830510c7982c42cde74593; OCR copy (ocrmypdf --force-ocr -l eng, the scan
#   is rasterised by it) md5 fee02673b9400da9a0238b2b6359db14 (re-made 2026-10-11 with ocrmypdf --force-ocr -O 3; render-checked against the ADS original). PDF page n = journal page 148 + n.
# Tables: I and II p.156 (PDF p.8); III p.157 (PDF p.9). Caption values: Figs. 9-14 p.153, Figs. 15-20 p.154, Figs. 21-22 p.155.
# Transcribed from the page images: every cell was read on 300-400 dpi renders of the original scan (witness C, decides).
#   Witness A: tesseract 5.5.3, psm 6, on separate 400 dpi crops (NOT the OCR text layer). The scan is 200 dpi, so the
#   small figure captions are weaker for tesseract than the tables. Cross-check: the caption values against Table I
#   (caption_vs_table1.out). Comparison: witness-comparison-schanzle.tsv.
# No value here was computed by us. Values we computed are in integ_schanzle.out, fitmu_schanzle.out and stability_check.out only.
#   Numbers kept as printed (strings); the printed minus sign is "-"; exponent cells are written as 1e-9 style strings
#   (printed as "-3 x 10^-10").
#
# EQUATIONS, FRAME AND UNITS (Introduction, p.149, read on the page image)
#   "The equations of motion for the restricted problem in the barycentric system are
#      xddot - 2 ydot = x - [mu (x + mu - 1)/r1^3] - [(1 - mu)(x + mu)/r2^3],
#      yddot + 2 xdot = y - (mu y / r1^3) - [(1 - mu) y / r2^3],
#    where r1^2 = (x + mu - 1)^2 + y^2, r2^2 = (x + mu)^2 + y^2."
#   So r1 is the JUPITER distance (Jupiter at (1 - mu, 0), mass mu) and r2 the SUN distance (Sun at (-mu, 0), mass 1 - mu).
#   This is the same frame as Taylor 1981. No transformation is needed for the Table I and II rows (barycentric); they are
#   not Jovicentric.
#   "The unit of length is the Jupiter-sun distance, the sum of the masses is the unit of mass, and the unit of time is such
#   that the gravitational constant becomes unity." So Jupiter's period is 2 pi time units. Confirmed by p.156: "one unit of
#   time = 1.8879 earth years" (11.86223 / 2 pi = 1.8879) and "commensurability exists for 1/2 T = 91.1077" (29 pi).
#   mu is NOT printed anywhere in the paper. Rabe's value 0.000953875 (printed by Taylor 1981) reproduces the printed
#   Jacobi constants of Table I to 1e-8 (ours, fitmu_schanzle.out: fitted mu 0.000953844 to 0.000953917 per row, mean
#   0.0009538767), and is used for every integration here (ours).
#   Jacobi constant (formula not printed): C = x^2 + y^2 + 2 (1 - mu)/r2 + 2 mu/r1 - xdot^2 - ydot^2 reproduces Table I (ours).
#   Names: "d0 = 1.06" is Rabe's parameter (1961) for the orbit x0 = -1.026903545 ("Rabe's periodic orbit").
#   Orbits start on the x axis at x0 (y = 0, xdot = 0) with ydot0 > 0; "Crossing" is the first perpendicular crossing of the
#   x axis after departure, at time 1/2 T (a half period). "Final" (Table II) is the state at time T (a full period).
