  mu: 0.00095388
  period_convention: "T_norm_printed = (1-mu) T/(2 pi) as printed; T_over_2pi = T_norm_printed/(1-mu), DERIVED by us (5 decimals) with mu = 0.00095 (the value the table was computed at, see notes)"
  mu_fitted_by_our_checks: 0.00095
  mu_printed: {section_heading: "0.00095388", text_p13: "0.00095", abstract: "10^-3"}
  n_orbits: 35
  notes:
    - "C: the printed C equals -2H + mu (= barycentric Jacobi constant + mu(1-mu)), not -2H as stated on p.6; checked on all 35 rows at t = 0 (max residual 5e-5 at mu = 0.00095, i.e. 5-decimal rounding of the state)."
    - "T_norm: the printed values are (1-mu) T/(2 pi) (the KIAM 67/2005 definition), not T/(2 pi) as stated on p.6. Integrations at mu = 0.00095 reproduce T_norm to 1e-5 on 12 rows."
    - "mu: integrations and w1 = mu/(1 - x1(T/2)) both fit mu = 0.00095 (the p.13 text) and reject 0.00095388 and 0.001; e.g. row 10 T_norm 1.97012 is reproduced at 0.00095 and gives 1.97000 at 0.00095388; row 4 w1 0.1617 needs mu <= 0.00095."
    - "Rows 2 and 3 do not close as cleanly as the others (x1(T/2) off by 1.3e-4, y2(T/2) by 2e-4 after correcting y2(0) by -5e-5). Not called a misprint; cause not found."
    - "Collision with P2 is printed as x1(T/2) \"1\" with y2(T/2) \"∞\"; collision with P1 as \"0\" with \"∞\"."
    - "Table 3 maps k1 = 16 to k2 = 33, 34 only; row 35 (the P2 collision, like rows 7 and 21) is not mapped. Possibly an omission (compare k1 = 2 -> 5-7 and k1 = 9 -> 19-21)."
