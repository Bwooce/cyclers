# Bruno & Varin 2009, Tables 1-5: critical orbits of family h of the planar circular restricted problem
#   for mu = 0, mu_J, 0.1, 0.2, and the Table 1 / Table 2 correspondence (Table 3).
# Source: A. D. Bruno and V. P. Varin, "Family h of Periodic Solutions of the Restricted Problem for Small mu",
#   Solar System Research 43(1):2-25 (2009), doi 10.1134/S003809460901002X. English translation (Pleiades)
#   of Astronomicheskii Vestnik 43(1):4-27 (2009). Received 30 April 2008.
#   Table 1 p.3; Table 2 pp.9-10; Table 3 p.11; Table 4 p.16; Table 5 p.21; side values pp.14, 21-22, 25.
#   Journal form of KIAM Preprint 67/2005, whose TeX source lacks these tables.
# Local file: cyclers_pdf/papers/bruno-varin-2009a-family-h-periodic-solutions-restricted-problem-small-mu-sol-syst-res-43-1-2-doi-10.1134-s003809460901002x.pdf, md5 d333e174283aafe953d3fc3bde2c4652 (24 pp, text layer).
# Transcribed from the page images (300 dpi, every cell read on a zoomed crop); the text layer agrees with the
#   images cell for cell and was used only as a locator. No value here was computed by us. Numbers are strings
#   exactly as printed (trailing zeros kept; "1" vs "1.00000", "0" vs "0.0000" and blank (null) kept apart;
#   Table 4 prints a bullet "•" where Tables 2 and 5 print "∞"). En-dash minus signs are written as ASCII "-".
#
# Frame and units (paper eq. (1)-(3), p.2): units with m1 + m2 = 1, G = 1, |P1P2| = 1, angular velocity 1.
#   Synodic frame centred on P1 (the larger mass, 1 - mu); P2 at (x1, x2) = (+1, 0).
#   (y1, y2) are canonical momenta: y1 = dx1/dt - x2, y2 = dx2/dt + x1.
#   H = (y1^2 + y2^2)/2 + x2 y1 - x1 y2 - 1/r + mu (1/r + x1 - 1/r2), r = |x|, r2 = |x - (1,0)|.
#   The paper says C = -2H (p.6). -2H equals the usual barycentric Jacobi constant minus mu^2. BUT the printed C
#   in Tables 2, 4 and 5 equals -2H + mu = barycentric Jacobi constant + mu(1 - mu) (L4/L5 at C = 3), checked
#   row by row (see the digest and checks_bv2009.out). At mu = 0 the two agree.
#   Symmetry (3): (t, x1, x2, y1, y2) -> (-t, x1, -x2, -y1, y2); plane Pi: x2 = y1 = 0.
#   Every orbit starts on Pi at t = 0 with x2 = y1 = 0; x1(0), y2(0) are its coordinates there.
# Columns (paper p.8 and p.13):
#   k: critical-orbit number. An orbit is critical if it is a collision orbit (with P1 or P2), or Tr = +-2,
#     or Tr_v = +-2, or C has an extremum along the family (p.6).
#   x1_0, y2_0: point on Pi at t = 0.
#   v1_T2, v2_T2 (Table 1 only): velocity with which the orbit enters P2 = (1, 0) at T/2, if it does.
#   x1_T2, y2_T2 (Tables 2, 4, 5): point on Pi at t = T/2. "1" with y2 "∞"/"•" = collision with P2;
#     "0" / "0.00000" with "∞"/"•" = collision with P1.
#   T_norm_printed (Tables 2, 4, 5) / T_over_2pi (Table 1; DERIVED in Tables 2, 4, 5): normalized period T~
#     (key names reconciled 2026-10-07; see `conventions:` at the end). The paper says T~ = T/(2 pi) (p.6; Table 1 heads it "T/2pi"), but the printed
#     values in Tables 2, 4 and 5 are (1 - mu) T/(2 pi), the KIAM 67/2005 definition: our integrations reproduce
#     them to 1e-5 with (1 - mu) and miss by a factor 1/(1 - mu) without it. At mu = 0 the two agree.
#   C: Jacobi constant (printed values = -2H + mu; see above).
#   Tr, Tr_v: modified planar and vertical traces, eq. (4): Tr~ = Tr if |Tr| <= 2, else (1 + log2|Tr|) sgn Tr.
#     At mu = 0 the entries are intervals [before, after] over which the trace jumps on that orbit.
#   a_0, e_0: "celestial" (astronomical) coordinates a~(0), e~(0) of the starting point, system III of
#     Bruno & Varin 2008 (Sol. Syst. Res. 42(2), doi 10.1134/S003809460802007X). x1 = a~ (2 - |e~|) and
#     y2|y2| = (1 - mu) e~/x1 (the (1 - mu) factor is our inference from the 12-digit side values, which it
#     reproduces with the printed x1, y2 and C; with factor 1 it fails).
#   a_T2, e_T2: the same coordinates at t = T/2.
#   w1_T2 (Table 1) / w1 (Tables 2, 4, 5): coordinate w1 = mu/(1 - x1) near P2 at t = T/2 (eq. (6), p.13;
#     system IV, formula (19) of Bruno & Varin 2008). Table 1 prints its mu -> 0 limit.
# Misprints found (printed values kept; see each table's notes): Table 1 row 7 C; Table 1 row 14 a~(T/2);
#   Table 5 row 1 and row 5 T_norm.
# mu for Table 2: the table heading says mu = mu_J; the section heading (p.13) says "THE SUN-JUPITER CASE
#   (mu = 0.00095388)", but the text says "all of the calculations are performed for mu = mu_J def 0.00095
#   on technical grounds", and the abstract says mu = 10^-3. All three are recorded. Our checks show the tables were computed at mu = 0.00095.
table_1:
  caption: "Table 1. Critical orbits of family h for mu = 0"
  page: "p.3"
  mu: 0.0
  period_convention: T_over_2pi   # printed T~ (header "T/2pi"); identical to (1-mu)T/(2 pi) at mu = 0
  n_orbits: 16
  notes:
    - "Row 7 C: printed \"-1.787103\". MISPRINT. The row's own (x1, y2) give -1.78508, its P2 entry velocity gives 3 - V^2 = -1.785106, its (a~, e~)(0) give -1.785099, and KIAM 34/2007 and JAMM 71:933 Table 1 both print -1.785103. Correct value -1.785103."
    - "Row 14 a~(T/2): printed \"5.88769\". Not consistent with the row's own e~(T/2) = -1.82987: |a~| = 1/|2 - |e~|| gives 5.87786 (rounding range 5.87769-5.87803); KIAM 34/2007 and JAMM print 5.877. Probable misprint for about 5.8779."
    - "Row 7 a~(T/2) 51.56234 is consistent with its e~(T/2) (range 51.5597-51.5863). KIAM 34/2007 and JAMM print 51.553, which is just outside that range."
    - "The T/2 columns follow one rule (our check, not stated in the paper): at T/2 the orbit is at P2; if v1 = 0 then y2(T/2) = v2 + 1; if v1 != 0 the mu -> 0 limit is a perpendicular crossing at the pericentre of the P2 flyby, w1(T/2) = V^2 v1/(V - |v1|) and y2(T/2) = 1 + sgn(v2) sqrt(V^2 + 2|w1|); then e~ = y2|y2| and |a~| = 1/|2 - |e~||. Every printed w1(T/2) and e~(T/2) is reproduced. a~(T/2) is printed positive even where |e~| > 2."
    - "Header \"T/2pi\". Rows 5 and 12 have v1, v2, a~(T/2), e~(T/2) and w1(T/2) blank (collision with P1). KIAM 34/2007 prints 1.587 / +-2 there, and \"-+inf\" where this table prints \"±∞\"."
    - "C here is the mu = 0 value -2H (no mu shift arises)."
