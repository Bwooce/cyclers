conventions:   # reconciled 2026-10-07 (#971 papercut docs/papercuts/2026-10-07-corpus-review2-fable-bruno-varin-period-convention.md)
  period_field: T_over_2pi   # in ALL five Bruno-Varin yamls, T_over_2pi = T/(2 pi), T the full period in the units of eq. (1)
  period_source_definition: "small-mu paper p.6: 'T~ def T/(2 pi)' (Table 1 heads its column 'T/2pi'); but the printed Tables 2, 4, 5 use (1 - mu) T/(2 pi), the KIAM 67/2005 definition (integration-checked)"
  jacobi: "printed C = barycentric Jacobi constant + mu(1 - mu) (Bruno's -2H with the +mu shift); subtract mu(1 - mu) for the usual barycentric value"
  notes:
    - "Rows changed 2026-10-07: Table 1 key T_norm renamed to T_over_2pi (16 rows, values unchanged, mu = 0). Tables 2, 4, 5: key T_norm renamed T_norm_printed (values unchanged) and a DERIVED T_over_2pi added on every row (35, 28, 27 rows)."
    - "Derived values carry the printed misprints through (Table 5 rows 1 and 5; see the table notes). Filer check: mu = 0.1 Table 4 row 1 first returns to the x-axis at t/pi = 0.40270 = T_over_2pi."
