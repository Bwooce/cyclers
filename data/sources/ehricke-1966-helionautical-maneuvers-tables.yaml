# Ehricke 1966, "Interplanetary Maneuvers in Manned Helionautical Missions": Table 1, the Fig. 3 reference-mission labels, and the text numbers.
# Source: K. A. Ehricke (General Dynamics/Convair), chapter in "Methods in Astrodynamics and Celestial Mechanics", Progress in Astronautics and Aeronautics
#   (R. L. Duncombe and V. G. Szebehely, eds.), AIAA, 1966, pp. 325-352, doi 10.2514/5.9781600864919.0325.0352 (Crossref 2026-10-11: type book-chapter, issued 1966,
#   pages 325-352; book doi 10.2514/4.864919). Presented as AIAA/ION Preprint 65-695, Monterey, 16-17 September 1965.
# Local file: AIAA ARC download, 30 pp. (pp.29-30 blank), iText, text layer present, md5 7a623a631a5259b69fc26eae0f9406eb. PDF page n = journal page n + 324.
# Witnesses: A = the text layer (pdftotext, read as a column dump); B = a 120 dpi render of PDF p.10 (journal p.334) read once, all cells; C = two 220 dpi half-page
#   crops of the same page read a second time. Table 1: A, B, C agree on every cell except where A has OCR damage (listed under `text_layer_damage`).
#   Fig. 3 labels: render at 110 dpi and two 300 dpi half crops (two reads); no text layer for them.
# Nothing here was computed by us except in `check:` fields.
table_1:
