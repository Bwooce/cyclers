    4: "Delta T, extension of the flight time, d"
    5: "Delta beta, change in path angle, deg"
    6: "Delta i', change in inclination, deg"
    7: "eta_PBEa, post-PB transfer angle, deg"
    8: "R_P, perihelion distance of the mono-elliptic transfer path, AU"
    9: "R_PB, distance of the PB maneuver, AU"
    10: "R_P', perihelion distance of the post-PB orbit, AU"
    11: "eta_O,PB, anomaly prior to PB, deg (the footnote says 'time anomaly', a slip for true anomaly)"
    12: "eta_O,PB (second occurrence of the same symbol), true anomaly following PB, deg"
    13: "eta_Ea, anomaly at Earth encounter without PB, deg"
    14: "eta_EaPB, as column 13, with PB, deg"
