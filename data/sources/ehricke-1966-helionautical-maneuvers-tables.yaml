  text_layer_damage: "the text layer garbles several cells (for example 51.9 as '5L9', 35.4 as '35.^', and the minus sign of one 1988 inclination entry); the render decides. Every cell above is from the render and agrees across the two reads."
  checks:
    - "T_MaPB = T2 - 50 d in all 9 rows (COMPUTED): 220-50=170, 230-50=180, 240-50=190, 210-50=160, 200-50=150 (1982 and 1986), 210-50=160, 240-50=190 (1988 and 1991)."
    - "eta_EaPB - eta_PBEa = eta_after (COMPUTED): the post-PB arc angle (col 7) plus the true anomaly following PB (col 12) gives the true anomaly at Earth encounter with PB (col 14). It holds exactly (to the printed digit) in 11 of 18 rows and within 0.2 deg in all 18 (largest differences 0.2 deg in the 9-27-84 and 12-5-88 dT = 50 rows). Example 1974, dT = 30: 158.7 - 117.2 = 41.5. A small rounding or typesetting scatter in the original, not a transcription error: the render shows each cell as transcribed."
fig_3:
  caption: "Mono-elliptic Mars round trip mission velocity profile, 1973 through 1990 (Ea dep r* = 1.1, n = 1; Ma capture r* = 1.3, n = 1; bars: 1 = Delta v1, 2 = Delta v2, 3 = Delta v3, 4 = v_E, in 10^3 fps; labels: T1 + T_cpt + T2 = mission period, days; calendar date of Earth departure = Julian date minus 2440000)"
  journal_page: 345
  groups:
    - {group_year: 1973, earth_departure: "8-16", jd_minus_2440000: "1910.5", periods: "180 + 30 + 220 = 430"}
    - {group_year: 1975, earth_departure: "10-5", jd_minus_2440000: "2691.5", periods: "160 + 30 + 230 = 420"}
    - {group_year: 1977, earth_departure: "10-20", jd_minus_2440000: "3436.5", periods: "180 + 30 + 240 = 450"}
    - {group_year: 1979, earth_departure: "11-25", jd_minus_2440000: "4202.5", periods: "200 + 30 + 210 = 440"}
    - {group_year: 1982, earth_departure: "1-2", jd_minus_2440000: "4971.5", periods: "200 + 50 + 200 = 450"}
    - {group_year: 1984, earth_departure: "2-10", jd_minus_2440000: "(none printed on this group)", periods: "180 + 50 + 210 = 440"}
    - {group_year: 1986, earth_departure: "3-31", jd_minus_2440000: "5740.5", periods: "160 + 50 + 240 = 450"}
    - {group_year: 1988, earth_departure: "5-9", jd_minus_2440000: "7290.5", periods: "160 + 50 + 240 = 450"}
    - {group_year: 1990, earth_departure: "7-28", jd_minus_2440000: "8100.5", periods: "160 + 50 + 240 = 450"}
  checks:
    - "Each group's Earth departure + T1 + T_cpt equals the Mars departure date of Table 1 for the same mission in all 9 groups (COMPUTED): 8-16-73 + 210 d = 3-14-74; 10-5-75 + 190 = 4-12-76; 10-20-77 + 210 = 5-18-78; 11-25-79 + 230 = 7-12-80; 1-2-82 + 250 = 9-9-82; 2-10-84 + 230 = 9-27-84; 3-31-86 + 210 = 10-27-86; 5-9-88 + 210 = 12-5-88; 7-28-90 + 210 = 2-23-91."
    - "The third term of each mission-period label equals T2 of Table 1, except 1986: the figure has the mono-elliptic reference T2 = 240 d while Table 1 has 200 d for the PB case, as the text (p.332-333) says (the 1986 PB case uses T2 = 220 or 200 d)."
    - "JULIAN DATES, printed against calendar dates (COMPUTED): JD 2441910.5 = 1973-08-16 (agrees); 2443436.5 = 1977-10-20 (agrees); 2444202.5 = 1979-11-25 (agrees); 2444971.5 = 1982-01-02 (agrees); 2447290.5 = 1988-05-09 (agrees); 2448100.5 = 1990-07-28 (agrees); 2442691.5 = 1975-10-06, printed against 10-5 (one day off); 2445740.5 = 1984-02-10, but printed on the 1986 group whose date is 3-31-86 (JD 2446520.5). So the 5740.5 label belongs to the 1984 group (2-10), and the 1986 group's printed JD is a figure error."
  bar_heights: "not read to a stated precision; the four bars of each group run from about 7 to about 72 thousand fps (v_E about 60 to 72 in 1973-1979, about 51 to 63 in 1982-1990); see the digest."
text_numbers:
  - {page: 331, item: "reference-mission capture orbit", value: "n = 1 and r* = 1.3 (Mars); Earth departure r* = 1.1, n = 1 (Fig. 3)"}
  - {page: "331-332", item: "reference missions designed for solid-core-reactor and chemical vehicles returning to Earth at no more than 50,000 fps (15.3 km/s)", value: "dates 1973 to 1990"}
  - {page: 332, item: "highest PB exchange ratio condition", value: "PB at T2 - 50 d, flight time extended by 30 to 50 d, so PB-to-Earth time 80 to 100 d"}
  - {page: 332, item: "1986 mission Mars departure maneuver if T2 = 200 d", value: "Delta v0 = 22,810 fps (the reason T2 = 220 d is chosen)"}
  - {page: 333, item: "PB delta-V range 1974-1991", value: "between 11,000 and 15,000 fps, against 13,000 to 29,000 fps for a geocentric retromaneuver to the same entry speed; entry speed reduced to between 50,000 and 40,000 fps"}
  - {page: 328, item: "exchange ratios", value: "perihelion brake 1.5 to over 2; heliocentric retro or acceleration 1 to about 1.6 (35 to 65 deg from an apsis); planet approach less than 1 to about 1.2"}
  - {page: 329, item: "typical return perihelion distance", value: "<= 0.65 AU"}
  - {page: 335, item: "HEAR exchange-ratio examples", value: "17,500/23,600 = 0.74 (initiated 10 d before arrival, 20 d in the entry module) and 15,800/20,700 = 0.86 (initiated on day 180, 40 d)"}
  - {page: 339, item: "entry velocity target", value: "44,000 fps (1.5 times the kinetic energy per unit mass of the Apollo mission); elliptic capture case 35,000 fps"}
  - {page: "339-340", item: "payloads by maneuver (atmospheric-entry missions)", value: "Ea Dep 150,000 lb; Ma Ar 110,000; Ma Dep 70,000; PB 25,000; GEAR 16,000 (HEAR 16,500); capture-orbit missions GEAR/PB: 155,000/165,000; 115,000/125,000; 75,000/85,000; PB 35,000; Ea Ar 25,000/25,000"}
  - {page: 340, item: "specific impulses", value: "C 450 s; S (solar heat exchange) 700 s; G (graphite solid-core) 800 s; NERVA II 250,000 lb thrust; nuclear pulse for Jupiter missions"}
  - {page: 341, item: "HEAR versus PB, 1980 to 1986", value: "equal weight reduction only if HEAR is 30 d before arrival, extending the flight 9 to 25 d; 55 d in the entry module in 1980"}
equations:
  - {eq: 1, text: "da/dV = (R_P/2) [V/(K/R_P)] (n+1)^2", page: 329, check: "equals 2 a^2 V / K with a = R_P (n+1)/2 (COMPUTED); at eta = 0, R_P = 0.4 AU: n = 3 gives 1.25e7 s and n = 9 gives 8.5e7 s, agreeing with the Fig. 2 left-panel curves read at 75 dpi (about 1.2 and 8.5, units 10^7 s)"}
  - {eq: 2, text: "dR_A/dV = R_P (n+1) [ 2V/(K/R_P) + 2/(V (e + cos eta)) ]", page: 330, check: "NOT reproduced by derivation: with R_A = a(1+e) and Eqs. 1 and 3 the derivative is R_P (n+1) [ n V/(K/R_P) + (e + cos eta)/V ]; at eta = 0 this equals R_P (n+1)^2 V/(K/R_P) = 4 a^2 V/K, the exact tangential-impulse change of aphelion distance at perihelion (R_P fixed). The printed form gives 1.80e7, 3.12e7 and 4.46e7 s for n = 3, 6, 9 (R_P = 0.4 AU, eta = 0) against 2.49e7, 8.15e7 and 1.70e8 s from the derivation. Fig. 2 middle panel read at 75 dpi (approximate): about 25, 45 and 68 (units 10^6 s) at eta = 0; those are 1.4, 1.45 and 1.5 times the printed-form values, nearly constant, and 1.0, 0.55 and 0.40 times the derived values. So the plotted curves look closer to the printed form up to an unexplained near-constant factor; the printed Eq. 2 and Fig. 2 middle panel are both unreliable for use as a control. Unresolved."}
  - {eq: 3, text: "de/dV = 2 (e + cos eta)/V", page: 330, check: "equals the Gauss variational equation for tangential acceleration (COMPUTED by derivation)"}
  - {note: "text-layer renderings of Eqs. 1 to 3 are garbled; the printed forms above were read on 120 dpi crops of pp.329 and 330"}
