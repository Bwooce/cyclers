# Wagner 1968, "The Restricted Problem of Three Bodies (III)", NASA Technical Report No. 4, Grant NsG 280-63, Department of Physics,
# University of Illinois, Urbana, 1 June 1968 (NASA CR-95832, NTRS 19680020622). 24 PDF pages: cover (p.1), text pp.1-9 (PDF 2-10), references (PDF 12),
# figure captions (PDF 13-14), Figs. 1-8 (PDF 15-22), "Final Report NsG 280-63" (PDF 23-24).
# The report has NO tables. The numbers are in the text and in the figures. A table of initial and final conditions of 14 limiting orbits is in Bartlett 1964
# (part I, not held) and is only cited here.
# Local file: 24 pp. scan with a poor letter-spaced text layer; the filed copy is an ocrmypdf --redo-ocr -l eng copy, md5 03d6971426be365891d095cbb7d8b004
# (4,321,069 bytes) of the received scan, md5 67aa8032872efc31697b079587e91cc9 (4,384,626 bytes).
# Witnesses: A = the OCR text layer of the filed copy; B = the page images (90 dpi) read by eye for pp.2-10 and the reference and figure pages. A and B agree on all
# numbers below (25 values compared after dropping whitespace), and the constants have an arithmetic witness C (ours, in `check:`). Figure shapes are not transcribed.
# All values in `check:` fields are ours.
setting:
  - {item: "variables", value: "Thiele (regularised) coordinates (E, F); axis of symmetry the E or F axis; eta- and xi-axes of the inertial-barycentric rotating frame", page: 2}
  - {item: "mass ratio parameter", value: "gamma = (m1 - m2) / (m1 + m2); gamma = 0 equal masses", page: 2}
  - {item: "critical mass ratio", value: "gamma_0 = sqrt(23/27) = 0.922958; spiral motion near L4 for -gamma_0 < gamma < gamma_0, closed ellipses for gamma_0 <= |gamma| <= 1", page: 2,
     check: "sqrt(23/27) = 0.9229582. In mu = m2 / (m1 + m2) terms mu = (1 - gamma) / 2, so gamma_0 corresponds to mu = 0.0385209, the Routh value (1 - sqrt(1 - 4/27)) / 2."}
  - {item: "L4 in Thiele coordinates", value: "E = -pi/2, F = sinh^-1(sqrt 3) = 1.316958", page: 2, check: "asinh(sqrt 3) = 1.3169579"}
  - {item: "energy parameter", value: "T = K - gamma^2, K the Jacobi constant; at L4 K = 11 + gamma^2 so T = 11 for every gamma (all periodic-asymptotic limiting orbits lie on the T = 11 line)", page: 3-4}
  - {item: "slope of the outgoing spiral at E = -pi/2", value: "dF/dE = p - beta (p theta + 5/4) / (theta^2 + 4 q^2); theta = 2p + beta, beta^2 = 27 gamma^2 / 16, p^2 - q^2 = -1/2, 4 p q = sqrt((27/4)(1 - gamma^2) - 1)", page: 3,
     note: "read from the page image; the text layer garbles the formula"}
