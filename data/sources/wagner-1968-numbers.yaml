  - {item: "Stromgren's second eta-axis limiting orbit", value: "eta_0 = 1.7008 at gamma = 0 (T = 11, small, encircles L1 then spirals into L4; its mirror image about the xi-axis spirals into L5, Fig. 4 orbit 1)", page: 7}
  - {item: "Stromgren's first eta-axis limiting orbit", value: "eta_0 about 1.72025 at gamma = 0 (crosses the xi-axis outside the masses, turns to strike the eta-axis well above L4)", page: 8}
  - {item: "extreme orbits of the simple class (Fig. 4)", value: "number 2 at T = 11.00; number 3 at T = 9.486659 (very near the minimum)", page: 7}
