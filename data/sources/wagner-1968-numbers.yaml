  - {item: "orbits followed as functions of gamma (Fig. 1)", value: "10 of the 14 (the caption says 11)", page: 4, note: "text p.4 says 10 of the 14; Fig. 1 caption says 11 orbits; the figure is not counted here"}
  - {item: "F_i spread at gamma = 0", value: "band of width about 0.015", page: 4}
  - {item: "range scanned", value: "not much beyond |gamma| = 0.85 (accuracy difficulties)", page: 4}
  - {item: "limiting orbits I and II merge", value: "gamma about -0.059", page: 5, check: "also the closing of classes (k) and (mu); the paper says both begin and end only on orbits I and II"}
  - {item: "limiting orbits III and IV merge", value: "E about 0.75 at gamma about -0.24", page: 5, check: "closing of class (beta); the outermost member of the nested closed set for (beta) vanishes at gamma about -0.83"}
  - {item: "orbits VIII and its conjugate VIII*", value: "merge at E about -2.27 at gamma about -0.70; below this the (g) class still exists with other termination properties", page: 6}
  - {item: "orbits XI and XIV merge", value: "F about -0.35 at gamma about -0.582", page: 6, check: "class (alpha-delta) affected; touches the zero-velocity surface afterwards"}
  - {item: "orbits V and VI", value: "span almost the whole gamma range, no conjugate partner down to gamma = -0.85", page: 6}
