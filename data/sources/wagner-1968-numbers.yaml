final_report_page:   # PDF pp.23-24, signed off as the grant final report
  - "Technical Reports Nos. 1, 2 and 4: periodic solutions of the restricted 3-body problem; No. 3: stability of periodic solutions (a sequel to work published in the Communications of the Danish Academy)."
  - "No. 1 (also Mat. Fys. Skr. Dan. Vid. Selsk. 2, 7 (1964)): most of the important classes of periodic solutions for equal masses. No. 2 (also Mat. Fys. Skr. 3, 1 (1965), co-author C. A. Wagner): extended to unequal masses over most of the allowed range. No. 4: how some limiting asymptotic orbits vary with mass ratio."
  - "Motion under a periodic cubic force: periodic solutions located (Mat. Fys. Medd. Dan. Vid. Selsk. 36, 11 (1968)); with C. A. Wagner, detailed in Technical Report No. 3, intended to be recast as a journal article."
  - "The grant was terminated on 31 August 1967 after two extensions; C. A. Wagner was the chief assistant."
