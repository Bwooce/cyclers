# Gobetz & Doll 1968, Tables I-III and the quoted critical constants of "A Survey of Impulsive Trajectories".
# Source: F. W. Gobetz and J. R. Doll, "A Survey of Impulsive Trajectories", United Aircraft Research
#   Laboratories (East Hartford, Connecticut) Report G-910557-11, final report under NASA contract
#   NAS8-21091, June 1968, 124 pp., NTRS 19680026430. Journal form: AIAA Journal 7(5):801-834 (May 1969),
#   DOI 10.2514/3.5231 (Crossref-confirmed 2026-10-11; the journal form is not held).
# Local scan: NTRS scan, md5 dbac4cc329400964d64f6a8f8c71904c, 129 PDF pages. Report page numbers below are
#   the printed numbers (PDF page = printed page + 5 for the body).
# Transcribed with three witnesses: (1) the NTRS text layer (letter-spaced, many misreads), (2) a fresh
#   ocrmypdf/tesseract layer, (3) the page render read by eye (110 dpi; Table II also at 250 dpi).
#   Where witnesses disagreed the render decided; the disagreements are listed in the digest, sec. 6.
#   No value in this file was computed by us.
# These are survey tables about planet-centred orbit transfers. None of them is a cycler or a swingby
#   number. They are filed for completeness under the corpus policy.

