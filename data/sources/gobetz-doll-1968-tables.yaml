critical_constants_quoted_in_text:
  note: "Numbers printed in the running text (not in tables). Each was read in the text layer and on the render; the report's own wording is kept."
  items:
    - {value: "11.93876", where: "p.24 (circle-to-circle: bi-parabolic transfer beats Hohmann above this radius ratio); also quoted as 11.938 on pp.32-35", meaning: "radius ratio above which transfer through infinity beats Hohmann"}
    - {value: "15.58172", where: "p.25 (and 15.582 on p.55)", meaning: "radius ratio above which a bi-elliptic transfer always beats Hohmann for conjunction ratio greater than 1"}
    - {value: "0.08376", where: "p.26", meaning: "inverse of 11.93876, as printed: r1/r2 less than this gives transfer through infinity for any inclination"}
    - {value: "60.185 deg", where: "pp.26-27, 34", meaning: "inclination above which transfer through infinity is optimal for all radius ratios"}
    - {value: "r1/r2 = 0.1505, di = 37.54 deg", where: "p.27", meaning: "single point at which all three noncoplanar circle-to-circle modes give equal delta-V"}
    - {value: "0.53533", where: "p.36", meaning: "eccentricity below which the symmetric two-impulse solution is always optimal between congruent coplanar ellipses"}
    - {value: "70.529 deg", where: "p.45", meaning: "optimum transfer angle for two-impulse ascent with r1 = r2"}
    - {value: "0.001615 lambda^2 Vc", where: "p.66", meaning: "second-order delta-V penalty for finite-thrust escape from a circular orbit with optimal thrust-angle program (Lawden, ref 163); lambda = 1/a with a the constant thrust acceleration, as printed (read on the render; the text layers dropped the superscript)"}
