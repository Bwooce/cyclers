# Petropoulos, Longuski and Bonfiglio 2000, Tables 1 to 6 (gravity-assist trajectories to Jupiter via Venus, Earth and Mars).
# Source: A. E. Petropoulos, J. M. Longuski, E. P. Bonfiglio, "Trajectories to Jupiter via Gravity Assists from Venus, Earth,
#   and Mars", Journal of Spacecraft and Rockets 37(6):776-783 (November-December 2000), doi 10.2514/2.3650. Presented as AIAA
#   Paper 98-4284 (Boston, 10-12 August 1998); received 19 August 1999, revised 1 March 2000, accepted 13 March 2000.
# Local file: 8 pp., text layer (AIAA web copy stamped "Downloaded by University of Washington on February 6, 2015"), md5
#   7d3f306548b76524db368e915299d120 (private corpus, papers/ directory). Journal pages 776-783 = PDF pages 1-8.
# Tables: 1 p.777 (PDF p.2); 2 and 3 p.779 (PDF p.4); 4 p.780 (PDF p.5); 5 p.781 (PDF p.6); 6 p.782 (PDF p.7).
# Witnesses: A = pdftotext -layout; B = pdftotext -raw; C = the PDF pages rendered at 130 dpi and read row by row.
#   A and B were parsed by one script (all rows of Tables 3 to 6, and all 39 entries of Table 2) and agree exactly: 151 rows
#   in Tables 3 to 6 (30 + 44 + 42 + 35) and 39 entries in Table 2. C agrees with every row and every cell.
#   The text layer prints infinity as "1" (V1 = V-infinity) and the minus sign as the glyph U+00A1; both were read as V-infinity
#   and minus on the page render (for example "-964 (1)" and "-266, -604 (1, 3)"). Spaces after commas and before the
#   parenthesis are dropped here; no digit was changed.
# No value here was computed by us. Numbers and the "r" resonance flag are kept as printed (strings).
conventions:
  date: "YY-MM-DD as printed. Years 99 is 1999 and 00 to 31 are 2000 to 2031 (launch period 1 January 1999 to 31 December 2031). Table 3 dates are for the best case of each path."
  path_letters: "V Venus, E Earth, M Mars, launch from Earth first (the leading letter is the first flyby body, Earth launch is implicit); the last letter is the last flyby before Jupiter. Table 2 and Fig. 3 use the same letters, with Jupiter appended as the destination in the PATH label of the figures (3 = Earth, 2 = Venus, 4 = Mars, 5 = Jupiter; for example PATH 3 2 3 3 5 is a VEEGA)."
  columns: "launch_vinf = launch V-infinity (km/s); alt_or_dv = flyby altitude below 200 km (signed, plus or minus) or deep-space DeltaV (km/s, unsigned), parenthetical numbers are the flyby numbers (0 = Earth launch); arr_vinf = arrival V-infinity at Jupiter (km/s); tof_yr = time of flight (years); flyby_days = days after launch of each flyby, r = resonance on that leg"
  resonance: "Sequential encounters of the same body are resonant if the time between them is an integer multiple of the body's orbital period (paper, Results section)."
  tables_3_to_5: "unoptimized STOUR (patched-conic) results, launch date increment 5 days, launch V-infinity increment typically 0.25 km/s (VEEGAs) or 0.5 km/s (V3), 1 km/s for some paths"
  table_6: "DeltaV-optimized with MIDAS (minimum of launch DeltaV plus deep-space DeltaV)"
tables:
  - table: "1"
    caption: "Legend for launch-date plots"
    journal_page: "777"
    kind: "text legend (variable, description), not numeric"
    rows:
      - {variable: "PATH", description: "Planets encountered, including launch and destination bodies, e.g., PATH: 3 2 3 3 5 is a VEEGA from Earth to Jupiter. Maneuvers represented by 0."}
      - {variable: "VINF", description: "Launch V-infinity. Without maneuvers present, the numerals 1, 2, 3, 4, ... on the plot represent the 1st, 2nd, 3rd, 4th, ... V-infinity in the VINF list above the plot. For example, in Fig. 1 the numeral 3 on the plot denotes a V-infinity of 3.50 km/s. With maneuvers, only one launch V-infinity is shown, as in Fig. 2, where a 1 represents a DeltaV between 0 and 1 km/s, a 2 represents 1-2 km/s, etc."}
      - {variable: "SEARCH EVENT NO.", description: "Event in PATH for which data are plotted. For example, in Fig. 2, TOF to Jupiter is plotted because encounter with Jupiter is the 8th event in the PATH."}
      - {variable: "ALTMIN", description: "Minimum flyby altitude permitted in the STOUR run."}
      - {variable: "SEARCH MIN. ALT.", description: "Trajectories with flyby altitudes below this value are not included in the plot."}
      - {variable: "LAUNCH DATES SEARCHED", description: "Launch-date range (YY/MM/DD) used in the STOUR run. For example, 99/1/1 means 1 Jan. 1999. The launch-date increment is also given, e.g., by 5.0 days."}
      - {variable: "TFMAX", description: "Maximum allowable time of flight in the STOUR run."}
  - table: "2"
    caption: "Rank order of paths to Jupiter based on GAP analysis"
    journal_page: "779"
    columns: [rank, path, min_launch_vinf_kms]
    note: "Minimum launch V-infinity required (footnote a). 39 paths reach Jupiter in the GAP (gravity assist potential) analysis: circular coplanar planetary orbits, tangential Earth launch, no overturning, flyby altitude down to 200 km, phasing ignored. The direct-launch minimum to Jupiter is 8.79 km/s (text)."
