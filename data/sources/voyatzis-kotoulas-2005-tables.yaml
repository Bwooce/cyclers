# Voyatzis & Kotoulas 2005, Table 1: bifurcation points (BPs) of the circular problem that start families of the
#   planar ELLIPTIC restricted problem, Sun-Neptune.
# Source: G. Voyatzis and T. Kotoulas, "Planar periodic orbits in exterior resonances with Neptune",
#   Planetary and Space Science 53(11):1189-1199 (2005), doi 10.1016/j.pss.2005.05.001 (Crossref-checked).
#   Table 1 is on p.1195.
# Local file: 39a3b1ac-voyatzis2005.pdf, 11 pp., md5 4bb4af5446c24d3569a9e6221182967a (publisher PDF, text layer).
# Transcribed from the page image (PDF p.7, 200 dpi, zoomed). The text layer agreed with the image in every cell.
#   No value here was computed by us. Our computed values appear only in `note:` fields, marked "ours".
#   The printed em dash (no BP) is kept as "-". Numbers as printed (strings).
#
# WHAT THIS TABLE IS, AND IS NOT
#   It is NOT a table of initial conditions. Each cell gives e0 (the initial eccentricity of the small body) with a
#   two-letter stability code, and below it h (the Jacobi constant, eq. (2)) in brackets. The paper prints no x0 or
#   ydot0 for any orbit, and no number at all for the closed family I_6/7 + II_7/8 + II^u_7/8 (Fig. 1 only).
#   Caption (image): "We present the corresponding initial eccentricity value e0 and the Jacobi constant h in
#   brackets. The symbol "S" or "U" denotes the stability character of the periodic orbits close to the bifurcation
#   point." Text p.1195: "The first symbol refers to family E^{p/q}_{lp} and the second one to family E^{p/q}_{la}."
#   BP0 lies on the circular family C (e0 = 0). For first-order resonances all BPs lie on family II (p.1195). For
#   5/7 and 7/9, BP1 and BP3 lie on II, BP2 and BP4 on I (p.1196). For 4/7, 5/8, 7/10, BP1-BP3 lie on II (p.1197).
#   For 3/5, BP1 lies on II, BP2 on a stable segment of I (p.1196).
#
# FRAME (p.1190-1191, eqs. (1)-(2), image-checked)
#   Planar circular restricted problem, rotating frame Oxy with origin at the barycentre O. Sun (mass 1 - mu) at
#   x = -mu, Neptune (mass mu) at x = 1 - mu (eq. (1) r1, r2 at r = 1; Fig. 5 caption). G = 1, a' = 1, T' = 2 pi.
#   mu = 5.178e-5 (p.1191, image).
#   Symmetric orbits start at x(0) = x0, y(0) = 0, xdot(0) = 0, ydot(0) = ydot0 (p.1191).
#
# Checks: check_vk2005_table1.py -> check_vk2005_table1.out (our integration; see the digest sec. 3).
