conventions:
  period_field: none   # the table prints no period; the period is fixed by the definition of a BP
  period_source_definition: >-
    p.1191: in the elliptic case the periodic orbits "are isolated points in the plane x0 - ydot0 for a particular
    value of e' and their period is T = 2k pi, k = 1, 2, ...". p.1195: the resonant orbits of the circular problem
    "are bifurcation points (BPs) ... for the elliptic problem (e' != 0) when their period is a multiple of
    T' = 2 pi". p.1196 (BP0): circular orbits on family C "where the period is T = q pi ... are continued for
    e' != 0, providing periodic orbits of period T = 2 q pi". Our checks use T = 2 q pi for every row (ours).
  jacobi: >-
    h of eq. (2): h = (xdot^2 + ydot^2 - (x^2 + y^2))/2 - (1 - mu)/r1 - mu/r2, barycentric frame. h = -C/2 for the
    usual barycentric Jacobi constant C = x^2 + y^2 + 2(1 - mu)/r1 + 2 mu/r2 - v^2.
  e0: >-
    p.1196: "e0 = e(0) is the eccentricity value of the orbit that corresponds to the initial conditions of the
    periodic orbit". The paper does not say whether the osculating orbit is Sun-centred or barycentric, or which
    GM it uses. Our checks use Sun-centred with GM = 1 - mu (the choice changes e0 by about 1e-5).
  stability_code: >-
    Two letters, S (stable) or U (unstable), for the orbits close to the BP. First letter: family E^{p/q}_{lp}
    (Neptune initially at perihelion); second: E^{p/q}_{la} (Neptune initially at aphelion) (p.1195).
  notes:
    - "Two-letter cells are printed with a space (e.g. '0.469 SU'); split here into e0 and stab."
    - "BP1 of 4/7, 5/8, 7/10 has e0 = 0.027, 0.029, 0.025 and the same printed h as BP0: near-circular orbits next to the circular family."
