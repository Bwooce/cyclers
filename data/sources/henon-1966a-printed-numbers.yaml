equations_without_numbers_note: >-
  Eqs. (1)-(10) (pp.58-75) carry no fitted or tabulated numbers; they are typeset in the English translation. Eq. (8)
  was checked against (4)-(7) by us (both rows reproduce (4) with sin^2 alpha0 = -bc). Eq. (9): r^3 cos 3(theta - theta0)
  = const (alpha0 = 2pi/3). Eq. (10): r^4 [1 + p cos 4(theta - theta0)] = const (alpha0 = 2pi/4; stable if |p| < 1).
