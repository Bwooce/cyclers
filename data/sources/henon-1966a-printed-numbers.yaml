# Henon 1966a (paper III), the printed numbers of the paper. THE PAPER HAS NO NUMERIC TABLES: it prints 10 equations,
#   21 figures and the numbers below, in the running text and in figure labels and captions.
# Source: M. Henon, "Exploration numerique du probleme restreint. III. Masses egales, orbites non periodiques",
#   Bulletin Astronomique (3e serie) 1, fasc. 1, pp. 57-79 (1966), doi 10.3406/bastr.1966.14442. Manuscript received
#   29 November 1965. In French, with English, German and Russian abstracts.
# Local file: Persee scan, 25 pp. (2 Persee cover pages + journal pp. 57-79), md5 d0922998ce5c30787f350ad413ccfe0b.
#   PDF page n = journal page n + 54. OCR copy: ocrmypdf --force-ocr -l fra+eng.
# Witnesses (every value below): A = tesseract 5 -l fra --psm 6 on 300 dpi grey renders; B = macOS Vision
#   (VNRecognizeTextRequest, .accurate, no language correction) on the same renders; O = the text layer of the ocrmypdf
#   copy (a third machine reading, at the scan's own resolution); C = our reading of 300 dpi crops of the page image
#   (decides). Every occurrence of every value below was read by C on a 300 dpi crop (crops located from tesseract word
#   boxes); the printed values are C's reading. Per-value occurrence counts of A, B and O:
#   cyclers_pdf/papers/henon-1966a-...-witness.out. The machine counts differ from each other for: p.58 3,4568 (A=0 B=0 O=1);
#   p.61 4.5/4,5 and p.71 3.5 (O=1, A=B=2; the counter normalises "." to "," so a label is counted under both spellings);
#   p.65 4,5 (A=0); p.74 2,85 (A=0 O=0 B=2); p.75 1,5183 (B=1), 1,55 (B=1, O=1), 2,5 (B=2); p.76 1,23 (O=1);
#   p.78 1,2175, 0,9556, 1,135 (B=0), 1,0594 (A=4 B=2 O=3), 1,07 (B=2), 0,97 (A=1). Each difference is a dropped,
#   merged or double-counted line; we did not check every machine reading digit by digit, so the counts are a
#   locator, and C decides. Decimal commas are written as points; "..." is printed.
# No value here was computed by us. Values we computed are only in `check:` fields, marked "ours"; the script and its
#   output are cyclers_pdf/papers/henon-1966a-...-check_henon1966a.py and .out.
#
# CONVENTIONS (eq. 2, p.59): mu = 1/2. M1 at x = -mu, M2 at x = 1 - mu, unit separation, unit angular rate.
#   C = x^2 + y^2 + 2(1-mu)/r1 + 2mu/r2 - xdot^2 - ydot^2. There is no mu(1-mu) term, so C_Henon = C_std - 0.25.
#   Section (eq. 1): y = 0, ydot > 0; points plotted in the plane (x, xdot) at fixed C.
#   Stability index a = cos(alpha0) (eq. 7), alpha0 = rotation angle at the periodic orbit; a is paper II's index
#   (half the trace of the 2x2 section map; for the 4x4 monodromy, a = (trace - 2)/2).
# CLASSES: f, h = retrograde about M2, M1; g, i = direct about M2, M1 (p.59). alpha_4 = Bartlett's "class alpha"
#   (4-periodic), named alpha_4 here (p.77). i_3 = the 3-periodic class of paper I Fig. 3. n'_2, b_2 = double-periodic
#   classes of paper II.
# ORBIT TYPES named (p.57): quasi-periodic (on invariant curves), semi-ergodic (filling an area of the section but not
#   all of the accessible region), escape (C < 3.4568..., leaves to x -> -infinity).
# MISPRINTS in the original (see the digest): captions of Figs. 12 and 13 interchanged (pp.72-73); p.75 "point n" for
#   "point h"; p.57 resume "demi-ergodiques" for "semi-ergodiques"; Fig. 16 x labels lack minus signs.

paper_ii_cross_check_note: >-
  The critical-orbit C values quoted here are paper II's 4-digit values. Henon 1973 (A&A 28:415, Table 1, held, six
  digits) gives the same orbits as: i1 3.738962, i14 3.566406, i15 3.445853, h1 1.216891, h2 1.059408, h3 0.955552,
  b_2 7 1.133574, b_2 8 1.059408. Paper III's i15 (3.4473), h1 (1.2175) and b_2 7 (1.135) differ from the 1973 values
  by 1.4e-3, 6.1e-4 and 1.4e-3; the others agree to the printed digits. Our integration gives h1 at C = 1.216891
  (a = -1), equal to Henon 1973 to six digits, so the 1973 values supersede the 1965-66 ones.

