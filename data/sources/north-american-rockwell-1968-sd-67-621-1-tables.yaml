# North American Rockwell Space Division, "Technological Requirements Common to Manned Planetary Missions,
#   Technical Summary", Report SD 67-621-1, contract NAS2-3918, January 1968 (NTRS 19680009382), 120 PDF pages.
#   Prepared by R. D. Meston (Project Engineer); approved by A. Codik (Project Manager). This is volume 1 of 5
#   (appendices SD 67-621-2 to -5 are not held).
# Local scan: NTRS scan, md5 2776c48ecd05d0b7eff94d09b895948e. PDF page = printed page + 7 up to printed p.81, then + 6 and later + 5.
# Tables 1-16 and 17-30 are transcribed here. Table 19 (meteoroid damage criteria) and Table 20 (ECLSS
#   component list) hold words only and are not transcribed.
# Method (three witnesses): (1) the NTRS text layer, which is garbage on the rotated table pages 21-35 (tables
#   1-16) and readable elsewhere; (2) a new tesseract layer (ocrmypdf --force-ocr, 250 dpi); (3) Apple Vision
#   on 200 dpi renders rotated upright (tables 1-16). Every number was then read by eye on the 200 dpi renders
#   (300 dpi crops where the scan is damaged) and the rows were checked by arithmetic closure (dates add up,
#   delta-V columns add up). No value was computed by us. Where a printed row fails closure, the printed value
#   is kept and the failure is listed under closure_exceptions.
# Units as printed: JD = Julian date minus 2440000; trip, stay and mission times in days; delta-V and entry
#   speed in "kps" (km/s) in tables 1-10 and "km/s" in 13-16. Values are strings, as printed.
# Mission-structure legend (tables 2-10): dv1 Earth departure increment, dv2 plane change increment, dv3
#   planetary orbit insertion increment, dvtp total transplanetary increment, dvte planetary departure
#   increment (return injection), entry_kps = Earth entry speed (or the target entry speed where the column is
#   labelled so). Each opportunity year has three rows for stay times 0, 30 and 60 days.
# Parking orbits: Mercury, Vesta, Ceres and (Ganymede) one planetary radius; Venus aerobraker and retrobraker
#   1000 km; Mars 800 km; Jupiter 14 Jupiter radii.

closure_exceptions:
  note: "Printed rows that fail arithmetic closure; kept as printed. Each was confirmed on the render. Not claimed as errors: rounding, midcourse allowances and trip times rounded to 5 days are all possible."
  items:
    - "T3 1990/7830/60: printed arrival 7990 but departure 7830 + trip 100 = 7930; printed departure from Venus also 7990 (= 7930 + 60)."
    - "T4 1991/8415/30 and 1991/8400/60: printed arrival JD is 5 days later than departure + trip (8555 against 8550; 8550 against 8535)."
    - "T5 1988/7350/0: dvtp + dvte = 8.23, printed total 8.28."
    - "T6 1986 (rows 1-3) and 1988 (rows 1-2): printed dvtp exceeds dv1 + dv2 + dv3 by 0.03 to 0.04 (for example 6.10 against 6.06); every other column closes."
    - "T7 1985/6070/0: arrival JD 6410 against departure 6070 + trip 330 = 6400; dv1 + dv2 + dv3 = 9.92 against printed dvtp 9.82."
    - "T8 1980/4550/0: arrival 4880 against 4550 + trip 300 = 4850, total time 745 against 715; the figures close if the trip time is 330."
    - "T8 1980/4545/30: dv1 + dv2 + dv3 = 14.96 against printed dvtp 15.00."
    - "T8 1989/7775/0: total time 800 against trip 385 + stay 0 + trip 405 = 790."
    - "T8 1989/7805/60: arrival 8140 against 7805 + trip 310 = 8115; departure 8175 closes with 8115 + 60."
    - "T11 outbound 1988/7210: dv1 + dvswing + dv3 + dv4 = 13.55 against printed dvttp 14.50; the printed mission total 21.46 matches 14.50 + 6.96."
    - "T16 1984/5643/30: dv1 + dv2 + dv3 = 12.25 against printed total 12.33. 1995/9660/0: 10.25 against 10.22."
    - "T15 all nine rows: printed total delta-V is 0.02 below dv1 + dv2 in rows 1-3 (8.06 against 8.08, 8.10 against 8.12, 8.08 against 8.10)."

