# Local presubmit: mirrors the CI lint job (.github/workflows/ci.yml).
# Activate once per clone with: uv run pre-commit install
# (#962) The installed .git/hooks/pre-commit records the absolute path of the
# venv python it was installed from. If `git commit` says "`pre-commit` not
# found", the hook came from another machine or clone path: re-run
# `uv run pre-commit install` in this clone (no PATH change needed after that).
# Run manually across the tree with: uv run pre-commit run --all-files
repos:
  # #1063: catalogue-window lock, FIRST so nothing else runs while a window is
  # open. NOTE: pre-commit stashes the unstaged files of the whole tree before
  # its first hook, so this entry alone still stashes and restores other agents'
  # files; scripts/githooks/pre-commit runs the same check BEFORE pre-commit and
  # is the real guard (enable once per clone: git config core.hooksPath
  # scripts/githooks). This entry covers clones that have not done that.
  - repo: local
    hooks:
      - id: window-lock
        name: catalogue window lock (#1063)
        entry: scripts/window_lock_check.sh
        language: system
        always_run: true
        pass_filenames: false
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.29.4
    hooks:
      - id: check-jsonschema
        files: ^data/catalogue\.yaml$
        args: ["--schemafile", "data/catalogue.schema.json"]
      - id: check-jsonschema
        name: check-jsonschema (cycler_networks.yaml)
        files: ^data/cycler_networks\.yaml$
        args: ["--schemafile", "data/cycler_network.schema.json"]
      - id: check-jsonschema
        name: check-jsonschema (manifold_connections.yaml)
        files: ^data/manifold_connections\.yaml$
        args: ["--schemafile", "data/manifold_connection.schema.json"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15  # keep in sync with the ruff dev-dependency in pyproject.toml
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # Mirrors the CI Mypy stage. Runs in the uv-managed venv so it sees
      # the same stubs/extras CI does (run `uv sync --all-extras` once).
      # Checks every TRACKED .py file under src/ and tests/ (the index, which
      # includes files staged by this commit), not just the staged ones, since
      # mypy is project-global; pass_filenames: false keeps pre-commit from
      # appending paths. #962: `mypy src tests` also read other agents'
      # UNTRACKED work-in-progress files in a shared checkout and failed
      # unrelated commits; CI checks out tracked files only, so this is the
      # same file set CI checks (pre-commit has stashed unstaged edits of
      # tracked files, so their content is the index content).
      - id: mypy
        name: mypy
        entry: bash -c 'exec uv run mypy $(git ls-files -- "src/*.py" "tests/*.py")'
        language: system
        types: [python]
        pass_filenames: false
      # Catalogue-ratchet gate (the 2026-06-19 #399 lesson): any
      # data/catalogue.yaml row add/remove/edit ripples into several frozen-
      # census ratchet tests + consumers (cycler_class / validation_tier /
      # rediscovery census, schema, multi-arc invariants, verdict-tier). A
      # missed ratchet turns CI red. This hook runs the census/ratchet gates on
      # the staged catalogue so the breakage surfaces locally, before push.
      # Fires ONLY when data/catalogue.yaml is staged (the only thing that moves
      # these counts); the slow optimizer-rediscovery test is excluded -- only
      # the fast census-classification assertions run (~70 s).
      # #1069 (owner decision 2026-10-12, "Hook trusts a fresh suite log"):
      # scripts/ratchet_hook.sh skips the re-run when the lead's window suite
      # left an ok record (scripts/suite_record.py) under an hour old, on
      # exactly the tree being committed, covering these targets; otherwise it
      # runs `uv run pytest` with the same arguments. verbose shows which.
      - id: catalogue-ratchets
        name: catalogue ratchets
        entry: >-
          scripts/ratchet_hook.sh
          tests/data/test_cycler_class_census.py
          tests/data/test_validation_tier_census.py
          tests/data/test_validate_catalogue.py
          tests/data/test_schema_v47_orbit_class.py
          tests/data/test_multi_arc_invariants.py
          tests/verify/test_verdict_tier_census.py
          tests/test_catalogue_rediscovery.py::test_census_breakdown_matches_frozen_ratchet
          tests/test_catalogue_rediscovery.py::test_census_classifies_every_entry_exactly_once
          tests/test_catalogue_rediscovery.py::test_census_constructible_set_agrees_with_loader
          -q
        language: system
        files: ^data/catalogue\.yaml$
        pass_filenames: false
        verbose: true
      # Cycler-network registry gate (task #570): any data/cycler_networks.yaml
      # edit (or a change to the schema/validator themselves) re-runs the
      # referential-integrity + taxi-cost cross-check ratchet locally, before
      # push -- mirrors the catalogue-ratchets hook above.
      - id: cycler-network-ratchets
        name: cycler network ratchets
        entry: uv run pytest tests/data/test_cycler_networks.py -q
        language: system
        files: ^(data/cycler_networks\.yaml|data/cycler_network\.schema\.json|src/cyclerfinder/data/validate_networks\.py)$
        pass_filenames: false
      # Manifold-connection registry gate (task #838 design, #856 implementation):
      # any data/manifold_connections.yaml edit (or a change to the schema/
      # validator themselves) re-runs the referential-integrity ratchet locally,
      # before push -- mirrors the cycler-network-ratchets hook above. Also fires
      # on a data/catalogue.yaml edit: a row_ref target could be renamed/removed.
      - id: manifold-connection-ratchets
        name: manifold connection ratchets
        # #1069: trusts a fresh window-suite record like catalogue-ratchets.
        entry: scripts/ratchet_hook.sh tests/data/test_manifold_connections.py -q
        language: system
        files: ^(data/manifold_connections\.yaml|data/manifold_connection\.schema\.json|src/cyclerfinder/data/validate_connections\.py|data/catalogue\.yaml)$
        pass_filenames: false
        verbose: true
